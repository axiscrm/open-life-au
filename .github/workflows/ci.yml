name: ✅ CI

# The contract is the product, so CI's job is to prove four things about it:
#
#   it is a valid OpenAPI 3.1 document and obeys our own style rules;
#   the committed dist/ bundle matches the source (insurers link to the bundle, so a stale one is
#     a published lie);
#   the worked examples still validate AND the invalid ones are still rejected — the second half
#     matters more, because a schema that accepts everything also passes its own examples;
#   nothing derived from a vendor specification has crept in.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    name: 📜 Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: 🔎 Lint
        run: npm run lint

      - name: 📦 Bundle
        run: npm run bundle

      # Insurers are told to consume dist/. If the committed bundle can drift from the source,
      # the published artefact and the reviewed source stop being the same contract.
      - name: 🚧 dist/ is up to date
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is stale. Run 'npm run bundle' and commit the result."
            exit 1
          fi

      - name: ✅ Examples validate
        run: npm run examples

      - name: 🛑 Invalid payloads are rejected
        run: npm run rejections

      - name: 🧬 Provenance
        run: npm run provenance

  # Validating examples in-process is not the same as posting them at a server. An earlier version of
  # this repo had examples that passed the local validator and were rejected 422 by the mock, because
  # the validator pre-processed them and a real server does not. Anyone copy-pasting an example — the
  # first thing someone evaluating a contract does — would have hit it. So the examples are posted at
  # a real mock here, and a non-200 fails the build.
  mock-roundtrip:
    name: 🔁 Every endpoint answers at the mock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run bundle

      - name: Start every mock
        run: |
          nohup node scripts/mock.mjs > /tmp/prism.log 2>&1 &
          for port in 4010 4011 4012; do
            for _ in $(seq 1 40); do
              curl -sf -o /dev/null "http://127.0.0.1:$port/capabilities" \
                -H 'Authorization: Bearer test' && break
              sleep 1
            done
          done

      # Drive the requests out of the COMMITTED Postman collections rather than a list written here.
      #
      # That is the point of this job. A hand-maintained list drifts the moment an operation is
      # added — silently, because a shorter list still passes — and the collection is the artefact an
      # insurer actually imports and runs. Exercising it directly means "the collection works" is a
      # tested claim rather than an assumption, and a new operation cannot reach main untested.
      - name: Send every collection request
        run: node scripts/check-mock.mjs

      - name: Mock log on failure
        if: failure()
        run: cat /tmp/prism.log

  # A valid OpenAPI document is not the same as a usable one. This contract leans on
  # oneOf + discriminator + unevaluatedProperties, which is precisely where generators diverge —
  # and they diverge SILENTLY or catastrophically rather than politely. openapi-generator once died
  # with a NullPointerException here and emitted nothing at all, blocking every Java implementer,
  # because the discriminant was pinned with `const` rather than a single-value `enum`. Nothing in
  # lint or schema validation catches that; only running the generators does.
  #
  # Every language the standard documents runs on every PR. They are matrix entries, so this is
  # parallel and costs wall-clock roughly one generator run, not six.
  codegen:
    name: 🏭 Generators (${{ matrix.lang }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [typescript, python, java, ruby, go, csharp]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run bundle

      # A JDK is needed by far more than the Java job: openapi-generator is a Java tool behind an
      # npm wrapper, and it is what generates Ruby, Go, C# — and one of the three TypeScript
      # options. Python is the only entry that does not need it.
      - uses: actions/setup-java@v4
        if: matrix.lang != 'python'
        with:
          distribution: temurin
          java-version: '21'
      - uses: astral-sh/setup-uv@v5
        if: matrix.lang == 'python'

      - name: Generate
        run: npm run codegen:${{ matrix.lang }}

  postman:
    name: 📮 Postman collection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run bundle
      - run: npm run postman
      - name: 🚧 Collection is up to date
        run: |
          if ! git diff --exit-code -- postman/; then
            echo "::error::postman/ is stale. Run 'npm run postman' and commit the result."
            exit 1
          fi

  docs:
    name: 📖 Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run docs
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: site/

  breaking:
    name: 💥 Breaking changes (${{ matrix.contract }})
    runs-on: ubuntu-latest
    # Only meaningful against a base branch.
    if: github.event_name == 'pull_request'
    # Every contract, not just quoting. This was a single hard-coded job against
    # dist/quoting/openapi.yaml, which meant the policy contract shipped and changed for weeks with
    # no breaking-change gate at all — and the gap was invisible, because the job was green the
    # whole time. A matrix entry per contract is the only shape where adding a domain cannot
    # silently leave it unguarded.
    strategy:
      fail-fast: false
      matrix:
        contract: [quoting, policy, requirements]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run bundle

      # Pinned binary rather than a floating container tag: the version is visible in the diff, the
      # download is checksum-verified, and there is no daemon to depend on. Bump deliberately.
      - name: Install oasdiff
        env:
          OASDIFF_VERSION: 1.27.0
        run: |
          cd /tmp
          asset="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}"
          curl -sSLf -o "$asset" "$base/$asset"
          curl -sSLf -o checksums.txt "$base/checksums.txt"
          grep " $asset\$" checksums.txt | sha256sum -c -
          tar xzf "$asset" oasdiff
          sudo install -m 0755 oasdiff /usr/local/bin/oasdiff
          oasdiff --version

      - name: Extract the base contract
        run: |
          mkdir -p /tmp/oasdiff
          # A brand-new contract has no base to compare against; an empty document makes every
          # change additive, which is correct for the first PR that introduces one.
          git show "origin/${{ github.base_ref }}:dist/${{ matrix.contract }}/openapi.yaml" \
            > /tmp/oasdiff/base.yaml 2>/dev/null \
            || printf 'openapi: 3.1.0\ninfo: {title: none, version: 0.0.0}\npaths: {}\n' \
               > /tmp/oasdiff/base.yaml
          cp dist/${{ matrix.contract }}/openapi.yaml /tmp/oasdiff/head.yaml

      # A breaking change is not forbidden — it is a decision that has to be taken deliberately,
      # with a migration note, rather than discovered by an insurer after they have shipped. Apply
      # the `breaking-change-approved` label to proceed.
      - name: Detect breaking changes
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'breaking-change-approved') }}
        run: |
          oasdiff breaking /tmp/oasdiff/base.yaml /tmp/oasdiff/head.yaml \
            --fail-on ERR --format githubactions

      # Always publish the human-readable changelog, breaking or not. "What changed in quoting
      # v0.3.0" is a question every implementer asks, and answering it from a diff of a 2,000-line
      # bundle is nobody's idea of a good time. Headed per contract, since three of these now write
      # into the same step summary.
      - name: Changelog for the PR
        run: |
          oasdiff changelog /tmp/oasdiff/base.yaml /tmp/oasdiff/head.yaml \
            > /tmp/oasdiff/changelog.txt || true
          if [ -s /tmp/oasdiff/changelog.txt ]; then
            {
              echo '## API changes — ${{ matrix.contract }}'
              echo '```'
              cat /tmp/oasdiff/changelog.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## API changes — ${{ matrix.contract }}' >> "$GITHUB_STEP_SUMMARY"
            echo '_No changes to this contract in this PR._' >> "$GITHUB_STEP_SUMMARY"
          fi
