name: 📖 Publish docs

# The single owner of the GitHub Pages deployment. Pages has one deployment target, so if this
# workflow and the release workflow both deployed it they would race and the published site would
# alternate between the released contract and the tip of main depending on which finished last.
#
# Publishing from main rather than only from a release is a deliberate trade. It means the site is
# always something we can send an insurer today, which matters far more at this stage than the site
# only ever showing a taggable version. Each page states which it is: `info.version` is kept in step
# with that contract's own `<name>-v*` tag by release-please, and the banner scripts/build-site.mjs
# adds says whether the build is that release or ahead of it.

on:
  push:
    branches: [main]
    paths:
      - core/**
      - domains/**
      - taxonomy/**
      - redocly.yaml
      - package.json
      - package-lock.json
      - scripts/build-site.mjs
      - .github/workflows/docs-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# @stoplight/prism-cli pulls in @scarf/scarf, whose postinstall pings Scarf on every `npm ci`.
# package.json turns it off too; this covers the case where npm cannot resolve the repo root.
env:
  SCARF_ANALYTICS: "false"

# Never cancel a Pages deploy in flight — a half-published site is worse than a stale one. Queue
# instead, so the last commit to land is the one that ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: 📖 Build and publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Renders every contract registered in redocly.yaml, stamps each page with its own version and
      # release state, and writes the landing page that links them together.
      #
      # All of that used to be inline in this workflow, stamping quoting only and redirecting `/`
      # straight at it. That was correct while quoting was the only contract and quietly wrong
      # afterwards — the policy reference was being published and nothing linked to it. It now lives
      # in scripts/build-site.mjs so that `npm run docs` produces exactly what gets published, and a
      # third contract needs no change here at all.
      - name: Build the site
        run: npm run docs

      # `enablement: true` turns Pages on for the repository if it is not already, rather than
      # failing with "Get Pages site failed" and requiring someone to click through Settings first.
      # One less manual step between a fresh clone of this setup and a published site.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/
      - id: deploy
        uses: actions/deploy-pages@v4
