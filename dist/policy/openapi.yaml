openapi: 3.1.0
info:
  title: Open Life Policy API (AU)
  version: 0.1.0
  summary: A vendor-neutral contract for retrieving in-force Australian life policy data.
  description: |
    A contract an insurer implements so that adviser software can retrieve the policies written under
    its adviser codes — instead of logging into a portal every night, exporting a spreadsheet, and
    parsing whatever layout that insurer happens to use this quarter.

    ## What this is

    Four operations. Pull the book as a snapshot (`GET /policies`), pull the arrears worklist
    (`GET /arrears`), fetch one policy (`GET /policies/{policy_id}`), and find out what the
    implementation supports (`GET /capabilities`).

    Most consumers will call the first once a day and the second rather more often. Only
    `GET /policies` and `GET /capabilities` are required; an insurer whose collections data lives
    apart from its in-force book may implement `GET /arrears` on its own, and that is a conformant
    implementation.

    ## Snapshot, not stream

    The required path is a **full snapshot**: everything currently in force, paged. That is
    deliberate, and it is the smallest thing an insurer can build — for most, it is a report they
    already produce.

    It also carries a property a change feed does not. Because the snapshot is complete, a policy
    that has *disappeared* since the last run is no longer in force. There are no tombstones to
    publish, no missed-event problem, and a failed run is self-correcting: the next one restates the
    truth. A change feed gets none of that for free — miss one event and a consumer's view is
    permanently wrong with nothing to signal it.

    The cost is that a snapshot moves the whole book every time. An insurer with a large one may also
    offer `changed_since`; that is declared in `capabilities` as an optimisation, never a
    replacement, because an incremental feed that omits terminations cannot detect a lapse.

    **The one thing to get right:** absence only means "gone" once the whole walk has finished. A
    partial walk makes unfetched policies look absent, and a consumer that reconciles off it will
    lapse most of a book from a response that is entirely well-formed. Hence `snapshot_id`,
    `total_count` and `complete` — see `GET /policies`.

    ## Arrears

    A policy behind on premium carries an `arrears` block: when the payment failed, what is
    outstanding, why, and when it will lapse if nothing is done. This is the most time-sensitive
    record in the contract — it is what an adviser must act on within days — and it is the part
    currently obtained by scraping a portal overnight.

    The same records are also served as a worklist of their own by `GET /arrears`, which exists
    because on the insurer's side collections and the in-force book are usually different reports
    from different systems on different cadences. Serving them separately lets an insurer offer the
    urgent one at the freshness it needs — and lets an insurer that only has the arrears report
    implement something useful rather than nothing. Absence means something weaker on that
    operation than it does on `GET /policies`; the difference is spelled out there and it matters.

    ## Personal information

    Unlike the quoting contract, which carries none, this one carries the policy holder's name, date
    of birth and contact details. That is not an inconsistency. A quote is broadcast to a panel of
    insurers who have no relationship with the person, so it is anonymised. A policy record describes
    an existing contract between this insurer and this person — the insurer already holds all of it —
    and the data is unusable without enough identity to match it to a client record.

    Responses are therefore `Cache-Control: no-store`, and `PolicyHolder` is a closed schema
    deliberately scoped to matching rather than being a general contact record.

    ## Conformance

    Insurer records differ in what they carry. Declare what you populate in `GET /capabilities` and
    the conformance suite tests you against that. What is not optional is the snapshot being
    complete and consistent — everything else in this contract depends on it.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Open Life Data Standards (AU)
    url: https://github.com/axiscrm/open-life-au
servers:
  - url: https://{host}/{basePath}
    description: An insurer's implementation.
    variables:
      host:
        default: api.insurer.example.com.au
      basePath:
        default: openlife/policy/v1
security:
  - oauth2:
      - policies.read
tags:
  - name: Policies
    description: Retrieving in-force policy data.
  - name: Discovery
    description: What an implementation supports.
paths:
  /policies:
    get:
      operationId: listPolicies
      summary: Pull a snapshot of the book
      description: |-
        Return every policy the calling credential can see, as a consistent snapshot, paged.
        This is the contract's primary operation and for most consumers the only one they will call: once a day, walk every page, reconcile against what you hold.
        ### Reconciling on absence — read this before you do it
        A snapshot's value is that a policy which has *disappeared* since the last run is no longer in force. No tombstones needed, and a bad run self-corrects because the next one restates the truth.
        That rule is only safe once the **entire** walk has completed. A walk that stops halfway makes every unfetched policy look absent, and reconciling off it will mark most of a book as lapsed — from a response that is well-formed, valid, and completely wrong.
        So before acting on absence, a consumer MUST have:
        - reached a page with `complete: true`; - seen the same `snapshot_id` on every page; and - where `total_count` was supplied, assembled that many policies.
        If any of those fails, treat the run as failed and keep the previous state. Some of the book is better than a book that has been wrongly lapsed.
        ### Scope
        Absence means "not in force" only within `coverage`. A snapshot filtered to two adviser codes says nothing about a third, and a default snapshot says nothing about policies in a status it does not include.
        ### Personal information
        Responses carry the policy holder's name, date of birth and contact details, because the record is useless without enough identity to match it to a client. Servers MUST send `Cache-Control: no-store`.
      tags:
        - Policies
      security:
        - oauth2:
            - policies.read
      parameters:
        - $ref: '#/components/parameters/AdviserCodes'
        - $ref: '#/components/parameters/Statuses'
        - $ref: '#/components/parameters/ChangedSince'
        - $ref: '#/components/parameters/SnapshotId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: One page of the snapshot. An empty `policies` array on the first page is a valid answer meaning this credential has no policies — not an error, and not a reason to lapse anything unless `complete` is `true`.
          headers:
            Cache-Control:
              description: MUST be `no-store`.
              required: true
              schema:
                type: string
                const: no-store
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-OpenLife-Spec-Version:
              $ref: '#/components/headers/SpecVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The cursor belongs to a snapshot that has expired or been rebuilt. Problem type `snapshot-expired`. Start the walk again from the beginning; do NOT stitch the pages already fetched onto a new snapshot, because the two views may disagree and the seam is exactly where policies go missing.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /policies/{policy_id}:
    get:
      operationId: getPolicy
      summary: Fetch one policy
      description: |-
        Return a single policy by the insurer's own policy number.
        Not part of the daily pull — a consumer reconciling a book uses the snapshot. This exists for the case an adviser is looking at one client and wants the insurer's current record rather than whatever last night's run captured, and for investigating a discrepancy between the two.
        Carries the policy holder's personal information, so servers MUST send `Cache-Control: no-store`.
      tags:
        - Policies
      security:
        - oauth2:
            - policies.read
      parameters:
        - $ref: '#/components/parameters/PolicyIdPath'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The policy.
          headers:
            Cache-Control:
              description: MUST be `no-store`.
              required: true
              schema:
                type: string
                const: no-store
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /arrears:
    get:
      operationId: listArrears
      summary: Pull the arrears worklist
      description: |-
        Return every policy the calling credential can see that is currently behind on premium, as a consistent snapshot, paged.
        This is the most time-sensitive operation in the standard. A dishonour found the same morning is a phone call; the same dishonour found four days later is often a lapsed policy. It is also the part consumers obtain today by scraping a portal overnight.
        ### Optional, and independently implementable
        OPTIONAL — declare it in `capabilities.arrears_snapshot.supported`, and reject it with `422` where unsupported rather than returning an empty worklist. An empty worklist means "nobody is behind", which is the single most dangerous thing an unimplemented endpoint could say.
        It does not require `GET /policies`. On the insurer's side the arrears list and the in-force book are usually different reports from different systems, and an insurer that can serve this one alone should serve it: implementing only this operation is a conformant, and useful, implementation.
        ### Reconciling on absence — the rule is weaker here
        The snapshot discipline is the same as `GET /policies`: before acting on absence a consumer MUST have reached `complete: true`, seen one unchanging `snapshot_id` across every page, and assembled `total_count` distinct policies. A partial walk makes unfetched rows look absent.
        What absence MEANS is weaker. A policy that has dropped out of this worklist is no longer in arrears — but that is either because it was **paid** or because it **lapsed**, and this response does not say which. Those call for opposite actions. A consumer that needs to distinguish them MUST read the policy's status from `GET /policies` or `GET /policies/{policy_id}` rather than assuming the happy case.
        ### Personal information
        Rows carry the policy holder's name and contact details — an arrears row nobody can telephone is not actionable. Servers MUST send `Cache-Control: no-store`.
      tags:
        - Policies
      security:
        - oauth2:
            - policies.read
      parameters:
        - $ref: '#/components/parameters/AdviserCodes'
        - $ref: '#/components/parameters/ExpectedLapseBefore'
        - $ref: '#/components/parameters/ChangedSince'
        - $ref: '#/components/parameters/SnapshotId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: One page of the arrears worklist. An empty `items` array on a `complete` first page means nobody under this credential is currently behind — a normal answer, not an error.
          headers:
            Cache-Control:
              description: MUST be `no-store`.
              required: true
              schema:
                type: string
                const: no-store
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-OpenLife-Spec-Version:
              $ref: '#/components/headers/SpecVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrearsPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The cursor belongs to a snapshot that has expired or been rebuilt. Problem type `snapshot-expired`. Start the walk again from the beginning; do NOT stitch the pages already fetched onto a new snapshot.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: This implementation does not serve an arrears worklist, or a supplied parameter is not supported. Problem type `unsupported-operation`. Returned rather than an empty worklist, deliberately — see the description above.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /capabilities:
    get:
      operationId: getPolicyCapabilities
      summary: What this implementation supports
      description: |-
        Describe which parts of the record this insurer populates, how long a snapshot stays walkable, and whether incremental pulls or pushed events are available.
        Worth calling before the first snapshot and caching thereafter. The `fields` block in particular answers a question a consumer otherwise cannot: whether a missing `arrears` means this policy is paid up, or means this insurer never reports arrears at all. Those look identical in the data and lead to very different conclusions about a book.
      tags:
        - Discovery
      security:
        - oauth2:
            - policies.read
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The capability document.
          headers:
            ETag:
              description: Servers SHOULD supply one and honour `If-None-Match`.
              schema:
                type: string
            Cache-Control:
              description: Safe to cache — carries no personal information.
              schema:
                type: string
                example: public, max-age=3600
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '304':
          description: Not modified.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
webhooks:
  policyStatusChanged:
    post:
      operationId: onPolicyStatusChanged
      x-openlife-webhook: true
      security:
        - webhookSignature: []
      summary: A policy changed status
      description: Sent when a policy moves between statuses — commenced, lapsed, cancelled, terminated. The consumer's own snapshot remains authoritative; this is a prompt to look sooner, not a replacement for reconciliation.
      tags:
        - Policies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event_type
                - event_id
                - occurred_at
                - policy_version
                - policy_id
                - insurer_id
                - status
              additionalProperties: false
              properties:
                event_type:
                  description: 'Which event this is. Required, and it must be IN the payload: OpenAPI webhook keys are names rather than URLs, so a consumer that publishes one endpoint for all three would otherwise have to classify by sniffing which optional members are present. That happens to be decidable for these three and stops being decidable the moment a fourth is added. Matches `capabilities.webhooks.events`.'
                  type: string
                  const: policy.status_changed
                event_id:
                  description: Unique per event. Delivery is at-least-once, so consumers MUST deduplicate on this rather than assuming exactly-once.
                  type: string
                  maxLength: 128
                policy_version:
                  $ref: '#/components/schemas/PolicyVersion'
                occurred_at:
                  type: string
                  format: date-time
                policy_id:
                  type: string
                  maxLength: 64
                insurer_id:
                  $ref: '#/components/schemas/InsurerId'
                status:
                  $ref: '#/components/schemas/PolicyStatus'
                previous_status:
                  $ref: '#/components/schemas/PolicyStatus'
      responses:
        '204':
          description: Accepted. Consumers SHOULD acknowledge quickly and process asynchronously; an insurer's delivery timeout is not the place to do reconciliation work.
        '410':
          $ref: '#/components/responses/Gone'
  policyArrearsRaised:
    post:
      operationId: onPolicyArrearsRaised
      x-openlife-webhook: true
      security:
        - webhookSignature: []
      summary: A premium payment was dishonoured
      description: 'Sent when a scheduled premium fails. The highest-value event in the contract: it is the one with a deadline attached, and `expected_lapse_on` is what makes it actionable.'
      tags:
        - Policies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event_type
                - event_id
                - occurred_at
                - policy_version
                - policy_id
                - insurer_id
                - arrears
              additionalProperties: false
              properties:
                event_type:
                  type: string
                  const: policy.arrears_raised
                event_id:
                  type: string
                  maxLength: 128
                policy_version:
                  $ref: '#/components/schemas/PolicyVersion'
                occurred_at:
                  type: string
                  format: date-time
                policy_id:
                  type: string
                  maxLength: 64
                insurer_id:
                  $ref: '#/components/schemas/InsurerId'
                arrears:
                  $ref: '#/components/schemas/Arrears'
      responses:
        '204':
          description: Accepted.
        '410':
          $ref: '#/components/responses/Gone'
  policyArrearsCleared:
    post:
      operationId: onPolicyArrearsCleared
      x-openlife-webhook: true
      security:
        - webhookSignature: []
      summary: Outstanding premium was paid
      description: 'Sent when a policy previously in arrears is brought up to date. Worth pushing as well as the failure: without it a consumer keeps chasing a client who has already paid, which is a worse experience than not having known at all.'
      tags:
        - Policies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event_type
                - event_id
                - occurred_at
                - policy_version
                - policy_id
                - insurer_id
                - dishonoured_on
              additionalProperties: false
              properties:
                event_type:
                  type: string
                  const: policy.arrears_cleared
                event_id:
                  type: string
                  maxLength: 128
                policy_version:
                  $ref: '#/components/schemas/PolicyVersion'
                occurred_at:
                  type: string
                  format: date-time
                policy_id:
                  type: string
                  maxLength: 64
                insurer_id:
                  $ref: '#/components/schemas/InsurerId'
                dishonoured_on:
                  description: 'Which failure was cleared, identifying it by the same `dishonoured_on` the arrears entry carried. Required: a policy can have several outstanding instalments, and without this a consumer cannot tell which one to close — and out of order, a January clearance arriving after a February failure would wipe a live alert already past its expected lapse date.'
                  type: string
                  format: date
                paid_to:
                  type: string
                  format: date
      responses:
        '204':
          description: Accepted.
        '410':
          $ref: '#/components/responses/Gone'
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: |
        OAuth 2.0 client credentials (RFC 6749, section 4.4). Machine-to-machine only.

        The credential determines which adviser codes the caller can see, which is what makes a
        snapshot's absence semantics safe: a consumer can only ever be told about, and therefore only
        ever lapse, policies within its own scope.

        Servers SHOULD publish an RFC 8414 metadata document. mTLS MAY additionally be required —
        this contract carries personal information, and some insurers will want it.
      flows:
        clientCredentials:
          tokenUrl: https://auth.insurer.example.com.au/oauth2/token
          refreshUrl: https://auth.insurer.example.com.au/oauth2/token
          scopes:
            policies.read: Read in-force policy data for the credential's adviser codes.
    webhookSignature:
      type: apiKey
      in: header
      name: X-OpenLife-Signature
      description: |
        Signature over a webhook delivery. REQUIRED on every delivery for any insurer that pushes.

        The direction is inverted from everything else here: on a webhook the CONSUMER is the server
        and the insurer is the client, so the OAuth2 credential above does not apply and there is
        nothing else authenticating the request. Without a signature a consumer's endpoint is an
        unauthenticated write to its policy state.

        Format: `t=<unix-seconds>,v1=<hex>`, where `v1` is the HMAC-SHA256 of `<t>.<raw request body>`
        using a shared secret exchanged out of band. Sign the RAW body — re-serialising before signing
        is the usual cause of signatures that verify locally and fail in production.

        A consumer MUST reject a delivery whose signature does not verify, and MUST reject one whose
        `t` is outside a tolerance of its own choosing (five minutes is typical) so a captured
        delivery cannot be replayed indefinitely. Rejections SHOULD be `401`.

        mTLS is an acceptable alternative where both parties can manage certificates; it is not a
        substitute for `event_id` deduplication, which is about retries rather than authenticity.
  parameters:
    AdviserCodes:
      name: adviser_code
      in: query
      description: |-
        Restrict the snapshot to these adviser codes. Repeat the parameter for several. Omitted, the snapshot covers every code the credential can see — which is the normal case for a daily pull.
        Whatever is applied comes back in `coverage.adviser_codes`, so a consumer can tell an excluded code from an adviser with no policies.
      required: false
      explode: true
      schema:
        type: array
        items:
          type: string
          maxLength: 32
    Statuses:
      name: status
      in: query
      description: |-
        Restrict to these statuses. Repeat for several. Omitted, an implementation returns its in-force set — `in_force`, `in_arrears` and `pending` — which is what a servicing book needs.
        Requesting a terminal status only works where `capabilities.snapshot.supports_terminated` is true; elsewhere it is a `422`.
      required: false
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/PolicyStatus'
    ChangedSince:
      name: changed_since
      in: query
      description: |-
        OPTIONAL, and only where `capabilities.incremental.supported` is true. Return policies changed since this instant instead of the full book.
        Read `capabilities.incremental.reports_terminations` before relying on it: an incremental response that omits ended policies cannot be used on its own, because a lapse is invisible in a feed that only reports what still exists. Used that way, a consumer's view drifts further from reality every day and nothing signals it. Pull a periodic full snapshot regardless.
        An implementation that does not support this MUST reject it with `422` rather than silently ignoring it and returning everything — a consumer that believes it received a delta and actually received the whole book will draw the wrong conclusions about what changed.
      required: false
      schema:
        type: string
        format: date-time
    SnapshotId:
      name: snapshot_id
      in: query
      description: Continue an in-progress walk. Supply the `snapshot_id` from the first page alongside the cursor, so the server can prove the cursor belongs to the snapshot the consumer thinks it is walking and reject it with `409` if the snapshot has since expired or been rebuilt.
      required: false
      schema:
        type: string
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      description: Continuation token from the previous page's `page.next_cursor`.
      required: false
      schema:
        $ref: '#/components/schemas/Cursor'
    Limit:
      name: limit
      in: query
      description: Maximum policies per page. A server MAY return fewer; completion is signalled by `complete` and the absence of `page.next_cursor`, never by a short page.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 250
    RequestId:
      name: X-Request-Id
      in: header
      description: Consumer-supplied correlation identifier. Echoed on the response.
      required: false
      schema:
        type: string
        maxLength: 128
    PolicyIdPath:
      name: policy_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    ExpectedLapseBefore:
      name: expected_lapse_before
      in: query
      description: |-
        OPTIONAL. Restrict the worklist to policies expected to lapse on or before this date — the triage a consumer actually wants when the worklist is longer than the day allows.
        An implementation that does not support it MUST reject it with `422` rather than ignoring it. Silently returning the whole worklist to a consumer that asked for "lapsing this week" presents every row as urgent, which is worse than not offering the filter: the consumer works the list top-down believing it is prioritised.
        Rows whose `expected_lapse_on` is absent are EXCLUDED when this filter is applied, because they cannot be shown to satisfy it. An insurer that does not populate `expected_lapse_on` therefore returns an empty worklist under this filter, which is why it is gated on `capabilities.fields.expected_lapse_date` as well.
      required: false
      schema:
        type: string
        format: date
  schemas:
    PolicyStatus:
      title: PolicyStatus
      description: |-
        The policy's state. A snapshot contains in-force business by default; the terminal states appear only where an insurer chooses to report recent history, and a consumer MUST NOT treat their presence as a promise that all historical policies are included.
          - `in_force`   current and paid to date
          - `in_arrears` current but behind on premium — still on risk, see `arrears`
          - `pending`    accepted but not yet commenced
          - `lapsed`     ended for non-payment
          - `cancelled`  ended at the owner's request
          - `terminated` ended for any other reason, including claim or expiry
      type: string
      enum:
        - in_force
        - in_arrears
        - pending
        - lapsed
        - cancelled
        - terminated
    Cursor:
      title: Cursor
      description: Opaque continuation token. Consumers MUST treat it as opaque, MUST NOT construct one, and MUST NOT assume it remains valid indefinitely — a server MAY expire cursors and answer an expired one with 400 `invalid-request`.
      type: string
      minLength: 1
      maxLength: 512
    SnapshotMode:
      title: SnapshotMode
      description: |-
        Whether this response is a FULL snapshot or an INCREMENTAL delta.
        Required, and load-bearing. Without it the two are byte-indistinguishable: an incremental response carries the same envelope, the same `complete: true`, and a `total_count` that matches the handful of changed records — so it passes every reconciliation gate, and a consumer that applies it will remove everything that did not happen to change. A stray `changed_since` from configuration or a retry wrapper is enough to trigger it.
        **Absence carries NO meaning when `mode` is `incremental`.** A consumer MUST refuse to run absence-based reconciliation on anything but `full`.
      type: string
      enum:
        - full
        - incremental
    SnapshotId:
      title: SnapshotId
      description: |-
        Identifies this consistent view.
        MUST be unique per generation and MUST NOT be reused. Deriving it from a business date is not sufficient: a re-run of the same night's extract under the same id lets a consumer stitch half of one view onto half of another while every page agrees on the identifier, which is the exact seam this field exists to prevent. Compare `generated_at` as well. Opaque, and stable for the whole walk.
        A server MUST hold the snapshot stable while it is being paged: records must not shift between pages because the underlying data changed mid-walk. Where an implementation cannot do that, it MUST issue a new `snapshot_id` and reject the stale cursor with `409` rather than quietly serving a mixture of two views — a consumer that reconciles across a shifted boundary loses rows in exactly the way this file exists to prevent.
      type: string
      minLength: 1
      maxLength: 128
    SnapshotGeneratedAt:
      title: SnapshotGeneratedAt
      description: When the snapshot was taken. RFC 3339 with an explicit offset.
      type: string
      format: date-time
    SnapshotTotalCount:
      title: SnapshotTotalCount
      description: |-
        Total records in the snapshot, counted as DISTINCT identities across all pages.
        MUST be identical on every page bearing the same `snapshot_id`. A consumer MUST fail the run if it varies mid-walk, because a changing total means the underlying view moved and the pages already fetched no longer describe one set.
        Counted distinct, and compared distinct, deliberately: a cursor that emits one record twice and skips another leaves the assembled COUNT correct while a live record is missing. Compare the size of the distinct set of identities assembled — not the number of items received.
      type: integer
      minimum: 0
    PolicyNumber:
      title: PolicyNumber
      description: |-
        The insurer's own policy or plan number, as it appears on correspondence and in the adviser portal. Stable for the life of the policy.
        Shared rather than defined per contract because this is the JOIN. A policy record, an arrears row and a commission line are three systems' views of the same contract, and they are matched on this value and nothing else — so two contracts carrying two independently-worded rules for it would eventually mean two subtly different keys and a reconciliation that half-matches.
        SEND IT BARE. No surrounding whitespace, and no quoting of any kind — in particular not the leading apostrophe a spreadsheet export adds to stop a number-like string being coerced. A policy that arrives quoted on one run and plain on the next is two policies as far as a consumer is concerned. One live extract carried 5,373 quoted rows against 46,314 plain ones, the same policies under two keys, with nothing in the data to signal it.
        CONSUMERS: MATCH ON THE WHOLE VALUE. Do not split it. A normalisation that keeps only the leading segment of a hyphenated number is in production somewhere today and works only because no insurer currently in scope issues a hyphenated policy number — the first one that does loses everything after the hyphen, silently, and matches against the wrong policy or none at all.
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[^\s'"](?:.*[^\s'"])?$
      examples:
        - P-4471902
    PolicyVersion:
      title: PolicyVersion
      description: |-
        A per-policy version that increases on every change the insurer records. Optional on a snapshot but strongly RECOMMENDED, and REQUIRED on every webhook.
        It is what makes ordering decidable. `generated_at` is snapshot-wide, so it cannot say whether a particular row already reflects a change an event is reporting; and `occurred_at` is not guaranteed monotonic and offers no tiebreak for equal timestamps. With a version, a consumer applies an event only when it exceeds the version already held for that policy, and can tell whether the snapshot in hand is newer than an event that arrived after it.
        Monotonic per policy. It carries no meaning across policies and MUST NOT be compared between them.
      type: integer
      minimum: 1
    InsurerId:
      title: InsurerId
      description: Stable identifier for the issuing insurer, assigned by this standard's registry so it is the same value at every implementer. Lowercase, hyphenated.
      type: string
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,30}[a-z0-9])$
      examples:
        - example-life
    BrandId:
      title: BrandId
      description: Stable identifier for the brand a line is sold under. Equal to the `InsurerId` where the insurer sells under a single brand. REQUIRED on every priced line even from a single-insurer endpoint, because one insurer commonly issues several brands and a consumer must not have to infer the brand from a product name.
      type: string
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,30}[a-z0-9])$
      examples:
        - example-life
        - example-select
    ProductName:
      title: ProductName
      description: The insurer's own marketing name for a product, verbatim, for display only.
      type: string
      minLength: 1
      maxLength: 200
      examples:
        - Protection Plus Life Cover
    PolicyStatusResponse:
      title: PolicyStatusResponse
      description: |-
        RESPONSE-facing policy status. Extensible: an insurer may report a state this version does not name — a premium holiday or waiver in effect is a real one — and a consumer MUST pass it through rather than failing the page, which would abort the walk and reconcile nothing that night.
        Known values: [in_force, in_arrears, pending, lapsed, cancelled, terminated].
      type: string
      x-extensible-enum:
        - in_force
        - in_arrears
        - pending
        - lapsed
        - cancelled
        - terminated
    Gender:
      title: Gender
      description: The gender used for rating. Life insurance rate tables in this market are published for two values, so this enum carries only those two; it describes a pricing input, not the insured's identity, and it is deliberately separate from any demographic field a CRM might hold.
      type: string
      enum:
        - male
        - female
    Decimal:
      title: Decimal
      description: A fixed-point decimal amount serialised as a string, with at most two fractional digits. Scientific notation, thousands separators, currency symbols and leading `+` are not permitted. Implementations MUST NOT normalise `"0.00"` to `"0"` or vice versa when echoing a value back — but consumers MUST treat the two as numerically equal.
      type: string
      pattern: ^-?\d{1,12}(\.\d{1,2})?$
      examples:
        - '1234.56'
        - '0'
        - '-19.95'
    Money:
      title: Money
      description: An amount of money. Currency is carried explicitly even though this standard is Australia-only, so a future market does not become a breaking change.
      type: object
      required:
        - amount
        - currency
      additionalProperties: false
      properties:
        amount:
          $ref: '#/components/schemas/Decimal'
        currency:
          title: CurrencyCode
          description: ISO 4217 alphabetic code. Only AUD is defined by this version of the standard.
          type: string
          const: AUD
      examples:
        - amount: '1000000.00'
          currency: AUD
    NonNegativeMoney:
      title: NonNegativeMoney
      description: Money that cannot be negative — sums insured, premiums, stamp duty, policy fees. A negative value here is always a defect, so it is rejected at the schema boundary rather than surfacing as a nonsensical premium.
      allOf:
        - $ref: '#/components/schemas/Money'
        - properties:
            amount:
              type: string
              pattern: ^\d{1,12}(\.\d{1,2})?$
    AustralianState:
      title: AustralianState
      description: State or territory of residence. Required because stamp duty on life insurance is levied per jurisdiction, so the same cover carries a different total depending on this value.
      type: string
      enum:
        - NSW
        - VIC
        - QLD
        - SA
        - WA
        - TAS
        - NT
        - ACT
    PostalAddress:
      title: PostalAddress
      description: 'An Australian postal address as held on the policy. Every field optional: insurer exports vary in how much they carry, and a partial address is still useful for matching.'
      type: object
      additionalProperties: false
      properties:
        line1:
          type: string
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        suburb:
          type: string
          maxLength: 100
        state:
          $ref: '#/components/schemas/AustralianState'
        postcode:
          type: string
          pattern: ^\d{4}$
    PolicyHolder:
      title: PolicyHolder
      description: The life insured, as the insurer holds them. Enough to reconcile against a client record in the consumer's system, and no more — this is not a general contact record and MUST NOT be extended into one.
      type: object
      required:
        - last_name
      additionalProperties: false
      properties:
        client_id:
          description: |-
            The insurer's own identifier for this person as a PARTY, stable across every policy they hold with this insurer. Optional, because not every insurer's book is keyed this way.
            Where it exists it is worth far more than it looks. Without it, a consumer holding two policies from one insurer can only decide whether they belong to the same person by matching name and date of birth — which fails on a married name, a legal name against a preferred one, and every transcription difference between two systems, and which false-matches on a common name sharing a birthday. Both failure modes are silent, and the second attaches a policy to the wrong client.
            Scoped to the issuing insurer. It carries no meaning at another insurer and MUST NOT be compared across them.
          type: string
          maxLength: 64
        first_name:
          type: string
          maxLength: 100
        middle_name:
          type: string
          maxLength: 100
        last_name:
          description: |-
            Send it in its natural mixed case, as the person writes it. NOT upper-cased.
            This looks like presentation and is not. Case is destroyed in one direction only: a consumer receiving "MCDONALD", "O'BRIEN" or "DE VRIES" cannot mechanically recover "McDonald", "O'Brien" or "de Vries", because no rule distinguishes them from "Mcdonald", "Obrien" and "De Vries" — and the surnames this mangles are not evenly distributed across the population. An insurer whose store holds the name correctly and upper-cases it on the way out is discarding information nothing downstream can reconstruct.
          type: string
          minLength: 1
          maxLength: 100
        date_of_birth:
          description: RFC 3339 full-date. Present here, unlike in the quoting contract, because name plus date of birth is what makes a reliable match against an existing client record — a name alone is not unique enough to attach a policy to the right person, and attaching it to the wrong one is worse than failing to match.
          type: string
          format: date
        gender:
          $ref: '#/components/schemas/Gender'
        smoker:
          description: Smoker status as recorded at underwriting, per this insurer's definition.
          type: boolean
        occupation:
          description: 'The occupation as recorded on the policy, in the insurer''s own wording. Free text: this is a historical record of what was underwritten, not a rating input, so it is deliberately not constrained to the occupation taxonomy the quoting contract uses.'
          type: string
          maxLength: 200
        occupation_class:
          description: The occupation rating class the policy was written at, in the insurer's own notation.
          type: string
          maxLength: 32
        annual_income:
          description: Income as recorded at underwriting, where the insurer holds it.
          $ref: '#/components/schemas/NonNegativeMoney'
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 50
        address:
          $ref: '#/components/schemas/PostalAddress'
    OwnershipResponse:
      title: OwnershipResponse
      description: |-
        RESPONSE-facing Ownership. Same meaning as `Ownership`, but extensible: a consumer MUST pass an unrecognised value through for display rather than failing, so that adding to the ownership forms is a minor release rather than a major one.
        Known values: [super, ordinary, smsf, superlink, smsf_superlink]. Validate against `Ownership` when SENDING; tolerate anything when RECEIVING.
      type: string
      x-extensible-enum:
        - super
        - ordinary
        - smsf
        - superlink
        - smsf_superlink
    PolicyOwnership:
      title: PolicyOwnership
      type: object
      additionalProperties: false
      properties:
        ownership_type:
          $ref: '#/components/schemas/OwnershipResponse'
        owner_name:
          description: |-
            The legal owner where it is not the life insured — a superannuation trustee, an SMSF, a company, or another individual.
            Send it as the entity is legally named, and do not case-normalise it. These are mostly entity names rather than personal ones, so a consumer applying title case to them produces "Abc Super Fund Pty Ltd" and "Smith Smsf" — and a consumer receiving one MUST NOT re-case it either.
          type: string
          maxLength: 255
    Distribution:
      title: Distribution
      description: |-
        Who wrote and services this business. This is the insurer's view of the adviser relationship, which is what makes the record attributable in the consumer's system.
        Note the boundary: everything here is the INSURER's record. A consumer's own grouping — which internal team or user group owns the client — is not the insurer's to know and has no field here.
      type: object
      additionalProperties: false
      properties:
        adviser_code:
          description: The adviser or agency code the policy is written under, as issued by this insurer. The primary attribution key.
          type: string
          maxLength: 32
        adviser_name:
          type: string
          maxLength: 255
        practice_name:
          description: The practice or firm, where the insurer distinguishes it from the adviser.
          type: string
          maxLength: 255
        licensee_name:
          description: The licensee the adviser operates under.
          type: string
          maxLength: 255
        licensee_code:
          type: string
          maxLength: 32
        practice_code:
          description: 'The practice identifier, where the insurer issues one. Mirrors `licensee_code`, and worth carrying: grouping a book by `practice_name` alone silently merges two practices trading under the same name, landing commission attribution on the wrong one. Live insurer feeds already publish this.'
          type: string
          maxLength: 32
        new_business_split_percent:
          description: Share of upfront commission attributed to this adviser code, as a percentage 0-100.
          type: number
          minimum: 0
          maximum: 100
          multipleOf: 0.001
        trail_split_percent:
          description: Share of ongoing commission attributed to this adviser code, as a percentage 0-100.
          type: number
          minimum: 0
          maximum: 100
          multipleOf: 0.001
    PolicyDates:
      title: PolicyDates
      description: All RFC 3339 full-dates. Every field optional — insurer records vary in what they keep.
      type: object
      additionalProperties: false
      properties:
        commenced_on:
          description: Risk commencement date.
          type: string
          format: date
        renewal_on:
          description: Next policy anniversary.
          type: string
          format: date
        paid_to:
          description: The date premiums are paid up to. Together with `arrears`, this is how a consumer tells a healthy policy from one heading for lapse.
          type: string
          format: date
        next_billing_on:
          type: string
          format: date
        expires_on:
          description: Scheduled expiry, for benefits with a fixed term or expiry age.
          type: string
          format: date
        terminated_on:
          description: Date the policy actually ended. Present on the terminal statuses.
          type: string
          format: date
        duration_years:
          description: Completed years in force. Convenience only — derivable from `commenced_on`.
          type: integer
          minimum: 0
    Frequency:
      title: Frequency
      description: |-
        How often the premium is paid. A premium at a sub-annual frequency is NOT the annual premium divided by the number of periods: insurers apply a frequency loading, so `monthly x 12 >= annual`. Consumers MUST therefore read the frequency they need rather than deriving it.
        Not every insurer sells every frequency. A priced line carries `monthly` and `annual` always and the other four only where the insurer quotes them — see `PremiumSet`, which also says how an insurer declares the ones it does not. A frequency this enum can name is not thereby a frequency any given product can be billed at.
      type: string
      enum:
        - weekly
        - fortnightly
        - monthly
        - quarterly
        - half_yearly
        - annual
    StructureResponse:
      title: StructureResponse
      description: |-
        RESPONSE-facing Structure. Same meaning as `Structure`, but extensible: a consumer MUST pass an unrecognised value through for display rather than failing, so that adding to the premium structures is a minor release rather than a major one.
        Known values: [stepped, level_65, level_70, blended]. Validate against `Structure` when SENDING; tolerate anything when RECEIVING.
      type: string
      x-extensible-enum:
        - stepped
        - level_65
        - level_70
        - blended
    PaymentMethod:
      title: PaymentMethod
      description: |-
        How the premium is collected. RESPONSE-facing and extensible: a consumer MUST pass an unrecognised value through rather than failing.
        Carried because it changes what an adviser does when a payment fails, which is the whole point of the `arrears` block. An expired card is a two-minute call to the client; a rejected superannuation rollover is a conversation with the fund and often a different person entirely; a failed employer deduction may not be the client's doing at all. Without this the follow-up on every dishonour starts by finding out how the policy was being paid.
        Known values:
          - `direct_debit`             debited from a bank account
          - `credit_card`              charged to a credit or debit card
          - `bpay`                     client-initiated BPAY
          - `direct_credit`            client-initiated transfer or deposit
          - `cheque`
          - `superannuation_rollover`  paid by rollover from a retail fund or SMSF
          - `employer_deduction`       deducted from salary by an employer
      type: string
      x-extensible-enum:
        - direct_debit
        - credit_card
        - bpay
        - direct_credit
        - cheque
        - superannuation_rollover
        - employer_deduction
    PolicyPremium:
      title: PolicyPremium
      description: 'What the policy costs as currently billed. Unlike a quote, this is a single frequency — the one the policy is actually paid at — because a policy has one billing arrangement, not six. `annualised` is supplied rather than derived, for the same reason quoting returns all six frequencies: frequency loadings mean the annual figure is not the billed amount times the number of periods.'
      type: object
      required:
        - amount
        - frequency
      additionalProperties: false
      properties:
        amount:
          description: The amount billed each period.
          $ref: '#/components/schemas/NonNegativeMoney'
        frequency:
          $ref: '#/components/schemas/Frequency'
        annualised:
          description: The annual cost. Read, not derived.
          $ref: '#/components/schemas/NonNegativeMoney'
        structure:
          $ref: '#/components/schemas/StructureResponse'
        stamp_duty:
          description: Stamp duty component, already included in `amount`.
          $ref: '#/components/schemas/NonNegativeMoney'
        policy_fee:
          description: Policy or administration fee, already included in `amount`.
          $ref: '#/components/schemas/NonNegativeMoney'
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        payment_method_detail:
          description: The insurer's own wording for the payment arrangement, where it carries more than the enum does — a masked account or card tail, the name of the paying super fund, an employer scheme. MUST NOT carry a full account number, card number or any other unmasked credential.
          type: string
          maxLength: 100
    CoverTypeResponse:
      title: CoverTypeResponse
      description: |-
        RESPONSE-facing CoverType. Same meaning as `CoverType`, but extensible: a consumer MUST pass an unrecognised value through for display rather than failing, so that adding to the benefits is a minor release rather than a major one.
        Known values: [life, tpd, trauma, income_protection, business_expenses, needle_stick, child_trauma]. Validate against `CoverType` when SENDING; tolerate anything when RECEIVING.
      type: string
      x-extensible-enum:
        - life
        - tpd
        - trauma
        - income_protection
        - business_expenses
        - needle_stick
        - child_trauma
    PolicyCover:
      title: PolicyCover
      description: One benefit held under the policy.
      type: object
      required:
        - benefit_name
      additionalProperties: false
      properties:
        cover_id:
          description: |-
            The insurer's own stable identifier for this benefit, unchanged for its life. Optional but strongly RECOMMENDED, and it is the key a consumer uses to track a benefit between snapshots.
            Without it the only handle is `(benefit_name, cover_type)`, which is not unique: an older book routinely holds two "Income Protection" benefits on one policy — an indemnity base plus an agreed-value top-up, or a legacy rider alongside the original. After indexation moves one of them, a consumer matching on name alone sees either "no change" or "one benefit deleted, one added", and fires a reduction-in-cover alert on a policy that grew. The flat one-row-per-benefit exports this contract replaces had per-benefit continuity; a structured shape has to restore it deliberately.
            MUST be unique within `covers`.
          type: string
          maxLength: 64
        benefit_name:
          description: The insurer's own name for the benefit, verbatim.
          type: string
          minLength: 1
          maxLength: 200
        cover_type:
          description: The benefit mapped onto the shared cover vocabulary, where one applies. Populating this is what lets a consumer compare an in-force book against new quotes without maintaining a per-insurer benefit-name lookup. Omit rather than guess — an absent `cover_type` with a populated `benefit_name` is an honest answer.
          $ref: '#/components/schemas/CoverTypeResponse'
        sum_insured:
          description: |-
            Current sum insured, after any indexation. For monthly-benefit covers this is the monthly amount, not the annualised one.
            Optional only because one live book genuinely has no such column — see the note on `required` above. An implementation that holds the value MUST populate it, and an implementation that does not MUST say so in `capabilities.fields.benefit_sum_insured`, because an omitted amount and an unreported one look identical and mean completely different things.
          $ref: '#/components/schemas/NonNegativeMoney'
        premium:
          description: This benefit's share of the policy premium, at the policy's billing frequency.
          $ref: '#/components/schemas/NonNegativeMoney'
        status:
          $ref: '#/components/schemas/PolicyStatusResponse'
        ownership:
          description: Where a single policy holds benefits under different ownership.
          $ref: '#/components/schemas/OwnershipResponse'
        structure:
          $ref: '#/components/schemas/StructureResponse'
        waiting_period:
          description: 'For income-style benefits, in the insurer''s own notation. Free text rather than the quoting contract''s enum: this is a historical record of what was written, which may predate the product range currently sold.'
          type: string
          maxLength: 50
        benefit_period:
          type: string
          maxLength: 50
        commenced_on:
          description: Where a benefit was added after the policy commenced.
          type: string
          format: date
        expires_on:
          type: string
          format: date
    Arrears:
      title: Arrears
      description: |-
        A policy behind on premium. This is the highest-value record in the whole contract: it is the one an adviser must act on within days, and today it is obtained by scraping a portal overnight.
        Identity is `(policy_id, dishonoured_on)`. The same pair reported across successive snapshots is the SAME event, not a new one — so an insurer MUST keep `dishonoured_on` stable for a given failure rather than restamping it each time it is re-reported. Two entries in the array MUST NOT share a `dishonoured_on`.
        `amount_outstanding` is the amount outstanding for THIS failure, not the policy total. A consumer wanting total exposure sums the array.
      type: object
      required:
        - dishonoured_on
        - amount_outstanding
      additionalProperties: false
      properties:
        dishonoured_on:
          description: Date the payment failed.
          type: string
          format: date
        amount_outstanding:
          description: |-
            The amount outstanding for THIS failure — the instalment that dishonoured on `dishonoured_on`, plus any fee the insurer has added to it. NOT the policy's total arrears. A consumer wanting total exposure sums the array; one that reads this as the policy total and also sums will double-count a policy two months behind.
            MUST be greater than zero — this block means "behind on premium", and a nil outstanding amount is a contradiction rather than a cleared policy. Omit the whole block when the policy is paid up.
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoney'
            - properties:
                amount:
                  pattern: ^(?!0+(\.0+)?$)\d{1,12}(\.\d{1,2})?$
        amount_is_estimate:
          description: |-
            `true` where `amount_outstanding` was COMPUTED rather than read from the insurer's own ledger — typically the instalment premium multiplied by the number of periods since `paid_to`. Defaults to `false`, so an insurer reporting a real figure need not send it.
            This field exists because the alternative to it is silence. An insurer that knows a policy is behind but cannot state the exact amount has, without this, only two options: withhold the row entirely, or present a derived number as though it came off the ledger. Both have happened in production. In one extract the required-amount rule withheld more money than it delivered — $139,261 excluded against $136,616 reported — and in another a usable amount was available on 5 of 93 arrears policies.
            A consumer SHOULD still work an estimated row: the policy is genuinely in arrears and `expected_lapse_on` is unaffected. What it MUST NOT do is reconcile an estimated amount against a payment, or present it as the amount owing without qualification.
          type: boolean
          default: false
        reason:
          description: Why the payment failed, in the insurer's own wording — "insufficient funds", "account closed", "card expired". Materially changes what the adviser does next, so worth carrying verbatim rather than mapping to an enum nobody agrees on.
          type: string
          maxLength: 200
        expected_lapse_on:
          description: |-
            When the policy will lapse if the arrears are not cleared. The single most actionable field here — it is what turns a list of dishonours into a prioritised worklist rather than a list of equally urgent problems.
            Optional in the schema, but an implementation reporting arrears at all SHOULD populate it: every insurer known to publish arrears data today supplies a lapse date, so it is a realistic ask rather than an aspirational one. Declare it in `capabilities.fields.expected_lapse_date`.
          type: string
          format: date
        attempts:
          description: How many collection attempts have failed for THIS instalment. Distinct from the number of entries in the array, which counts separate unpaid instalments — conflating the two makes a policy one month behind after three retries look the same as one three months behind.
          type: integer
          minimum: 1
    Policy:
      title: Policy
      description: One policy as the insurer holds it, with all of its benefits.
      type: object
      required:
        - policy_id
        - insurer_id
        - status
        - policy_holder
        - covers
      additionalProperties: false
      dependentSchemas:
        arrears:
          properties:
            status:
              const: in_arrears
      properties:
        policy_id:
          description: The key a consumer reconciles on, so an insurer that renumbers a policy MUST surface the prior number in `previous_policy_id`. Normalisation rules on the shared schema.
          $ref: '#/components/schemas/PolicyNumber'
        policy_version:
          $ref: '#/components/schemas/PolicyVersion'
        previous_policy_id:
          description: Prior number, where a policy has been renumbered or replaced.
          type: string
          maxLength: 64
        insurer_id:
          $ref: '#/components/schemas/InsurerId'
        brand_id:
          $ref: '#/components/schemas/BrandId'
        product_name:
          $ref: '#/components/schemas/ProductName'
        status:
          $ref: '#/components/schemas/PolicyStatusResponse'
        status_detail:
          description: The insurer's own wording for the status, where it carries more than the enum does.
          type: string
          maxLength: 200
        policy_holder:
          $ref: '#/components/schemas/PolicyHolder'
        ownership:
          $ref: '#/components/schemas/PolicyOwnership'
        distribution:
          $ref: '#/components/schemas/Distribution'
        dates:
          $ref: '#/components/schemas/PolicyDates'
        premium:
          $ref: '#/components/schemas/PolicyPremium'
        covers:
          description: The benefits held under this policy. At least one — a policy with no benefits is not a policy. Where a benefit maps onto the shared cover vocabulary the insurer SHOULD populate `cover_type`; `benefit_name` always carries its own product wording.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PolicyCover'
        arrears:
          description: |-
            The outstanding premium failures on this policy, most recent first. Present only when the policy is behind; absence means paid up to `dates.paid_to`, and an empty array MUST NOT be sent in place of absence.
            An ARRAY, because a monthly policy can dishonour in January and again in February with both still outstanding. A single object forced insurers to choose which one to report, and they chose differently: reporting the oldest meant a consumer saw the same event across four snapshots and never re-alerted even as exposure doubled; reporting the latest meant a brand-new event every month and a task reopened that had already been worked. Neither was wrong under the contract, which is the problem.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Arrears'
        loadings:
          description: Underwriting loadings applied at issue, in the insurer's own wording.
          type: string
          maxLength: 2000
        exclusions:
          description: Policy exclusions, in the insurer's own wording.
          type: string
          maxLength: 2000
    PageInfo:
      title: PageInfo
      description: Continuation state for a paged collection. Absence of `next_cursor` is the ONLY reliable signal that a walk is complete — consumers MUST NOT infer completion from a short page, because a server may return fewer items than requested for its own reasons.
      type: object
      additionalProperties: false
      properties:
        next_cursor:
          $ref: '#/components/schemas/Cursor'
    SnapshotComplete:
      title: SnapshotComplete
      description: |-
        `true` on the final page of the walk, and only there. This is the flag a consumer's reconciliation gates on.
        A server MUST NOT send `complete: true` together with `page.next_cursor` — the two contradict each other, and a consumer gating on `complete` would stop early and treat the unfetched remainder as absent. A consumer MUST fail the run if it sees both.
        Required on every page precisely so that "the insurer never sends it" cannot deadlock a consumer that correctly refuses to reconcile without it.
      type: boolean
    SnapshotCoverage:
      title: SnapshotCoverage
      description: What this snapshot claims to contain. Absence means "not in force", but only within the declared scope — a consumer that asked for one adviser code must not lapse policies belonging to another.
      type: object
      required:
        - adviser_codes
        - statuses
      additionalProperties: false
      properties:
        adviser_codes:
          description: |-
            The adviser codes this snapshot covers. When a request filtered on adviser codes, this echoes the effective set; otherwise it is every code the credential can see.
            THE ECHO IS THE POINT, and it is worth understanding why before treating this as housekeeping. A credential's scope is decided on the insurer's side and can be narrower than the consumer believes — a practice-level credential issued where a licensee-level one was intended, or a code quietly dropped from a group overnight. Nothing in the policy data shows it. Every row is valid, every field is populated, the walk completes, and the snapshot is simply smaller than it should be.
            This has happened: a credential scoped to a practice returned 823 policies across 9 advisers where the licensee book was 3,406 across 95. A feed pointed at it cut that insurer's book to roughly a quarter for a week before anyone noticed, and the absence rule then lapsed the difference. An echoed code set turns that from a silent loss into a first-night assertion failure — a consumer that knows which codes it expects can compare, and one that does not can at least alert on the set changing between runs.
          type: array
          items:
            type: string
            maxLength: 32
        statuses:
          description: The policy statuses included. Defaults to the in-force states — `in_force`, `in_arrears` and `pending` — so a consumer MUST NOT infer from a default snapshot that a policy absent from it was cancelled rather than simply never reported.
          type: array
          items:
            $ref: '#/components/schemas/PolicyStatus'
        includes_terminated:
          description: Whether terminal states appear at all in this snapshot.
          type: boolean
          default: false
        changed_since:
          description: Echoed when `changed_since` was honoured, so a consumer can confirm what it actually received rather than what it believes it asked for. MUST be present when `mode` is `incremental`.
          type: string
          format: date-time
    PolicyPage:
      title: PolicyPage
      description: One page of a snapshot. Every page of a given walk carries the same `snapshot_id` and `generated_at`, so a consumer can prove the pages it assembled belong together.
      type: object
      required:
        - mode
        - snapshot_id
        - generated_at
        - total_count
        - complete
        - coverage
        - policies
      additionalProperties: false
      properties:
        mode:
          $ref: '#/components/schemas/SnapshotMode'
        snapshot_id:
          $ref: '#/components/schemas/SnapshotId'
        generated_at:
          $ref: '#/components/schemas/SnapshotGeneratedAt'
        total_count:
          $ref: '#/components/schemas/SnapshotTotalCount'
        policies:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
        page:
          description: Continuation state. The shared pagination schema deliberately carries no count of its own, so there is exactly one authoritative total for a snapshot — `total_count` above.
          $ref: '#/components/schemas/PageInfo'
        complete:
          $ref: '#/components/schemas/SnapshotComplete'
        coverage:
          $ref: '#/components/schemas/SnapshotCoverage'
    Problem:
      title: Problem
      description: An RFC 9457 problem details document.
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          description: A URI identifying the problem kind. Use a registered value from `ProblemType` where one applies. Consumers branch on this field; `title` and `detail` are for humans.
          type: string
          format: uri
          default: about:blank
        title:
          description: A short, human-readable summary of the problem kind. Stable per `type`.
          type: string
        status:
          description: The HTTP status code, repeated here so a logged problem is self-contained.
          type: integer
          minimum: 400
          maximum: 599
        detail:
          description: A human-readable explanation specific to this occurrence. MUST NOT contain personal information about the insured — problem documents are logged widely on both sides.
          type: string
        instance:
          description: A URI reference identifying this specific occurrence.
          type: string
          format: uri-reference
        request_id:
          description: The value of the `X-Request-Id` header for the failed request, echoed so a consumer can quote one token when asking the insurer to investigate.
          type: string
        errors:
          description: Field-level detail, present on validation failures. Each entry MUST carry a JSON Pointer to the offending member of the request body, so a consumer can highlight the exact control that was wrong rather than showing a whole-form error.
          type: array
          items:
            type: object
            required:
              - pointer
              - detail
            additionalProperties: false
            properties:
              pointer:
                description: RFC 6901 JSON Pointer into the request body.
                type: string
                examples:
                  - /covers/1/waiting_period
              detail:
                type: string
              value_supplied:
                description: The rejected value, echoed for diagnosis. Omit where it is sensitive.
              values_supported:
                description: The values that would have been accepted. Populating this turns a failed integration attempt into a self-service fix.
                type: array
                items: {}
      examples:
        - type: https://openlife.org.au/problems/unsupported-value
          title: Unsupported value
          status: 422
          detail: This implementation does not support one of the values supplied.
          request_id: 01JQ8Z9YB4T7M2XR
          errors:
            - pointer: /example_field
              detail: Not supported by this implementation.
              value_supplied: unsupported_value
              values_supported:
                - supported_value_a
                - supported_value_b
    ArrearsItem:
      title: ArrearsItem
      description: |-
        One policy in arrears, with enough context attached to act on it without a second call.
        Deliberately a PROJECTION of `Policy` rather than the whole thing. It carries no `covers`, no `dates` block and no `ownership`, for two reasons: an insurer producing this from a collections report generally does not have them to hand, and requiring them would defeat the point of the operation being independently implementable. Every field that IS here is one the follow-up actually uses — who to call, on what number, about which policy, for how much, by when.
        Where the same policy also appears on `/policies`, every shared field MUST agree.
      type: object
      required:
        - policy_id
        - insurer_id
        - arrears
      additionalProperties: false
      properties:
        policy_id:
          $ref: '#/components/schemas/PolicyNumber'
        policy_version:
          $ref: '#/components/schemas/PolicyVersion'
        insurer_id:
          $ref: '#/components/schemas/InsurerId'
        brand_id:
          $ref: '#/components/schemas/BrandId'
        product_name:
          $ref: '#/components/schemas/ProductName'
        status:
          description: The policy's current status. Normally `in_arrears`; carried because an insurer may report a policy as behind on premium while its own record still says something else, and a consumer reconciling this against `/policies` needs to see that rather than have it flattened away.
          $ref: '#/components/schemas/PolicyStatusResponse'
        policy_holder:
          description: The same schema the policy snapshot uses. Contact details matter more here than anywhere else in the contract — an arrears row without a phone number or email is a task nobody can action — so an implementation that populates contact anywhere SHOULD populate it here.
          $ref: '#/components/schemas/PolicyHolder'
        distribution:
          description: Who the work routes to. `adviser_code` is what a consumer assigns the task on, so an implementation that omits it produces a worklist nobody owns.
          $ref: '#/components/schemas/Distribution'
        premium:
          description: 'What the policy costs as billed, including how it is collected. `payment_method` is load-bearing on this operation specifically: the follow-up for an expired card, a rejected superannuation rollover and a failed employer deduction are three different conversations with three different people.'
          $ref: '#/components/schemas/PolicyPremium'
        paid_to:
          description: The date premiums are paid up to. Restated from the policy record rather than referenced, because an arrears row is unreadable without it — the outstanding amounts say how much, and this says since when.
          type: string
          format: date
        arrears:
          description: The outstanding failures on this policy, most recent first. At least one — a row in this worklist with no arrears is a contradiction, and unlike the policy snapshot there is no "absent means paid up" reading available here.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Arrears'
    ArrearsCoverage:
      title: ArrearsCoverage
      description: What this worklist claims to contain. Absence means "not in arrears", but only within the declared scope.
      type: object
      required:
        - adviser_codes
      additionalProperties: false
      properties:
        adviser_codes:
          description: |-
            The adviser codes this worklist covers — the effective set where the request filtered, every code the credential can see otherwise.
            Echoing it matters more here than anywhere else in the contract, because the consequence of a silently narrowed scope is not a stale record but an unworked dishonour. A code missing from this list produces an empty worklist for that adviser, which is indistinguishable from that adviser having nobody in arrears — and the difference between those two is a policy that lapses. See the same field on `SnapshotCoverage` for the incident that motivates it.
          type: array
          items:
            type: string
            maxLength: 32
        changed_since:
          description: Echoed when `changed_since` was honoured. MUST be present when `mode` is `incremental`.
          type: string
          format: date-time
    ArrearsPage:
      title: ArrearsPage
      description: |-
        One page of the arrears worklist: every policy the calling credential can see that is currently behind on premium.
        The snapshot discipline is exactly that of `PolicyPage` and the envelope fields are the same schemas — a walk is only usable once it has reached `complete: true` under one unchanging `snapshot_id` with the declared `total_count` assembled.
        ## What absence means here, and why it is weaker than on `/policies`
        A policy present in the last complete arrears snapshot and absent from this one is **no longer in arrears**. That is the useful part: it is how a consumer closes a dishonour task without the insurer having to publish a cleared event.
        It is weaker than the policy snapshot's absence rule because it is ambiguous in a way that one is not. A policy leaves this snapshot for either of two reasons — the arrears were **paid**, or the policy **lapsed, was cancelled or terminated**. Those call for opposite actions, and nothing in this response distinguishes them. A consumer MUST NOT infer that a policy which dropped out of the arrears list has been brought up to date; to distinguish, read the policy's current status from `/policies` or `/policies/{policy_id}`.
        An implementation serving both operations MUST keep them consistent: a policy carrying an `arrears` block on `/policies` MUST appear here, and vice versa, at equal `policy_version`. Where the two are generated from different systems and can briefly disagree, say so in `capabilities.arrears_snapshot.independent_of_policy_snapshot`, because a consumer that trusts one over the other needs to know which is which.
      type: object
      required:
        - mode
        - snapshot_id
        - generated_at
        - total_count
        - complete
        - coverage
        - items
      additionalProperties: false
      properties:
        mode:
          $ref: '#/components/schemas/SnapshotMode'
        snapshot_id:
          $ref: '#/components/schemas/SnapshotId'
        generated_at:
          $ref: '#/components/schemas/SnapshotGeneratedAt'
        total_count:
          $ref: '#/components/schemas/SnapshotTotalCount'
        items:
          description: The policies in arrears. An empty array on a `complete` first page is a valid and unremarkable answer — it means nobody under this credential is currently behind.
          type: array
          items:
            $ref: '#/components/schemas/ArrearsItem'
        page:
          description: Continuation state. As on `PolicyPage`, the shared pagination schema carries no count of its own so that `total_count` is the only authoritative total.
          $ref: '#/components/schemas/PageInfo'
        complete:
          $ref: '#/components/schemas/SnapshotComplete'
        coverage:
          $ref: '#/components/schemas/ArrearsCoverage'
    Capabilities:
      title: Capabilities
      description: What this implementation of the policy contract supports.
      type: object
      required:
        - spec_version
        - insurer_id
      additionalProperties: false
      properties:
        spec_version:
          type: string
          pattern: ^\d+\.\d+\.\d+$
          examples:
            - 0.1.0
        insurer_id:
          $ref: '#/components/schemas/InsurerId'
        brands:
          type: array
          items:
            type: object
            required:
              - brand_id
              - name
            additionalProperties: false
            properties:
              brand_id:
                $ref: '#/components/schemas/BrandId'
              name:
                type: string
                maxLength: 120
        snapshot:
          type: object
          additionalProperties: false
          properties:
            max_page_size:
              type: integer
              minimum: 1
            snapshot_stable_for_seconds:
              description: How long a `snapshot_id` and its cursors stay valid. A consumer sizes its page requests and its overall walk budget against this, so that a large book can be paged before the snapshot expires underneath it.
              type: integer
              minimum: 60
            typical_generation_seconds:
              description: Roughly how long the insurer takes to assemble a snapshot. Advisory, but it tells a consumer whether a daily pull is a quick call or something to start well before it is needed.
              type: integer
              minimum: 0
            statuses_available:
              description: The statuses this implementation can report at all.
              type: array
              items:
                $ref: '#/components/schemas/PolicyStatus'
            supports_terminated:
              description: Whether ended policies can be requested.
              type: boolean
              default: false
        arrears_snapshot:
          description: |-
            Whether this implementation serves `GET /arrears`, the standalone arrears worklist.
            Independent of `snapshot` above, deliberately. An insurer whose collections data lives in a different system from its in-force extract may be able to serve one and not the other, in either direction, and the contract should let it say which rather than forcing an all-or-nothing answer.
          type: object
          additionalProperties: false
          properties:
            supported:
              type: boolean
              default: false
            independent_of_policy_snapshot:
              description: |-
                `true` where the worklist is generated from a different system than `GET /policies`, so the two can briefly disagree about whether a policy is in arrears.
                Worth declaring rather than leaving a consumer to discover it. A consumer that knows the two feeds are independent treats a disagreement as staleness and re-reads; one that believes they share a source treats the same disagreement as a data defect and escalates it to a human. Both feeds are usually right and simply cut at different times.
              type: boolean
              default: false
            supports_expected_lapse_filter:
              description: 'Whether `expected_lapse_before` is honoured. Read together with `fields.expected_lapse_date`: the filter is useless without the field, since rows lacking a lapse date are excluded by it.'
              type: boolean
              default: false
            typical_lag_hours:
              description: Roughly how far behind the insurer's own collections system this worklist runs. Advisory, but it is what tells a consumer whether polling hourly is worth anything or whether the data only moves once a day.
              type: integer
              minimum: 0
        incremental:
          description: Optional, and deliberately so. The snapshot is the required path — it is the smallest thing an insurer can build and the only one whose absence semantics let a consumer detect a lapse without tombstones. An insurer with a large book may additionally offer `changed_since`, which is far cheaper on both sides for a daily run, but it is an optimisation on top of the snapshot rather than a replacement for it.
          type: object
          additionalProperties: false
          properties:
            supported:
              type: boolean
              default: false
            reports_terminations:
              description: Whether an incremental response includes policies that ENDED since the timestamp. Without this, a consumer cannot use incremental alone — a lapse is invisible in a feed that only reports what still exists — and must keep pulling periodic snapshots to catch them.
              type: boolean
              default: false
            max_lookback_days:
              description: How far back `changed_since` may reach.
              type: integer
              minimum: 1
        fields:
          description: Which optional parts of the record this insurer actually populates. A consumer uses this to distinguish "this insurer never reports it" from "this policy does not have one" — which otherwise look identical, and which lead to very different conclusions about a book.
          type: object
          additionalProperties: false
          properties:
            arrears:
              type: boolean
              default: false
            expected_lapse_date:
              type: boolean
              default: false
            arrears_amount_is_exact:
              description: 'Whether outstanding amounts come from the insurer''s own ledger. `false` means some or all are computed, and each such entry carries `amount_is_estimate: true`. A consumer reconciling arrears against payments needs to know this before it starts.'
              type: boolean
              default: true
            benefit_sum_insured:
              description: Whether benefits carry `sum_insured` at all. `false` is a real answer — at least one live in-force book holds no sum-insured figure for any benefit — and it is the difference between "this benefit has no cover amount" and "this insurer cannot tell you what the cover amount is".
              type: boolean
              default: true
            payment_method:
              description: 'Whether policies carry how the premium is collected. Read this before building dishonour follow-up on it: the routing differs sharply between a card, a bank account and a superannuation rollover.'
              type: boolean
              default: false
            client_id:
              description: Whether the policy holder carries the insurer's own party identifier. `false` means a consumer must fall back to name and date of birth to group a person's policies.
              type: boolean
              default: false
            commission_splits:
              type: boolean
              default: false
            policy_holder_contact:
              description: Whether email, phone and address are populated.
              type: boolean
              default: false
            cover_type_mapping:
              description: Whether benefits carry `cover_type` mapped to the shared vocabulary, or only the insurer's own `benefit_name`.
              type: boolean
              default: false
            loadings_and_exclusions:
              type: boolean
              default: false
        webhooks:
          description: 'Whether this implementation can push the events declared in the contract''s `webhooks` block, rather than waiting to be polled. Optional throughout: pushing means outbound egress, retries, dead-lettering and endpoint management, which is a substantially larger build than serving a paged read. Every event here is also observable by comparing snapshots — just later.'
          type: object
          additionalProperties: false
          properties:
            supported:
              type: boolean
              default: false
            events:
              type: array
              items:
                type: string
                enum:
                  - policy.status_changed
                  - policy.arrears_raised
                  - policy.arrears_cleared
  headers:
    XRequestId:
      description: |-
        Correlation identifier, echoed from the request or generated by the server when the request did not carry one. REQUIRED on every response, including errors.
        This is not ceremony. A consumer of several insurers investigating "the premium was wrong last Tuesday" has to be able to hand one token to one insurer's support desk; without it, the only shared identifier is a timestamp.
      required: true
      schema:
        type: string
        maxLength: 128
      example: 01JQ8Z9YB4T7M2XR5K3P
    SpecVersion:
      description: The version of this standard the response was produced against. Lets a consumer detect an implementation that has moved without announcement.
      schema:
        type: string
        pattern: ^\d+\.\d+\.\d+$
      example: 0.1.0
  responses:
    BadRequest:
      description: The request could not be parsed, or a value was structurally invalid. Problem type `invalid-request`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    Unauthorized:
      description: No access token was presented, or it was malformed or expired. Problem type `unauthenticated`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        WWW-Authenticate:
          description: RFC 6750 challenge.
          schema:
            type: string
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    Forbidden:
      description: The token is valid but lacks the scope required for this operation, or names a campaign the consumer is not authorised for. Problem type `forbidden`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    UnprocessableEntity:
      description: |-
        The request was well formed but cannot be priced as asked — an unsupported cover, an unsupported option value, or a combination the product does not permit. Problem types `unsupported-cover`, `unsupported-value`, `invalid-combination`, `incomplete-request`.
        NOTE the boundary: this status is for a request the insurer will not accept. An insurer that accepts the request but cannot assemble the covers returns 200 with the line flagged `all_needs_met: false`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    TooManyRequests:
      description: Rate limit exceeded. Problem type `rate-limited`. `Retry-After` is REQUIRED — without it a consumer fanning out across several insurers has no basis for a backoff and will retry into the limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          required: true
          schema:
            type: integer
            minimum: 0
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    InternalError:
      description: Unexpected failure. Problem type `internal-error`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    ServiceUnavailable:
      description: A dependency of the pricing engine is unavailable. Problem type `upstream-unavailable`. Distinguished from `internal-error` so a consumer can retry this and not that.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    NotFound:
      description: Unknown identifier. Problem type `not-found`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    Gone:
      description: The endpoint is permanently retired — stop delivering to it. Used on webhook receivers so a publisher has a defined way to close a dead subscription, rather than retrying into a black hole until someone notices the queue depth. Problem type `endpoint-retired`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
