openapi: 3.1.0
info:
  title: Open Life Quoting API (AU)
  version: 0.1.0
  summary: A vendor-neutral contract for pricing Australian life risk cover.
  description: |
    A contract an insurer implements so that adviser software can obtain quotes directly, in one
    shape, without a per-insurer integration.

    ## What this is

    Four operations. An insurer prices a set of covers for one insured (`POST /quotes`), describes
    what it supports (`GET /capabilities`), and helps resolve an occupation to its own rating
    manual (`GET /occupations`, `POST /occupations:match`).

    The request is modelled on the questions an adviser actually answers, in the order they answer
    them: who is being insured, the answers that apply to the whole policy, then one section per
    benefit. It is deliberately not modelled on any existing engine's wire format.

    ## The rules that matter most

    These guard against failures that are **silent** — they produce a plausible number rather than
    an error, so nobody notices until a client complains.

    1. **All six payment frequencies on every priced line.** Sub-annual premiums carry a frequency
       loading, so the monthly premium is not the annual over twelve. A consumer that divides will
       understate the cost and nothing will look wrong.
    2. **Never price what you could not assemble.** If some requested covers cannot be written,
       return the line with `all_needs_met: false`, populated `errors` and no premium. A partial
       policy priced as though complete reads as the best offer on the table.
    3. **Report every option you did not apply.** An option the product cannot honour appears in
       `resolved_options` as `unsupported_ignored`. Otherwise a quote that quietly dropped a
       benefit is indistinguishable from one that included it, and the adviser recommends the
       wrong product.
    4. **Echo what you rated.** `resolved_occupation` and `rate_table_version` are what make a
       quote reproducible months later, which is what an adviser needs to justify a
       recommendation.
    5. **Say which commission basis you priced on.** Remuneration is an input to the premium, and
       the gap between an upfront-commission price and a level-commission one is wider than most
       product differences. Every priced line carries `commission`, whether or not the request
       named one — otherwise a comparison table sorts on remuneration and nothing in the numbers
       says so.

    ## Money

    Amounts are decimal strings with an explicit currency, never JSON numbers. Premiums are summed
    and compared to the cent, and JSON numbers are IEEE-754 doubles in JavaScript and in most
    generated clients.

    **Round a derived benefit down.** Where a consumer turns a replacement percentage into a
    monthly benefit — 70% of income is the usual starting point — it MUST round DOWN. Half-up
    rounding lands cents above the insurer's ceiling, the benefit is declined, and the insurer
    simply goes missing from the panel with nothing explaining why. Servers evaluate the ceiling on
    exact decimal arithmetic against the figure as sent. See rule 1 on `QuoteRequest`.

    ## Privacy

    The request carries no name, no address, no contact details and no health data, and
    `Insured` is a closed schema so there is nowhere to put them. Age is sent as age next birthday
    rather than a date of birth wherever the insurer permits. This is a design constraint, not a
    recommendation: a consumer sends the same client to several insurers, so every field
    multiplies into several separate collections by several separate entities.

    ## Conformance

    An implementation need not offer every cover or every option value. Declare what you offer in
    `GET /capabilities` and the conformance suite tests you against that declaration. What is not
    optional is the five rules above.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Open Life Data Standards (AU)
    url: https://github.com/axiscrm/open-life-au
servers:
  - url: https://{host}/{basePath}
    description: An insurer's implementation.
    variables:
      host:
        default: api.insurer.example.com.au
      basePath:
        default: openlife/quoting/v1
security:
  - oauth2:
      - quotes.write
tags:
  - name: Quotes
    description: Pricing.
  - name: Discovery
    description: What an implementation supports.
  - name: Occupations
    description: Resolving an occupation to the insurer's own rating manual.
paths:
  /quotes:
    post:
      operationId: createQuote
      summary: Price a set of covers
      description: |-
        Price the requested covers for one insured and return every line the insurer can offer, plus the lines it had to decline.
        ### What a response means
        One request yields MANY lines. An insurer with two brands and a campaign on one of them may answer a single life-cover request with three lines. Consumers must treat the response as a set of comparable offers, never as "the price".
        ### Three things a consumer must not do
        - **Do not derive a frequency.** `annual / 12` is not the monthly premium, because sub-annual
          premiums carry a frequency loading. Every line carries `monthly` and `annual`; the other four
          appear only where the insurer quotes them, and the ones it does not are named in
          `premiums.not_quoted`. An absent frequency cannot be bought at any price, so a derived figure
          is both wrong and unpurchasable.
        - **Do not price a failed line.** A line with `all_needs_met: false` carries no `premiums` and
          is not an offer. It exists so the adviser can see that this insurer was asked and could not
          write the combination.
        - **Do not assume an option was applied.** Check `resolved_options`. An option the product
          cannot honour appears there as `unsupported_ignored`, and the premium does not include it.

        ### Caching
        Quote responses carry personal information about the insured and MUST NOT be cached by intermediaries. Servers MUST send `Cache-Control: no-store`.
      tags:
        - Quotes
      security:
        - oauth2:
            - quotes.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '200':
          description: The quote was produced. Note that a 200 does not mean every requested cover was priced — inspect `all_needs_met` and `resolved_options` per line.
          headers:
            Cache-Control:
              description: MUST be `no-store`.
              required: true
              schema:
                type: string
                const: no-store
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-OpenLife-Spec-Version:
              $ref: '#/components/headers/SpecVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /capabilities:
    get:
      operationId: getCapabilities
      summary: What this implementation supports
      description: |-
        Describe the covers, option values, brands, campaigns and optional features this implementation offers.
        A consumer calls this once and caches it. It drives which controls an adviser is offered, so an unsupported combination can be prevented rather than rejected after the fact.
        This is the mechanism that makes a partial implementation conformant: an insurer that writes four covers and three waiting periods declares exactly that, and the conformance suite tests it against what it declared rather than against the whole standard.
        Consumers MUST NOT treat this document as authoritative. Hand-maintained capability documents drift from the pricing engine, so the runtime paths — 422 `unsupported-value` and `resolved_options` — stay mandatory regardless of what is declared here.
      tags:
        - Discovery
      security:
        - oauth2:
            - capabilities.read
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The capability document.
          headers:
            ETag:
              description: Entity tag for the document. Servers SHOULD supply it and honour `If-None-Match`, so consumers can revalidate cheaply instead of re-fetching.
              schema:
                type: string
            Cache-Control:
              description: Servers SHOULD permit caching for at least one hour — this document changes when a product range changes, not per request.
              schema:
                type: string
                example: public, max-age=3600
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-OpenLife-Spec-Version:
              $ref: '#/components/headers/SpecVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '304':
          description: Not modified — the consumer's cached copy is current.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /occupations:
    get:
      operationId: listOccupations
      summary: Search this insurer's own occupation list
      description: |-
        Return the occupations this insurer rates, in its own wording, each with its rating matrix.
        This exists so an adviser can correct one insurer's occupation by hand. The usual flow resolves an occupation once via `POST /occupations:match`, but where the match is imperfect — or where the adviser knows this insurer's product better — they need to search the insurer's own list and choose. That choice is then sent as `occupation.insurer_occupation_id` on the next quote, and the insurer rates on it without re-matching.
        Returning the rating matrix inline is deliberate: it lets a consumer show the consequence of a change before spending a pricing call on it.
        An empty `q` returns the whole list, paged, so a consumer can pre-load it.
      tags:
        - Occupations
      security:
        - oauth2:
            - occupations.read
      parameters:
        - $ref: '#/components/parameters/OccupationQuery'
        - $ref: '#/components/parameters/OccupationIncome'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Matching occupations. An empty array is a valid answer and means this insurer rates nothing matching the query — not that the query was malformed.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              description: Occupation lists change rarely; servers SHOULD permit caching for at least an hour. The response carries no personal information, so it is safe to cache.
              schema:
                type: string
                example: public, max-age=3600
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccupationListResponse'
        '304':
          description: Not modified.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /occupations:match:
    post:
      operationId: matchOccupation
      summary: Resolve a baseline occupation to this insurer's own
      description: |-
        Given an ABS OSCA code and the qualifiers that sit beneath it, return the insurer's own occupations that correspond, most confident first.
        ### Why this endpoint exists
        An adviser picks an occupation once, from one picker, and expects to compare every insurer on the panel. Each insurer rates its own list, so something has to bridge the two. Putting the bridge here — inside the insurer, which is the only party that knows its own manual — avoids making anyone else the custodian of a mapping they cannot maintain.
        ### An empty result is a real answer
        `candidates: []` means this insurer has no occupation corresponding to the reference. The consumer MUST show the insurer as unquotable for this client and MUST NOT substitute a nearby occupation of its own choosing. A silently wrong occupation produces a wrong premium that looks entirely normal, and an adviser has no way to detect it.
        ### Confidence
        Where the insurer maintains a one-to-one correspondence to the baseline it returns `exact`. A match derived from qualifiers alone will usually be `moderate` or below, and a consumer SHOULD ask the adviser to confirm anything below `exact` rather than pricing straight through.
        Results depend only on the occupation reference, never on the insured, so they are safely cacheable by the consumer per insurer.
      tags:
        - Occupations
      security:
        - oauth2:
            - occupations.read
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OccupationMatchRequest'
      responses:
        '200':
          description: Candidate matches, possibly empty.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccupationMatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: |
        OAuth 2.0 client credentials (RFC 6749, section 4.4). Machine-to-machine only.

        The consumer is a system, not a person, so there is no interactive flow: an authorisation
        code flow would oblige insurers to provision and maintain an account per adviser, and to
        answer "is this adviser appointed with us?" on every token request.

        Insurers who need adviser or licensee attribution — for distribution reporting or campaign
        entitlement — should take it from the token's own claims or from the client registration,
        not by pushing identity into the quote request.

        Servers SHOULD publish an RFC 8414 metadata document so consumers can discover the token
        endpoint rather than having it configured by hand. mTLS MAY additionally be required.
      flows:
        clientCredentials:
          tokenUrl: https://auth.insurer.example.com.au/oauth2/token
          refreshUrl: https://auth.insurer.example.com.au/oauth2/token
          scopes:
            quotes.write: Create quotes.
            capabilities.read: Read the capability document.
            occupations.read: Search and match occupations.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |-
        A consumer-generated UUID identifying this logical request. Replaying the same key with an identical body MUST return the stored response rather than re-pricing; replaying it with a different body MUST fail with 409 `idempotency-conflict`. Servers SHOULD retain keys for at least 24 hours.
        Pricing is computationally idempotent but commercially metered — many insurers count quotes, and some bill on them. This header is what stops a network timeout and retry from being counted twice, which protects both sides.
      required: false
      schema:
        type: string
        format: uuid
    RequestId:
      name: X-Request-Id
      in: header
      description: Consumer-supplied correlation identifier. Echoed on the response; the server generates one if absent.
      required: false
      schema:
        type: string
        maxLength: 128
    OccupationQuery:
      name: q
      in: query
      description: |-
        Free-text search over the insurer's own occupation descriptions. Matching is implementation-defined; servers SHOULD match on substrings of any word rather than a prefix of the whole string, since advisers search on the distinguishing word ("painter") rather than the leading one.
        An absent or empty `q` returns the full list, paged. That is deliberate — consumers pre-load the whole list to build a picker.
      required: false
      schema:
        type: string
        maxLength: 100
    OccupationIncome:
      name: income
      in: query
      description: |-
        The insured's gross annual income, so the insurer can return the occupation row that actually applies to them.
        Real occupation lists band on earnings — one insurer publishes "Accountant - earning less than $120,000 and not degree qualified" beside "Accountant - relevant degree or earning more than $120,000", and the two rate differently. Without an income a consumer building an occupation picker either shows every band and asks the adviser to choose, or shows one and hopes.
        OPTIONAL, and a server that does not band on income MUST ignore it rather than reject it. Sent as a whole number of dollars: a band boundary does not turn on cents, and rounding here keeps the field from being more identifying than it needs to be.
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 100000000
      example: 145000
    Cursor:
      name: cursor
      in: query
      description: Continuation token from the previous page's `page.next_cursor`.
      required: false
      schema:
        $ref: '#/components/schemas/Cursor'
    Limit:
      name: limit
      in: query
      description: Maximum items per page. A server MAY return fewer for its own reasons, so completion is signalled only by the absence of `page.next_cursor`.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
  schemas:
    Decimal:
      title: Decimal
      description: A fixed-point decimal amount serialised as a string, with at most two fractional digits. Scientific notation, thousands separators, currency symbols and leading `+` are not permitted. Implementations MUST NOT normalise `"0.00"` to `"0"` or vice versa when echoing a value back — but consumers MUST treat the two as numerically equal.
      type: string
      pattern: ^-?\d{1,12}(\.\d{1,2})?$
      examples:
        - '1234.56'
        - '0'
        - '-19.95'
    Money:
      title: Money
      description: An amount of money. Currency is carried explicitly even though this standard is Australia-only, so a future market does not become a breaking change.
      type: object
      required:
        - amount
        - currency
      additionalProperties: false
      properties:
        amount:
          $ref: '#/components/schemas/Decimal'
        currency:
          title: CurrencyCode
          description: ISO 4217 alphabetic code. Only AUD is defined by this version of the standard.
          type: string
          const: AUD
      examples:
        - amount: '1000000.00'
          currency: AUD
    NonNegativeMoney:
      title: NonNegativeMoney
      description: Money that cannot be negative — sums insured, premiums, stamp duty, policy fees. A negative value here is always a defect, so it is rejected at the schema boundary rather than surfacing as a nonsensical premium.
      allOf:
        - $ref: '#/components/schemas/Money'
        - properties:
            amount:
              type: string
              pattern: ^\d{1,12}(\.\d{1,2})?$
    ClientReference:
      title: ClientReference
      description: |-
        The consumer's own reference for the person being quoted, echoed back on the response so a quote can be reconciled against the requesting system.
        This MUST be a pseudonymous token, not a name, email, customer number or anything else that identifies the person outside the requesting system — the recommended construction is an HMAC of the internal record id under a per-insurer salt. Deriving it per insurer means two insurers cannot correlate their request streams to reconstruct a consumer's client base, and it keeps the request within data-minimisation obligations.
      type: string
      pattern: ^[A-Za-z0-9_.:-]{1,128}$
      examples:
        - c:8f14e45fceea167a
    Gender:
      title: Gender
      description: The gender used for rating. Life insurance rate tables in this market are published for two values, so this enum carries only those two; it describes a pricing input, not the insured's identity, and it is deliberately separate from any demographic field a CRM might hold.
      type: string
      enum:
        - male
        - female
    AustralianState:
      title: AustralianState
      description: State or territory of residence. Required because stamp duty on life insurance is levied per jurisdiction, so the same cover carries a different total depending on this value.
      type: string
      enum:
        - NSW
        - VIC
        - QLD
        - SA
        - WA
        - TAS
        - NT
        - ACT
    EmploymentStatus:
      title: EmploymentStatus
      description: 'The insured''s working status. This is a rating input in its own right, not a duplicate of the occupation: disability covers (`income_protection`, `business_expenses`, `tpd`) generally require a working status, and a working occupation paired with a non-working status is a contradiction that many insurers answer with a nil premium rather than an error. Consumers SHOULD reconcile the two before quoting. The `working` set is `employee` and the three `self_employed_*` values; the remainder are non-working.'
      type: string
      enum:
        - employee
        - self_employed_sole_trader
        - self_employed_partnership
        - self_employed_business_owner
        - home_duties
        - retired
        - pensioner
        - unemployed
        - student
    OccupationQualifiers:
      title: OccupationQualifiers
      description: The risk discriminators that sit beneath an occupation code. Every field is optional, and an absent field means "not stated" rather than "no" — an insurer SHOULD rate an unstated qualifier at its own default and MUST NOT infer a favourable answer from silence.
      type: object
      additionalProperties: false
      properties:
        trade_qualified:
          description: Whether the insured holds a recognised trade or professional qualification for the occupation. Frequently the difference of one or more rating classes in the trades.
          type: boolean
        working_height_m:
          description: The greatest height above ground at which the insured routinely works, in metres. `0` means they do not work at height. Insurers commonly band this (for example at 10m).
          type: number
          minimum: 0
          maximum: 500
        works_underground:
          type: boolean
        works_offshore:
          description: Routinely works offshore or on vessels, including oil and gas platforms.
          type: boolean
        manual_duties_percent:
          description: Proportion of working time spent on manual duties, 0-100. The usual axis distinguishing a white-collar rating from a light- or heavy-manual one within the same occupation.
          type: number
          minimum: 0
          maximum: 100
        hours_per_week:
          description: Ordinary hours worked per week. Most income-protection products require a minimum (commonly 20-25 hours) before they will offer the full benefit basis.
          type: number
          minimum: 0
          maximum: 168
        handles_explosives:
          type: boolean
        licensed_to_carry_firearm:
          description: Carries a firearm as a requirement of the occupation.
          type: boolean
      examples:
        - trade_qualified: false
          working_height_m: 10
          manual_duties_percent: 80
          hours_per_week: 38
    OccupationRef:
      title: OccupationRef
      description: |-
        How a consumer names an occupation. At least one of `osca`, `anzsco` or `insurer_occupation_id` MUST be present.
        `insurer_occupation_id` is the authoritative form: it names a row in the insurer's own list and removes all matching ambiguity, so it is what a consumer SHOULD send once the adviser has confirmed a per-insurer occupation. The others ask the insurer to match, and the insurer MUST report what it matched to.
        THE BASELINE FORMS ARE ASPIRATIONAL, AND CONSUMERS MUST NOT ASSUME THEM. `osca` and `anzsco` describe where this standard wants the market to get to: a taxonomy owned by the ABS rather than by any party in the value chain, so one occupation picker serves every insurer. That is the right destination and it is not where the market is. No rating engine we have examined speaks OSCA — engines carry their own occupation lists and match against them internally — so an implementation supporting `insurer_occupation_id` alone is fully conformant and is expected to be the common case for some time.
        The practical consequence for a consumer: read `occupation_resolution` in the capability document before sending a baseline code, and be prepared to resolve via `GET /occupations` or `POST /occupations:match` first. Sending `osca` to an insurer that does not accept it is a 422, not a quote.
        What would change this is insurers publishing `osca` on the rows of their own occupation lists — see `InsurerOccupation.osca`, which exists precisely so the correspondence can be built up from the insurer side rather than imposed on it.
      type: object
      additionalProperties: false
      anyOf:
        - required:
            - osca
        - required:
            - anzsco
        - required:
            - insurer_occupation_id
        - required:
            - employment_basis
      properties:
        osca:
          title: OscaCode
          description: ABS Occupation Standard Classification for Australia code. Six digits, optionally hyphenated at the four-digit unit-group boundary for readability.
          type: string
          pattern: ^\d{4}-?\d{2}$
          examples:
            - 3323-11
        anzsco:
          title: AnzscoCode
          description: Legacy ANZSCO code, accepted as an alias for consumers and manuals still using it. Ignored when `osca` is present.
          type: string
          pattern: ^\d{4}-?\d{2}$
        insurer_occupation_id:
          description: An identifier from this insurer's own occupation list, as returned by `GET /occupations`. Opaque; scoped to the insurer. When present, the insurer MUST rate on exactly this occupation and MUST NOT re-match.
          type: string
          minLength: 1
          maxLength: 128
        employment_basis:
          description: |-
            For an insured who is NOT in paid work. Send this INSTEAD of an occupation code.
            OSCA classifies occupations, so it has no code for a retired or home-duties client — yet these are real, quotable lives: home-duties TPD is a standard product, and a non-working spouse is a routine case. Before this existed the schema required an occupation code that does not exist, and an implementer facing a closed schema would send the nearest working code — producing the silently-wrong-occupation failure this contract warns about everywhere else.
            An insurer MUST rate on this rather than attempting to match it to an occupation, and MUST echo it in `ResolvedOccupation.employment_basis`.
          type: string
          enum:
            - home_duties
            - retired
            - unemployed
            - student
        qualifiers:
          $ref: '#/components/schemas/OccupationQualifiers'
        description:
          description: 'The adviser-facing description shown on screen, for display and diagnostics only. NON-NORMATIVE: an insurer MUST NOT rate on this string.'
          type: string
          maxLength: 200
          examples:
            - Painter
    Insured:
      title: Insured
      description: The person whose risk is being priced. Exactly one of `age_next_birthday` or `date_of_birth` MUST be present; `age_next_birthday` SHOULD be preferred.
      type: object
      required:
        - gender
        - smoker
        - state
        - occupation
      additionalProperties: false
      oneOf:
        - required:
            - age_next_birthday
        - required:
            - date_of_birth
      properties:
        age_next_birthday:
          description: The insured's age at their next birthday, which is the basis life rate tables are indexed on in this market. Bounds are the widest any product issues at; individual products declare their own limits in the capability document.
          type: integer
          minimum: 0
          maximum: 100
        date_of_birth:
          description: Full date of birth, RFC 3339 full-date. Send only where the insurer has declared it necessary — see the privacy note at the head of this file.
          type: string
          format: date
          examples:
            - '1985-03-14'
        gender:
          $ref: '#/components/schemas/Gender'
        smoker:
          description: Whether the insured meets the insurer's definition of a smoker. Definitions differ between insurers (typically on the lookback period and on whether occasional or non-tobacco nicotine use counts), so this is the consumer's answer to the insurer's own question rather than an objective fact. Insurers SHOULD publish their definition in their documentation.
          type: boolean
        state:
          $ref: '#/components/schemas/AustralianState'
        employment_status:
          $ref: '#/components/schemas/EmploymentStatus'
        annual_income:
          description: Gross annual income before tax. Required to price income protection and business expenses, which are capped as a proportion of it, and used by some insurers to band occupation ratings for white-collar roles. Omit where no income-based cover is requested.
          $ref: '#/components/schemas/NonNegativeMoney'
        occupation:
          $ref: '#/components/schemas/OccupationRef'
      examples:
        - age_next_birthday: 41
          gender: male
          smoker: false
          state: NSW
          employment_status: employee
          annual_income:
            amount: '145000.00'
            currency: AUD
          occupation:
            osca: 3323-11
            description: Painter
            qualifiers:
              trade_qualified: true
              working_height_m: 10
              manual_duties_percent: 80
    Structure:
      title: Structure
      description: |-
        How the premium behaves over the life of the policy.
          - `stepped`   re-rated each year as the insured ages
          - `level_65`  held level (bar indexation and rate changes) to age 65, then stepped
          - `level_70`  as above, to age 70
          - `blended`   a stepped/level mix, where the insurer blends the two rate bases
        `blended` is incompatible with indexation on some products; where an insurer cannot honour it, that is reported as `unsupported_ignored` rather than silently substituted.
      type: string
      enum:
        - stepped
        - level_65
        - level_70
        - blended
    Ownership:
      title: Ownership
      description: |-
        Who owns the cover, which determines the tax treatment, whether the premium can be paid from superannuation, and which side of the super/non-super premium split each amount falls on.
          - `super`           held inside a retail superannuation fund
          - `ordinary`        held personally, outside super
          - `smsf`            held inside a self-managed superannuation fund
          - `superlink`       split structure: one benefit part-owned inside super, part outside,
                              linked so the parts cannot be claimed twice
          - `smsf_superlink`  the same split structure where the super side is an SMSF
      type: string
      enum:
        - super
        - ordinary
        - smsf
        - superlink
        - smsf_superlink
    PremiumWaiver:
      title: PremiumWaiver
      description: Whether to include the waiver-of-premium option, which suspends premiums while the insured is disabled. `prefer` is a DEFERRED CHOICE — the adviser is asking the insurer to include it where the product allows and to price without it where not, and the insurer MUST report which it did in `resolved_options`.
      type: string
      enum:
        - exclude
        - include
        - prefer
    CommissionBasis:
      title: CommissionBasis
      description: |-
        The remuneration basis a premium is priced on. REQUEST-facing and therefore CLOSED: an unrecognised value MUST be rejected with 422 `unsupported-value`, never priced as a default.
        ## This is a pricing input, not a bookkeeping detail
        The same cover, for the same insured, on the same product, costs a different amount on each of these. That is the whole reason it appears in a quoting contract: a consumer that omits it, or an insurer that ignores it, produces a premium that is correct arithmetic on the wrong question. Two lines priced on different bases are not comparable at all, and nothing about the numbers themselves says so — which is why every priced line has to declare the basis it used.
        ## The three bases

          - `upfront`  a large initial payment in the first year, a lower rate thereafter. The dearest
                       premium of the three
          - `hybrid`   a smaller initial payment and a higher ongoing rate
          - `level`    the same rate every year, initial and ongoing alike. The cheapest premium of the
                       three, and commonly the ONLY basis available on a benefit written at an older
                       age, where insurers withdraw the upfront and hybrid options entirely

        That last clause is the case worth designing for rather than discovering. An adviser sets one basis for the policy and one benefit in it falls outside what the insurer writes on that basis. That case is handled by the INSURER rather than by the request: the basis is requested once for the policy, declarable per cover in `GET /capabilities`, and REPORTED per cover on the way back via `CoverLine.commission`. A consumer does not pick the exception; it learns which benefit fell outside and on what basis the insurer wrote it instead.
      type: string
      enum:
        - upfront
        - hybrid
        - level
    SharePercentage:
      title: SharePercentage
      description: |-
        A percentage that is a SHARE OF A WHOLE, and therefore cannot exceed 100 — a commission dial-down, a split between advisers. Serialised exactly as `Percentage`, with a narrower range.
        Separate from `Percentage` because that schema deliberately allows up to 1000: an underwriting loading of 400% is a real thing an adviser is told, and the bound there exists to catch a units mistake rather than to describe a share. Reuse it for a share and `'900'` validates, and there is no reading of that value which is not a defect. The policy contract already shipped this mistake once — a commission split inheriting the generic schema, so a 900% split passed — which is why the narrower type exists rather than the bound being restated at each call site.
      type: string
      pattern: ^(100(\.0{1,3})?|\d{1,2}(\.\d{1,3})?)$
      examples:
        - '0'
        - '30'
        - '12.5'
        - '100'
    CommissionRequest:
      title: CommissionRequest
      description: |-
        The remuneration basis to price on, and how much of it the adviser is giving up.
        ## Why this is in a quoting contract at all
        Commission is an INPUT TO THE PRICE. A level-commission premium and an upfront-commission premium for identical cover differ by a margin larger than most of the product differences an adviser is weighing, so a panel priced on mixed bases ranks on remuneration rather than on product. Nothing in the numbers reveals it, which puts this in the same class as the frequency rule: plausible figures, wrong comparison, no error anywhere.
        Two failures follow, and both are addressed here rather than left to implementations:

          - **Not applied.** The consumer says nothing and the insurer prices on its own default. That
            is legitimate — but the insurer MUST report it in `resolved_options` with `option:
            commission`, `cover_id: policy` and `defaulted`, so the basis behind the number is never
            implicit.
          - **Applied differently.** The insurer cannot write the requested basis for a cover — most
            often because the benefit is being written at an age where only `level` is offered. It MUST
            then either decline the line or price the basis it can write and report `substituted` with
            the applied value, per `ResolvedOption`. Silently pricing another basis is forbidden.

        ## Grain: one basis for the policy, and no per-cover override
        This block sits at policy level and applies to every cover. **There is deliberately no per-cover equivalent**, and the reason is worth stating because the per-cover case is real.
        Insurers do withdraw the upfront and hybrid bases on a benefit above a given age while continuing to offer them on the rest of the same policy. An earlier draft of this contract let a consumer name a different basis per cover for exactly that. It was removed on the evidence of the first implementation: rating engines apply remuneration per POLICY or per PRODUCT, never per benefit, and a product does not correspond to a cover — a life cover and the TPD extension attached to it are commonly one product, chosen by the engine while it prices. Worse, where a per-product override could be forced through, the engine went on reporting the policy-level basis, so the line would have been priced on one basis and reported on another. That is the precise failure every other rule here exists to prevent, and a field that invites it is worse than its absence.
        So the exception is the INSURER's to report, not the consumer's to request:

          - `commission_bases` per cover in `GET /capabilities` says which bases a cover is written on,
            with the age bounds, BEFORE the pricing call.
          - a line whose covers were not all written on one basis reports the line's basis in
            `commission` and each exception in `CoverLine.commission`.
          - the substitution is reported in `resolved_options`, as it would be for any option the
            insurer could not honour as asked.

        A consumer that genuinely needs two bases priced against each other sends two quote requests, which is also the only way to compare them.
      type: object
      additionalProperties: false
      properties:
        basis:
          description: The remuneration basis to price on. Absent means the insurer's product default.
          $ref: '#/components/schemas/CommissionBasis'
        insurer_commission_id:
          description: |-
            An identifier from this insurer's own commission list, as published in `commission_bases[].options` in `GET /capabilities`. Opaque; scoped to the insurer.
            ## Why an opaque id exists alongside a basis and a percentage
            The portable form — `basis` plus `dial_down_percent` — covers the ordinary case and is what a consumer should send. It cannot express everything a real remuneration schedule contains. Three arrangements taken from one engine's published lists, none of which is a basis plus a share:

              - upfront with no initial payment and the full ongoing rate
              - upfront paid in the first year only
              - a level rate ABOVE the insurer's own standard, which is an uplift rather than a dial-down

            This field is the escape hatch for those, and it plays the same role `insurer_occupation_id` plays for occupations: the authoritative form, resolved from the insurer's own published list.
            ## Normative
            WHEN PRESENT THIS IS AUTHORITATIVE. The insurer MUST price on exactly this option and MUST NOT re-derive it from `basis` or `dial_down_percent`. Where those are also present and disagree with it, the insurer MUST price on the id and report `substituted`.
            AN UNPUBLISHED ID MUST BE REJECTED with 422 `unsupported-value`. It MUST NOT be ignored, and the request MUST NOT fall back to a default basis. This is stated because the failure was observed rather than imagined: an engine handed a commission code it did not recognise — and, separately, another insurer's code — priced its own default in both cases and returned no error, differing from the intended premium by 25%. A consumer cannot detect that from the response, so silence here is not a lenient reading of the request; it is a wrong price.
            Whether an implementation accepts this form at all is declared in `commission_resolution`.
          type: string
          minLength: 1
          maxLength: 128
        dial_down_percent:
          description: |-
            How much of the insurer's standard commission for this basis is GIVEN UP, as a percentage. `'0'` is full commission; `'100'` is nil commission and the cheapest premium the basis offers. Absent means no dial-down.
            THE DIRECTION IS THE WHOLE FIELD, which is why it is spelled out in the name and again here. Read the other way round — as the share retained — a dial-down of `'30'` becomes a 70% giveaway, and the resulting line is cheaper than the adviser intended rather than dearer. Both readings produce a valid premium and a plausible comparison table.
            Bounded at 100 rather than using the general `Percentage` type: there is no sense in which more than all of a commission can be given up.
            ## A value between two of the insurer's steps rounds DOWN
            Insurers do not accept a continuous dial-down. They publish a ladder — steps of 20%, or of 25%, or a handful of named rates — and a requested 30% off a ladder of 20s is not writable as asked. Where that happens the insurer MUST apply the largest step at or BELOW the requested figure, report the applied value in `commission.dial_down_percent`, and report `substituted`.
            The direction is normative because both are defensible and they are not equally safe. Rounding down gives up less commission than asked and prices HIGHER; rounding up prices lower and wins a comparison the basis does not support. Left unstated, two conformant insurers answer the same request with different premiums and a consumer cannot tell which did what.
            The steps themselves are discoverable: `commission_bases[].options` in `GET /capabilities`. A consumer that reads them can send a figure the insurer writes exactly.
          $ref: '#/components/schemas/SharePercentage'
      examples:
        - basis: upfront
          dial_down_percent: '0'
        - basis: level
        - insurer_commission_id: UF-0-22
    Percentage:
      title: Percentage
      description: |-
        A percentage serialised as a decimal string (not a 0-1 ratio): `'25'` means 25%. At most three fractional digits, and at most 1000.
        A string for the same reason as `Decimal` and `RatePerThousand`. This was a JSON number until 0.2.0, justified on the grounds that percentages are inputs to arithmetic rather than amounts stored to the cent, and that three decimal places are exactly representable. The second half of that is not true: `0.001` has no exact IEEE-754 representation, so a loading of `25.001` arrives as `25.000999...` in every generated client. More to the point, the reasoning proved too clever — a loading percentage IS an input to pricing, and it was the one remaining path by which a contract value reached a rating engine through a double while every amount beside it travelled as a string. The inconsistency was visible in this very file: `RatePerThousand` is the OTHER axis of the same loadings map and was always a string.
        `'0'` is a MEANINGFUL value — see the loadings schema, where an explicit zero cancels an inherited loading and is not the same as omitting the field. Implementations MUST NOT normalise `'0'` to `'0.000'` or vice versa when echoing a value back, and consumers MUST treat the two as numerically equal.
      type: string
      pattern: ^(1000(\.0{1,3})?|\d{1,3}(\.\d{1,3})?)$
      examples:
        - '0'
        - '25'
        - '62.5'
        - '12.375'
    RatePerThousand:
      title: RatePerThousand
      description: A dollar rate applied per $1,000 of sum insured, the second axis on which underwriting loadings are expressed. Serialised as a decimal string for the same reason as `Decimal`.
      type: string
      pattern: ^\d{1,6}(\.\d{1,2})?$
      examples:
        - '0'
        - '1.50'
        - '12.00'
    Loadings:
      title: Loadings
      description: |-
        Underwriting loadings the adviser expects the insurer to apply, expressed per benefit on two independent axes. Both axes may apply to the same benefit, in which case the insurer applies both.
        SPARSE-MAP SEMANTICS, NORMATIVE. These maps are sparse and every present key is meaningful:

          - a benefit ABSENT from a map carries no loading on that axis;
          - a benefit present with a value of `'0'` carries an EXPLICIT nil loading.

        The two are NOT interchangeable. An implementation MUST NOT normalise a `'0'` into an omission or an omission into a `'0'`, and MUST NOT reject `'0'` as pointless — a consumer sends it to state positively that this benefit is not loaded, which is a different instruction from declining to say. JSON Schema cannot express this constraint, which is precisely why it is stated here and tested by the conformance suite.
        Keys are `CoverType` values, restricted to the five benefits a loading can attach to. Needle stick and child trauma have no loading axis and MUST be rejected as keys.
        A key names a cover TYPE, so it applies to EVERY cover of that type in the request. Where a request holds two covers of one type and they need different loadings, set `loadings` on the individual covers instead — a cover-level entry replaces the policy-level one for that cover.
        A key naming a cover type not present in `covers` MUST be rejected with 422 `invalid-combination` rather than silently ignored: it is far more likely to be a mistake than an intention.
      type: object
      additionalProperties: false
      properties:
        percentage:
          description: A percentage uplift on the risk premium for that benefit. `'25'` means the premium is loaded by 25%.
          type: object
          additionalProperties: false
          propertyNames:
            enum:
              - life
              - tpd
              - trauma
              - income_protection
              - business_expenses
          patternProperties:
            ^(life|tpd|trauma|income_protection|business_expenses)$:
              $ref: '#/components/schemas/Percentage'
        rate_per_thousand:
          description: A flat dollar amount per $1,000 of sum insured, added to the risk premium for that benefit. Not applicable to the monthly-benefit covers on every product; insurers report an inapplicable axis via `resolved_options`.
          type: object
          additionalProperties: false
          propertyNames:
            enum:
              - life
              - tpd
              - trauma
              - income_protection
              - business_expenses
          patternProperties:
            ^(life|tpd|trauma|income_protection|business_expenses)$:
              $ref: '#/components/schemas/RatePerThousand'
      examples:
        - percentage:
            life: '50'
            trauma: '0'
          rate_per_thousand:
            life: '1.50'
    PolicyDefaults:
      title: PolicyDefaults
      description: |-
        The answers that apply to the policy as a whole. Every field is optional and every field has a defined default, so a minimal request is valid; a cover may override any of them for itself.
        On a quote screen these controls are usually drawn inside the first benefit's panel, because that is where an adviser looks for them. They are hoisted here deliberately: an insurer should not have to know that the policy-wide premium structure is to be read off the life cover.
      type: object
      additionalProperties: false
      properties:
        structure:
          description: Default premium structure for every cover. Defaults to `stepped`.
          $ref: '#/components/schemas/Structure'
          default: stepped
        ownership:
          description: Default ownership for every cover. Defaults to `ordinary`.
          $ref: '#/components/schemas/Ownership'
          default: ordinary
        premium_waiver:
          description: Default waiver-of-premium answer for every cover. Defaults to `exclude`.
          $ref: '#/components/schemas/PremiumWaiver'
          default: exclude
        commission:
          description: Default remuneration basis for every cover. Absent means the insurer's own default, which it MUST then report — see `CommissionRequest`.
          $ref: '#/components/schemas/CommissionRequest'
        loadings:
          $ref: '#/components/schemas/Loadings'
    CoverId:
      title: CoverId
      description: 'CLIENT-assigned identifier for one requested cover, unique within the request. It does two jobs: a rider names its parent with it (`linked_to`), and every priced line echoes it so the consumer knows which requested cover produced which priced cover without inferring from cover type and amount.'
      type: string
      pattern: ^[A-Za-z0-9_-]{1,64}$
      examples:
        - life-1
        - tpd-rider-1
    CoverType:
      title: CoverType
      description: The benefits an adviser can ask to be priced, in the order they are presented on a quote screen. A cover may be requested standalone or, for some combinations, as a rider linked to a parent cover — see `link_type` on the cover schemas.
      type: string
      enum:
        - life
        - tpd
        - trauma
        - income_protection
        - business_expenses
        - needle_stick
        - child_trauma
    Preference:
      title: Preference
      description: 'The general three-state answer to an optional benefit: leave it out, put it in, or let the insurer decide (`prefer`). Every `prefer` in a request MUST come back as an entry in `resolved_options` saying what was actually applied.'
      type: string
      enum:
        - exclude
        - include
        - prefer
    CoverLoadings:
      title: CoverLoadings
      description: Loadings for a single cover, on the same two independent axes as the policy-level map. Both may apply at once.
      type: object
      additionalProperties: false
      properties:
        percentage:
          description: A percentage uplift on this cover's risk premium.
          $ref: '#/components/schemas/Percentage'
        rate_per_thousand:
          description: A flat dollar amount per $1,000 of sum insured, added to this cover's risk premium.
          $ref: '#/components/schemas/RatePerThousand'
    LinkType:
      title: LinkType
      description: How a cover relates to the cover named in `linked_to`. `extension` means the cover is held as a rider on the parent and its benefit reduces the parent's when paid, which is what makes it cheaper than the same cover held standalone.
      type: string
      enum:
        - extension
    CoverBase:
      title: CoverBase
      description: 'Fields common to every cover. `ownership`, `structure` and `premium_waiver` are OPTIONAL here: omitted, they inherit the request''s policy-level answer, which is how the quote screen behaves. Supplying one overrides it for this cover only.'
      type: object
      required:
        - cover_id
        - cover_type
      properties:
        cover_id:
          $ref: '#/components/schemas/CoverId'
        cover_type:
          $ref: '#/components/schemas/CoverType'
        ownership:
          $ref: '#/components/schemas/Ownership'
        structure:
          $ref: '#/components/schemas/Structure'
        premium_waiver:
          $ref: '#/components/schemas/PremiumWaiver'
        pay_by_rollover:
          description: Whether the premium may be funded by a rollover from another superannuation fund. Only meaningful where `ownership` resolves to a superannuation type; insurers MUST report it as `unsupported_ignored` rather than silently dropping it otherwise.
          $ref: '#/components/schemas/Preference'
        loadings:
          description: |-
            Underwriting loadings for THIS cover, overriding the policy-level map.
            Needed because the policy-level map is keyed by cover TYPE, and two covers of the same type in one request are routine — a standalone TPD alongside a linked TPD extension, or life inside super alongside life outside it. A single `{tpd: 50}` was then ambiguous: apply it to both, to the first, or to the standalone only? Three conformant implementations, three different premiums, and nothing in `resolved_options` obliged to disclose which reading was used, because from the insurer's point of view the loading WAS applied as asked.
            Where present this replaces the policy-level entry for this cover entirely — it does not merge.
          $ref: '#/components/schemas/CoverLoadings'
        linked_to:
          description: |-
            The `cover_id` of the parent cover, when this cover is held as an extension of it. MUST reference a cover present in the same request, MUST NOT be self-referential, and the graph of links MUST be acyclic. Absent means the cover is standalone.
            AN EXTENSION MUST NOT EXCEED WHAT IT EXTENDS. Paying an extension benefit reduces its parent by the same amount, so a `sum_insured` larger than the parent's describes a reduction that cannot happen. This is impossible at every insurer, not merely declined by some, so a server MUST answer it with 422 `invalid-combination` rather than with a declined line. JSON Schema cannot compare two members of the same array, which is why it is stated here and tested by the conformance suite.
          $ref: '#/components/schemas/CoverId'
        link_type:
          $ref: '#/components/schemas/LinkType'
      dependentRequired:
        linked_to:
          - link_type
        link_type:
          - linked_to
    LifeCover:
      title: LifeCover
      description: A death benefit paid as a lump sum. May be the parent of TPD and trauma extensions.
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CoverBase'
        - type: object
          required:
            - cover_type
            - sum_insured
          properties:
            cover_type:
              enum:
                - life
            sum_insured:
              $ref: '#/components/schemas/NonNegativeMoney'
    TpdDefinition:
      title: TpdDefinition
      description: |-
        Which test of total and permanent disability applies, in descending order of how favourable it is to the insured.
          - `own_occupation`  unable to work in their own occupation
          - `any_occupation`  unable to work in any occupation they are suited to
          - `home_duties`     the domestic-duties test, for a non-working insured
          - `adl`             the activities-of-daily-living test
          - `prefer`          let the insurer apply the best definition the occupation allows
        Availability is occupation-dependent: an insurer that cannot offer the requested definition for the rated occupation reports it via `resolved_options`.
      type: string
      enum:
        - own_occupation
        - any_occupation
        - home_duties
        - adl
        - prefer
    PreferenceQuad:
      title: PreferenceQuad
      description: 'A four-state answer to an optional benefit, for the cases where an adviser wants to express a leaning rather than a decision. `prefer_exclude` and `prefer_include` are DEFERRED: the insurer settles them and MUST report what it applied in `resolved_options`.'
      type: string
      enum:
        - exclude
        - prefer_exclude
        - prefer_include
        - include
    TpdCover:
      title: TpdCover
      description: Total and permanent disability, as a lump sum. Held standalone, or as an extension of a life or trauma cover via `linked_to`. `life_buyback` and `double_benefit` are only meaningful on an extension, since both describe what happens to the parent cover when this benefit is paid.
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CoverBase'
        - type: object
          required:
            - cover_type
            - sum_insured
          properties:
            cover_type:
              enum:
                - tpd
            sum_insured:
              $ref: '#/components/schemas/NonNegativeMoney'
            tpd_definition:
              $ref: '#/components/schemas/TpdDefinition'
            life_buyback:
              description: Reinstatement of the parent cover after this benefit is paid. Extensions only. A subset of `LifeBuyback` — `after_3_years` is not offered on a TPD extension.
              type: string
              enum:
                - exclude
                - prefer_exclude
                - immediate
                - after_1_year
                - prefer
            double_benefit:
              description: Whether this benefit is paid IN ADDITION to the parent cover rather than reducing it. Extensions only; materially increases the premium.
              $ref: '#/components/schemas/PreferenceQuad'
    BenefitQuality:
      title: BenefitQuality
      description: Which end of a product range to select from where an insurer offers several tiers of the same benefit. This is a preference over the insurer's OWN range, not a cross-insurer ranking, and it is resolved by the insurer.
      type: string
      enum:
        - lowest_cost
        - intermediate
        - most_comprehensive
    TraumaCover:
      title: TraumaCover
      description: Critical illness cover, as a lump sum. Held standalone or as an extension of a life cover.
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CoverBase'
        - type: object
          required:
            - cover_type
            - sum_insured
          properties:
            cover_type:
              enum:
                - trauma
            sum_insured:
              $ref: '#/components/schemas/NonNegativeMoney'
            life_buyback:
              description: Reinstatement of the parent cover after this benefit is paid. Extensions only. A subset of `LifeBuyback` — `immediate` is not offered on a trauma extension.
              type: string
              enum:
                - exclude
                - prefer_exclude
                - after_1_year
                - after_3_years
                - prefer
            double_benefit:
              description: Paid in addition to the parent cover rather than reducing it. Extensions only.
              $ref: '#/components/schemas/PreferenceQuad'
            reinstatement:
              description: Whether the trauma benefit itself can be reinstated after a claim, allowing a later unrelated condition to be claimed again.
              $ref: '#/components/schemas/PreferenceQuad'
            child_care_benefit:
              description: An additional benefit payable on complications of pregnancy or childbirth, or on a child's serious illness, depending on the product. Only offered where the insured's gender makes the pregnancy component applicable, so insurers commonly report this as `unsupported_ignored` otherwise.
              $ref: '#/components/schemas/PreferenceQuad'
            benefit_quality:
              description: Which tier of the insurer's trauma range to select from.
              $ref: '#/components/schemas/BenefitQuality'
    WaitingPeriod:
      title: WaitingPeriod
      description: |-
        How long the insured must be disabled before a monthly benefit starts to accrue. Shorter periods cost materially more. Not every product offers every value; an insurer declares the values it supports in its capability document and rejects the rest with 422 `unsupported-value`.
        STATED IN THE UNIT THE PRODUCT IS SOLD IN — days, weeks, months or years. Insurers in this market do not agree on a unit: some publish deferral periods in days, some in weeks, some in months. An earlier version of this enum offered days and years only, which obliged anyone whose product is sold in weeks to pick the nearest day figure, and that substitution is not lossless.
        THE VALUES ARE NOT INTERCHANGEABLE, and this is the whole reason the units coexist rather than being normalised to one. `13w` is 91 days and `90d` is 90; `4w` is 28 days and `30d` is 30. The industry says "90 day wait" and "13 week wait" as though they were the same thing, and for conversational purposes they are — but they are different terms of contract, they price differently, and a claim admitted on the 91st day is not covered by a 90-day policy. So:
        - A consumer MUST NOT treat two values as equal because they are within a few days of each
          other, and MUST NOT convert between units when comparing insurers. Compare `90d` against
          `90d`; show `13w` as `13w`.
        - An insurer asked for a value it does not write MUST NOT silently price the nearest one it
          does. Either reject with 422 `unsupported-value`, or price the nearest and report it in
          `resolved_options` as `substituted` — the choice is the insurer's, and the reporting is not.
          A substitution nobody is told about is a quote for a different product at a plausible price.

        The set is drawn from the deferral periods actually published in this market. The year values are genuine but uncommon, appearing on high-income and own-occupation products rather than on a typical retail benefit. Adding a value is a minor release, so an insurer whose product uses a duration absent here should ask rather than round to fit.
      type: string
      enum:
        - 14d
        - 30d
        - 60d
        - 90d
        - 180d
        - 2w
        - 4w
        - 8w
        - 13w
        - 26w
        - 1m
        - 3m
        - 6m
        - 1y
        - 2y
    BenefitPeriod:
      title: BenefitPeriod
      description: How long a monthly benefit continues to be paid once a claim is admitted. The `age_*` values pay to that age, which for a younger insured is far longer — and dearer — than any of the fixed terms.
      type: string
      enum:
        - 1y
        - 2y
        - 5y
        - age_55
        - age_60
        - age_65
        - age_67
        - age_70
    ReplacementRatio:
      title: ReplacementRatio
      description: The proportion of pre-disability income the monthly benefit is intended to replace, used to select between product variants that differ on this basis. `any` lets the insurer offer whatever its product supports.
      type: string
      enum:
        - any
        - above_75
        - 70_to_75
        - 60_to_69
        - below_60
    IncomeProtectionCover:
      title: IncomeProtectionCover
      description: |-
        A monthly benefit while the insured is disabled and unable to earn. The benefit is capped as a proportion of `annual_income`, so that field is required on the insured whenever this cover is requested.
        THE AMOUNT IS DOLLARS, AND THE PERCENTAGE THAT PRODUCED IT MUST BE ROUNDED DOWN. Advisers work in a replacement percentage — 70% is the usual starting point — and the conversion to a monthly dollar figure happens before the request is built, where no schema can see it. Rounding that conversion half-up lands the request cents above the insurer's ceiling and the benefit is declined. See rule 1 on `QuoteRequest` for the worked figures and the matching obligation on the server.
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CoverBase'
        - type: object
          required:
            - cover_type
            - monthly_benefit
          properties:
            cover_type:
              enum:
                - income_protection
            monthly_benefit:
              description: The monthly amount sought, before any cap the insurer applies. Where it was derived from a percentage of income, that derivation MUST be rounded DOWN — see above.
              $ref: '#/components/schemas/NonNegativeMoney'
            waiting_period:
              $ref: '#/components/schemas/WaitingPeriod'
            benefit_period:
              $ref: '#/components/schemas/BenefitPeriod'
            replacement_ratio:
              $ref: '#/components/schemas/ReplacementRatio'
            benefit_quality:
              $ref: '#/components/schemas/BenefitQuality'
            indexed_claim_benefit:
              description: Whether a benefit in payment is indexed against inflation.
              $ref: '#/components/schemas/PreferenceQuad'
            accident_benefit:
              description: Whether the benefit starts from the date of an accident rather than after the full waiting period.
              $ref: '#/components/schemas/PreferenceQuad'
            superannuation_contribution:
              description: An additional monthly amount to cover superannuation contributions while on claim. Absent means none.
              $ref: '#/components/schemas/NonNegativeMoney'
    BusinessExpensesCover:
      title: BusinessExpensesCover
      description: Reimbursement of fixed business overheads while the insured is disabled. Benefit periods are short by nature — this covers the cost of keeping a practice open, not the loss of income.
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CoverBase'
        - type: object
          required:
            - cover_type
            - monthly_benefit
          properties:
            cover_type:
              enum:
                - business_expenses
            monthly_benefit:
              description: The monthly amount sought. Subject to the same round-down rule as income protection wherever it is derived from a percentage — see `IncomeProtectionCover`.
              $ref: '#/components/schemas/NonNegativeMoney'
            waiting_period:
              description: A subset of `WaitingPeriod` — the long deferral periods are not offered on this benefit. Carries the short durations in every unit `WaitingPeriod` uses, since which unit a product is sold in is a property of the insurer rather than of the benefit.
              type: string
              enum:
                - 14d
                - 30d
                - 60d
                - 90d
                - 2w
                - 4w
                - 8w
                - 13w
                - 1m
                - 3m
            benefit_period:
              description: A subset of `BenefitPeriod` — cover for business overheads is short by nature.
              type: string
              enum:
                - 1y
                - 2y
    NeedleStickCover:
      title: NeedleStickCover
      description: A lump sum on occupationally acquired blood-borne infection. Offered to healthcare occupations only, so an insurer will commonly answer this with an unavailable line for anyone else.
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CoverBase'
        - type: object
          required:
            - cover_type
            - sum_insured
          properties:
            cover_type:
              enum:
                - needle_stick
            sum_insured:
              $ref: '#/components/schemas/NonNegativeMoney'
    InsuredChild:
      title: InsuredChild
      description: 'A child named on a child trauma cover. Deliberately narrower than `Insured`: children are rated on age and gender alone, so nothing else is collected.'
      type: object
      required:
        - age_next_birthday
        - gender
        - sum_insured
      additionalProperties: false
      properties:
        child_id:
          description: Consumer-assigned identifier, unique within the cover, so per-child results and per-child validation errors can be attributed without relying on array position.
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
        age_next_birthday:
          type: integer
          minimum: 0
          maximum: 25
        gender:
          $ref: '#/components/schemas/Gender'
        sum_insured:
          $ref: '#/components/schemas/NonNegativeMoney'
    ChildTraumaCover:
      title: ChildTraumaCover
      description: Critical illness cover on named children. The amount is per child, so this cover carries no cover-level sum insured — each child names their own.
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CoverBase'
        - type: object
          required:
            - cover_type
            - children
          properties:
            cover_type:
              enum:
                - child_trauma
            children:
              type: array
              minItems: 1
              maxItems: 10
              items:
                $ref: '#/components/schemas/InsuredChild'
    CoverRequest:
      title: CoverRequest
      description: One cover to be priced. Which fields are permitted is determined entirely by `cover_type`; each variant is closed, so an option that belongs to another cover is a validation failure rather than something an implementer has to remember to ignore.
      oneOf:
        - $ref: '#/components/schemas/LifeCover'
        - $ref: '#/components/schemas/TpdCover'
        - $ref: '#/components/schemas/TraumaCover'
        - $ref: '#/components/schemas/IncomeProtectionCover'
        - $ref: '#/components/schemas/BusinessExpensesCover'
        - $ref: '#/components/schemas/NeedleStickCover'
        - $ref: '#/components/schemas/ChildTraumaCover'
      discriminator:
        propertyName: cover_type
        mapping:
          life: '#/components/schemas/LifeCover'
          tpd: '#/components/schemas/TpdCover'
          trauma: '#/components/schemas/TraumaCover'
          income_protection: '#/components/schemas/IncomeProtectionCover'
          business_expenses: '#/components/schemas/BusinessExpensesCover'
          needle_stick: '#/components/schemas/NeedleStickCover'
          child_trauma: '#/components/schemas/ChildTraumaCover'
    RequiredFeatures:
      title: RequiredFeatures
      description: |-
        Product features the insured requires, as a filter on which products may be used. A product that does not offer every feature named for a benefit MUST NOT be used to write that benefit.
        THIS IS A FILTER, NOT AN OPTION. The difference matters: an option asks the insurer to add something and is answered in `resolved_options`; a filter narrows the product set BEFORE pricing, so the honest answer to "no product has this" is a line with `all_needs_met: false` and a populated `errors`, not a cheaper line quietly written without the feature. An insurer MUST NOT satisfy a required feature by ignoring it.
        ## Two vocabularies, and a consumer may mix them
        Keys are `CoverType` values, plus `policy` for features that describe the policy rather than one benefit. The codes under each key are EITHER:

          * a **standard feature**, from `taxonomy/features.yaml` — portable, and the same code means
            the same thing at every insurer; or
          * the **insurer's own code**, discoverable from `features` on that cover in the capability
            document.

        A consumer that can only use one form should use the standard one: it is the only form that lets a single request be sent to a panel. Insurer codes remain first-class for the long tail no shared vocabulary reaches. Which forms an implementation accepts is declared in `feature_resolution`; every implementation MUST accept `standard`.
        A standard code and an insurer code naming the same feature are the same filter, not two, and an insurer MUST NOT require both.
        ## Scoping, and what happens to a code the insurer cannot use
        A code is scoped to the key it appears under: the same code under a different cover is a different filter, and a policy-level feature belongs under `policy`, not repeated per cover.
        Every code MUST be answered in `resolved_features` on each line, and the two failure modes are reported DISTINCTLY:

          * `unrecognised` — the insurer does not know this code, or does not offer it on this benefit.
            That is a fault in the request, and an adviser needs to see it as one.
          * `not_offered` — the insurer knows the feature and no product of its own has it. That is an
            answer about the market.

        Both decline the line. Collapsing them would report a mistyped code as "no product offers this", which reads as a fact about the panel and is not one.
        THIS IS REPORTED PER LINE, NOT AS A 422. An earlier version of this standard rejected the whole request on an unknown code. That is defensible against a single insurer and wrong against a panel: one insurer's ignorance of one code would deny the consumer ten other insurers' answers. A 422 is still correct for a structurally invalid request — a key that is not a cover type or `policy`, a value that is not an array of strings.
        What an insurer MUST NOT do is silently ignore a code it cannot honour. An adviser filtering on "must include terminal illness" and getting products without it is the failure this exists to prevent, and it is the reason the reporting obligation is unconditional.
        Absent or empty means no filter, which is the overwhelmingly common case.
      type: object
      additionalProperties: false
      propertyNames:
        enum:
          - policy
          - life
          - tpd
          - trauma
          - income_protection
          - business_expenses
          - needle_stick
          - child_trauma
      patternProperties:
        ^(policy|life|tpd|trauma|income_protection|business_expenses|needle_stick|child_trauma)$:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            maxLength: 64
      examples:
        - policy:
            - guaranteed_renewable
            - benefit_indexation
          trauma:
            - cancer
            - heart_attack
          income_protection:
            - agreed_value
        - life:
            - terminal_illness_benefit
            - NEO_FUNERAL_ADV
    ProjectionIndexation:
      title: ProjectionIndexation
      description: |-
        How sums insured grow across a projection. A single rate applies to every cover that can be indexed.
        Not every benefit can be. Where a product does not index a cover the insurer MUST say so in `excluded_covers` on the projection it returns, rather than silently projecting a flat sum insured inside an indexed projection — the totals would otherwise be unattributable.
      type: object
      required:
        - rate
      additionalProperties: false
      properties:
        rate:
          description: Annual indexation rate as a percentage. `'5'` grows each indexed sum insured by 5% a year, compounding.
          $ref: '#/components/schemas/Percentage'
    ProjectionRequest:
      title: ProjectionRequest
      description: |-
        Ask for the cost of each line projected forward, as well as its price today.
        Needed because a stepped premium rises every year, so the first-year price is a poor basis for a recommendation and a level premium that looks dear today is often cheaper over the term an adviser is actually advising on. Comparing two structures on their first-year premiums alone is the mis-comparison this exists to remove.
        Optional to implement. An insurer that cannot project declares `projections: false` in its capability document; if it is asked anyway it MUST price the quote normally, omit `projection` from every line, and report it once in `resolved_options` with `option: projection` and `unsupported_ignored`, rather than failing the quote.
      type: object
      additionalProperties: false
      oneOf:
        - required:
            - years
        - required:
            - to_age
      properties:
        years:
          description: Project this many years forward, inclusive of the current year.
          type: integer
          minimum: 1
          maximum: 50
        to_age:
          description: Project to the insured's stated age. Where this is at or below the insured's current age the request is a 422 `invalid-combination` — an empty projection is not a useful answer.
          type: integer
          minimum: 1
          maximum: 100
        indexation:
          description: |-
            Whether to grow each cover's sum insured over the projection, and by how much.
            Absent means no indexation: the projection prices today's sums insured at each future age, which is what "what will this policy cost me at 55" asks. Present, it prices a policy whose cover keeps pace, which is a different and equally legitimate question — but the two are not comparable, so an insurer MUST report which it applied.
          $ref: '#/components/schemas/ProjectionIndexation'
      examples:
        - years: 10
        - to_age: 65
          indexation:
            rate: '5'
    QuoteRequest:
      title: QuoteRequest
      description: |-
        A request to price one or more covers for one insured. A response to this is a set of priced lines, not a single price: an insurer may return several lines for one request where it has more than one brand, product combination or campaign variant that satisfies the covers asked for.
        ## Combinations no insurer can write
        Some requests are not merely unlikely to be accepted — they cannot be issued by anyone, and the standard says so here rather than leaving every implementation to discover it and every consumer to learn it one decline at a time.
        THE DISTINCTION THAT DECIDES WHICH IS WHICH. A request that is impossible **at every insurer**, for reasons visible in the request itself, is a `422` with `invalid-combination`. A request that THIS insurer cannot write — its own limits, its own product range, its own underwriting — is a priced-lines response carrying a declined line with `all_needs_met: false` and a reason. The first is a bug in the consumer; the second is an answer.
        Servers MUST reject the following with `422` rather than declining them, and consumers SHOULD not send them:
        1. **A monthly benefit above the insured's income.** Income protection and business expenses
           replace earnings; no product in this market insures more than 100% of them, and most cap
           far lower. A benefit above `annual_income / 12` is therefore impossible everywhere. The
           insurer's own ceiling — commonly 70% — is declared as
           `max_income_replacement_percent` in its capability document, and a request between that
           ceiling and 100% is a DECLINE, not a rejection, because another insurer may write it.

           **ROUND A DERIVED BENEFIT DOWN — NORMATIVE.** The wire
           carries dollars, not a percentage, so the arithmetic that turns "70% of income" into a
           `monthly_benefit` happens in the consumer, unseen by the insurer and unconstrained by any
           schema. Where a consumer derives the amount from a percentage of income it MUST round DOWN,
           at whatever precision it sends. Half-up rounding puts the request over the ceiling by cents:
           70% of $185,000 is $129,500 a year, or $10,791.666… a month, which half-up becomes
           $10,791.67 — annualising to $129,500.04, four cents above the insurer's cap. The insurer
           declines, correctly, and the adviser sees an insurer missing from the panel with no
           explanation attached to it. Rounding to the nearest dollar makes it worse, not better.

           The symmetric obligation is the server's: an insurer MUST evaluate both the 100% bound and
           its own ceiling on exact decimal arithmetic against the unrounded figure, and MUST NOT round
           the requested benefit up before comparing it. A request that is inside the ceiling as sent is
           inside it, full stop.
        2. **An extension larger than the cover it extends.** An extension reduces its parent when
           paid, so a `linked_to` cover whose `sum_insured` exceeds its parent's describes a benefit
           that cannot exist.
        3. **Income cover for someone with no income.** An income protection or business expenses
           cover alongside an `employment_status` of `home_duties`, `retired`, `pensioner`,
           `unemployed` or `student`. There is no earned income to replace. Engines commonly answer
           this by pricing nothing at all, with no explanation, which is the worst of both.
        4. **A missing income when one is needed.** `annual_income` is REQUIRED whenever income
           protection or business expenses is requested — rule 1 cannot be applied without it, and an
           insurer that prices anyway is guessing.

        Rules 2 and 4 are enforced by this schema. Rules 1 and 3 are stated normatively and tested by the conformance suite: JSON Schema cannot compare a benefit against an income, nor a cover against a sibling's employment status.
      type: object
      required:
        - insured
        - covers
      additionalProperties: false
      allOf:
        - if:
            properties:
              covers:
                contains:
                  properties:
                    cover_type:
                      enum:
                        - income_protection
                        - business_expenses
                  required:
                    - cover_type
            required:
              - covers
          then:
            properties:
              insured:
                properties:
                  annual_income:
                    $ref: '#/components/schemas/NonNegativeMoney'
                required:
                  - annual_income
      properties:
        client_reference:
          $ref: '#/components/schemas/ClientReference'
        insured:
          $ref: '#/components/schemas/Insured'
        policy:
          $ref: '#/components/schemas/PolicyDefaults'
        covers:
          description: |-
            The covers to price. Only covers the adviser has switched on appear here — an absent cover type is not requested, and there is no "included: false" form.
            `cover_id` MUST be unique across the array. Where a cover names a parent with `linked_to`, the parent MUST also be present; order within the array is NOT significant and a server MUST NOT require parents to appear first.
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/CoverRequest'
        campaign_codes:
          description: |-
            Campaign or discount variants to price in ADDITION to the insurer's standard rates. Each requested campaign the insured qualifies for yields its own line, so the adviser can compare the standard offer against the discounted one rather than being silently given whichever is cheaper. An empty array or an absent field means standard rates only.
            Codes are the insurer's own, discoverable from its capability document. An unknown code is a 422 rather than being ignored, so a mistyped campaign cannot look like an ineligible one.
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 64
          default: []
        required_features:
          $ref: '#/components/schemas/RequiredFeatures'
        projection:
          $ref: '#/components/schemas/ProjectionRequest'
      examples:
        - client_reference: c:8f14e45fceea167a
          insured:
            age_next_birthday: 41
            gender: male
            smoker: false
            state: NSW
            employment_status: employee
            annual_income:
              amount: '145000.00'
              currency: AUD
            occupation:
              osca: 3323-11
              description: Painter
              qualifiers:
                trade_qualified: true
                working_height_m: 10
                manual_duties_percent: 80
          policy:
            structure: stepped
            ownership: super
            premium_waiver: exclude
            commission:
              basis: upfront
              dial_down_percent: '0'
          covers:
            - cover_id: life-1
              cover_type: life
              sum_insured:
                amount: '1000000.00'
                currency: AUD
            - cover_id: tpd-ext-1
              cover_type: tpd
              linked_to: life-1
              link_type: extension
              sum_insured:
                amount: '750000.00'
                currency: AUD
              ownership: ordinary
              tpd_definition: any_occupation
              life_buyback: after_1_year
    QuoteId:
      title: QuoteId
      description: Opaque, server-assigned identifier for a whole quote response. Required so a quote can be retrieved, audited and reproduced later — an adviser must be able to justify a recommendation years after making it.
      type: string
      minLength: 1
      maxLength: 128
    LineId:
      title: LineId
      description: Opaque, server-assigned identifier for one priced line within one quote. Unique within its `QuoteId`. Consumers MUST treat it as opaque and MUST NOT parse it. It is the key for per-line follow-up calls such as the unmet-needs diagnostic.
      type: string
      minLength: 1
      maxLength: 128
    InsurerId:
      title: InsurerId
      description: Stable identifier for the issuing insurer, assigned by this standard's registry so it is the same value at every implementer. Lowercase, hyphenated.
      type: string
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,30}[a-z0-9])$
      examples:
        - example-life
    BrandId:
      title: BrandId
      description: Stable identifier for the brand a line is sold under. Equal to the `InsurerId` where the insurer sells under a single brand. REQUIRED on every priced line even from a single-insurer endpoint, because one insurer commonly issues several brands and a consumer must not have to infer the brand from a product name.
      type: string
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,30}[a-z0-9])$
      examples:
        - example-life
        - example-select
    ProductName:
      title: ProductName
      description: The insurer's own marketing name for a product, verbatim, for display only.
      type: string
      minLength: 1
      maxLength: 200
      examples:
        - Protection Plus Life Cover
    RateTableVersion:
      title: RateTableVersion
      description: 'The insurer''s identifier for the pricing basis used for this line — a rate table version, effective date, or equivalent. REQUIRED for reproducibility: without it, "why is this premium different from the one we quoted last month" is unanswerable, which is the single most common audit question and the field insurers least often expose.'
      type: string
      minLength: 1
      maxLength: 64
      examples:
        - '2026-07-01'
        - RT-2026.2
    PremiumBreakdown:
      title: PremiumBreakdown
      description: |-
        One frequency's premium, split by whether it is funded inside or outside superannuation and with stamp duty shown separately on each side.
        ARITHMETIC INVARIANT, NORMATIVE AND TESTED:

          total == premium_super + stamp_duty_super + premium_non_super + stamp_duty_non_super

        exactly, to the cent, with no tolerance. `policy_fee` is INCLUDED within `total` and within whichever premium component bears it — it is not a further addition. Keeping the fee outside the total is a recurring source of comparison tables that understate the real cost.
        The super/non-super split is a genuine split, not a bucketing: one cover can carry both sides at once where it is written under a linked ownership structure.
      type: object
      required:
        - total
        - premium_super
        - premium_non_super
        - stamp_duty_super
        - stamp_duty_non_super
      additionalProperties: false
      properties:
        total:
          description: The all-in amount payable at this frequency.
          $ref: '#/components/schemas/NonNegativeMoney'
        premium_super:
          description: Premium funded from superannuation, excluding stamp duty.
          $ref: '#/components/schemas/NonNegativeMoney'
        premium_non_super:
          description: Premium funded outside superannuation, excluding stamp duty.
          $ref: '#/components/schemas/NonNegativeMoney'
        stamp_duty_super:
          description: Stamp duty attributable to the superannuation-funded premium.
          $ref: '#/components/schemas/NonNegativeMoney'
        stamp_duty_non_super:
          description: Stamp duty attributable to the non-superannuation premium.
          $ref: '#/components/schemas/NonNegativeMoney'
        policy_fee:
          description: |-
            The policy or administration fee at this frequency, GROSS of stamp duty — that is, the fee plus the duty levied on it, so it is the amount by which `total` exceeds the sum of the cover lines.
            Gross is stated explicitly because the two conventions differ by the duty rate and are indistinguishable in the payload. One insurer reporting the fee net and another gross makes a "premium excluding fees" figure, or any fee-to-fee comparison, silently wrong — and the difference is small enough to look like a product variation rather than a units error.
            Where the split matters, `policy_fee_premium` and `policy_fee_stamp_duty` give it exactly.
            Reported separately from the cover lines because the fee is not attributable to any one cover, so it cannot be recovered by summing them.
          $ref: '#/components/schemas/NonNegativeMoney'
        policy_fee_premium:
          description: The fee itself, excluding duty. Optional; where present, plus `policy_fee_stamp_duty` it MUST equal `policy_fee`.
          $ref: '#/components/schemas/NonNegativeMoney'
        policy_fee_stamp_duty:
          description: Stamp duty levied on the policy fee.
          $ref: '#/components/schemas/NonNegativeMoney'
    PremiumSet:
      title: PremiumSet
      description: |-
        The same line priced at each payment frequency the insurer quotes. `monthly` and `annual` are REQUIRED. The other four are present where the insurer quotes them and named in `not_quoted` where it does not.
        WHY NOT ALL SIX, WHICH THIS SCHEMA USED TO REQUIRE. The reasoning for requiring six was that a consumer given one frequency cannot derive the others, and that reasoning is sound — it is the ordering rule below and it still binds. The conclusion did not follow. An insurer that does not sell a weekly premium has no weekly premium to return, and requiring one obliges it to invent a figure by dividing: the very arithmetic this schema forbids the consumer, made worse by arriving with the authority of a quote. Sub-monthly billing in particular is not universal in this market, and a standard that cannot express its absence forces every insurer without it to fabricate.
        The two that remain required are the two that are not substitutable. `monthly` is what most policies are actually billed at and what an adviser presents. `annual` is what comparison, annualisation and projection totals are computed from. An insurer that can price a product at all can price it at both.
        A CONSUMER MUST NOT DERIVE AN ABSENT FREQUENCY, and this is the rule the whole schema is shaped around. Sub-annual premiums carry a frequency loading, so `weekly x 52 >= fortnightly x 26 >= monthly x 12 >= quarterly x 4 >= half_yearly x 2 >= annual`. A frequency absent here is not purchasable at any price, so dividing `annual` produces a number that is both wrong and unbuyable while looking entirely normal. Offer the frequencies that are present; offer no control for the ones that are not.
        ROUNDING. The ordering holds on the UNROUNDED amounts. Once each frequency is rounded to the cent the products can cross by up to one cent per period — a $1,000 annual premium at zero loading gives monthly 83.33 (annualising to 999.96) and quarterly 250.00 (1,000.00), so monthly annualises BELOW quarterly. A consumer checking the ordering MUST therefore allow a tolerance of `periods x $0.01`; a conformance test without it fails every honest zero-loading insurer.
        An insurer that levies no frequency loading returns sets whose annualised totals are equal within that tolerance; that is valid.
      type: object
      required:
        - monthly
        - annual
      additionalProperties: false
      properties:
        weekly:
          $ref: '#/components/schemas/PremiumBreakdown'
        fortnightly:
          $ref: '#/components/schemas/PremiumBreakdown'
        monthly:
          $ref: '#/components/schemas/PremiumBreakdown'
        quarterly:
          $ref: '#/components/schemas/PremiumBreakdown'
        half_yearly:
          $ref: '#/components/schemas/PremiumBreakdown'
        annual:
          $ref: '#/components/schemas/PremiumBreakdown'
        not_quoted:
          description: |-
            Which of the optional frequencies this insurer does not quote for this line, and therefore why they are absent above.
            STATED RATHER THAN LEFT TO INFERENCE, because absence on its own is ambiguous in exactly the way this standard exists to remove. A consumer cannot otherwise tell a frequency the insurer does not sell from one an implementation omitted by mistake, and the two call for opposite responses: the first is a product fact to reflect in the UI, the second is a defect to report. It also makes the difference between two lines in one comparison legible — an insurer that bills weekly and one that does not are offering different things, and an adviser should be able to see which.
            MUST NOT name a frequency that is present above. That is a contradiction and the schema rejects it.
            SHOULD name every optional frequency absent above. It is not required to, and the asymmetry is deliberate: `premiums` itself remains the sole authority on what was quoted, so a consumer MUST treat any absent frequency as unquoted whether or not it appears here. Were this list authoritative instead, an implementation that forgot to populate it would turn an absent premium into an apparently derivable one, which is the failure the field was added to prevent.
            `monthly` and `annual` cannot appear here, because they are always present.
            An empty array is the ordinary case for an insurer that quotes every frequency.
          type: array
          uniqueItems: true
          maxItems: 4
          items:
            description: 'One optional frequency. Spelled out rather than referencing `Frequency` and narrowing it: the two required frequencies are not expressible here at all, so a narrowed copy is the honest type, and composing it would also hit the generator problem described at the top of `covers.yaml`.'
            type: string
            enum:
              - weekly
              - fortnightly
              - quarterly
              - half_yearly
          default: []
      dependentSchemas:
        weekly:
          properties:
            not_quoted:
              not:
                contains:
                  const: weekly
        fortnightly:
          properties:
            not_quoted:
              not:
                contains:
                  const: fortnightly
        quarterly:
          properties:
            not_quoted:
              not:
                contains:
                  const: quarterly
        half_yearly:
          properties:
            not_quoted:
              not:
                contains:
                  const: half_yearly
    CoverTypeResponse:
      title: CoverTypeResponse
      description: |-
        RESPONSE-facing CoverType. Same meaning as `CoverType`, but extensible: a consumer MUST pass an unrecognised value through for display rather than failing, so that adding to the benefits is a minor release rather than a major one.
        Known values: [life, tpd, trauma, income_protection, business_expenses, needle_stick, child_trauma]. Validate against `CoverType` when SENDING; tolerate anything when RECEIVING.
      type: string
      x-extensible-enum:
        - life
        - tpd
        - trauma
        - income_protection
        - business_expenses
        - needle_stick
        - child_trauma
    OwnershipResponse:
      title: OwnershipResponse
      description: |-
        RESPONSE-facing Ownership. Same meaning as `Ownership`, but extensible: a consumer MUST pass an unrecognised value through for display rather than failing, so that adding to the ownership forms is a minor release rather than a major one.
        Known values: [super, ordinary, smsf, superlink, smsf_superlink]. Validate against `Ownership` when SENDING; tolerate anything when RECEIVING.
      type: string
      x-extensible-enum:
        - super
        - ordinary
        - smsf
        - superlink
        - smsf_superlink
    StructureResponse:
      title: StructureResponse
      description: |-
        RESPONSE-facing Structure. Same meaning as `Structure`, but extensible: a consumer MUST pass an unrecognised value through for display rather than failing, so that adding to the premium structures is a minor release rather than a major one.
        Known values: [stepped, level_65, level_70, blended]. Validate against `Structure` when SENDING; tolerate anything when RECEIVING.
      type: string
      x-extensible-enum:
        - stepped
        - level_65
        - level_70
        - blended
    CommissionBasisResponse:
      title: CommissionBasisResponse
      description: |-
        `CommissionBasis` on the way back, extensible. A consumer MUST pass an unrecognised value through — displaying it, and treating the line as priced on a basis it does not know rather than as one of the three it does. Mapping an unknown basis onto `upfront` because it is the common default is the failure this split exists to prevent: it would put a line into a comparison as though its price were the upfront price.
        Same values as `CommissionBasis`. The two are separate schemas for the reason set out in `docs/VERSIONING.md` — request enums are closed so a typo fails, response enums are extensible so the standard can grow without every consumer breaking.
      type: string
      x-extensible-enum:
        - upfront
        - hybrid
        - level
    AppliedCommission:
      title: AppliedCommission
      description: |-
        The remuneration basis a premium was actually written on.
        THIS IS PART OF THE PRICE, not a disclosure. It is what makes two lines comparable, so it is reported whether or not the consumer asked for anything — an insurer with a single basis states it as plainly as one that honoured a request.
        Reporting it here does NOT discharge the `resolved_options` obligation, and the two answer different questions. This says what was priced; `resolved_options` says whether that was what was asked for. An insurer that could not write the requested basis must do both: report the basis it used here, and report `substituted` there with the reason. A consumer comparing this block against its own request to detect a substitution is doing the insurer's job, and will get it wrong on the deferred cases.
      type: object
      required:
        - basis
      additionalProperties: false
      properties:
        basis:
          $ref: '#/components/schemas/CommissionBasisResponse'
        dial_down_percent:
          description: |-
            The dial-down actually applied, as the share of standard commission GIVEN UP. Absent means none was applied, OR that the option applied is not expressible as a share of the standard — see `InsurerCommissionOption.dial_down_percent`. Where the two need telling apart, the `insurer_commission_id` beside this field is what does it.
            An insurer that rounded a requested dial-down to one of its own steps, or capped it, MUST report the applied figure here and a `substituted` entry in `resolved_options`.
          $ref: '#/components/schemas/SharePercentage'
        insurer_commission_id:
          description: |-
            The insurer's own identifier for the option this was priced on, from `commission_bases[].options`.
            RECOMMENDED on every priced line, and the same argument as `ResolvedOccupation`: a premium whose remuneration cannot be reproduced cannot be audited, and `basis` plus a percentage does not always identify one option — an insurer with two options at the same nominal dial-down, or one whose option is not a dial-down at all, is otherwise indistinguishable from itself months later. REQUIRED where the request named an `insurer_commission_id`, so a consumer can confirm the id it sent is the id that priced.
          type: string
          minLength: 1
          maxLength: 128
      examples:
        - basis: upfront
          dial_down_percent: '0'
          insurer_commission_id: UF-100
    CoverLine:
      title: CoverLine
      description: |-
        One priced cover within a line. `cover_id` is echoed from the request so a consumer can match a priced cover to the one it asked for without guessing from type and amount.
        THE AMOUNT FIELD DEPENDS ON THE COVER. Income protection and business expenses are written as a MONTHLY BENEFIT and carry `monthly_benefit`; every other cover carries `sum_insured`. Before this distinction existed, `sum_insured` was the only option and an insurer had to choose how to report a $6,500-a-month benefit — as `6500.00` or annualised to `78000.00`, both conformant. A consumer comparing benefits across a panel was comparing incompatible units with nothing to disambiguate them, and a 12x discrepancy reads as a product difference rather than an error.
      type: object
      required:
        - cover_type
        - premiums
      additionalProperties: false
      dependentSchemas:
        monthly_benefit:
          properties:
            cover_type:
              enum:
                - income_protection
                - business_expenses
        sum_insured:
          properties:
            cover_type:
              not:
                enum:
                  - income_protection
                  - business_expenses
      if:
        properties:
          cover_type:
            enum:
              - income_protection
              - business_expenses
        required:
          - cover_type
      then:
        required:
          - monthly_benefit
        properties:
          monthly_benefit:
            $ref: '#/components/schemas/NonNegativeMoney'
      else:
        required:
          - sum_insured
        properties:
          sum_insured:
            $ref: '#/components/schemas/NonNegativeMoney'
      properties:
        cover_id:
          description: Echoed from the request. Absent only where the insurer added this cover of its own accord because the product requires it.
          $ref: '#/components/schemas/CoverId'
        cover_type:
          description: Extensible on the response side — see `CoverTypeResponse`. Pass an unrecognised value through rather than failing.
          $ref: '#/components/schemas/CoverTypeResponse'
        description:
          description: The insurer's own name for this cover as written.
          type: string
          maxLength: 200
        sum_insured:
          description: The lump sum actually written, which may differ from the amount requested where the insurer applied a cap or a product minimum. Any such difference MUST also appear in `resolved_options` as `substituted`. Present on every cover EXCEPT income protection and business expenses.
          $ref: '#/components/schemas/NonNegativeMoney'
        monthly_benefit:
          description: The MONTHLY benefit actually written — not annualised. Present on income protection and business expenses, and on nothing else. Where the insurer capped it below the amount requested, that MUST also appear in `resolved_options` as `substituted`.
          $ref: '#/components/schemas/NonNegativeMoney'
        waiting_period:
          description: The waiting period as WRITTEN, for the monthly-benefit covers. Reported here as well as in `inclusions` because the as-written terms are what a consumer compares, and `inclusions` is optional, free-text-keyed, and therefore not something to depend on.
          $ref: '#/components/schemas/WaitingPeriod'
        benefit_period:
          description: The benefit period as written, for the monthly-benefit covers.
          $ref: '#/components/schemas/BenefitPeriod'
        tpd_definition:
          description: The TPD test as written. An own-occupation and an any-occupation TPD at the same sum insured are materially different cover, so a consumer comparing two lines needs this structurally rather than having to parse it out of display text.
          $ref: '#/components/schemas/TpdDefinition'
        ownership:
          $ref: '#/components/schemas/OwnershipResponse'
        structure:
          $ref: '#/components/schemas/StructureResponse'
        commission:
          description: |-
            The remuneration basis THIS cover was written on. REQUIRED wherever it differs from the line's — omitted, this cover is on the line's basis.
            The case it exists for is an insurer that writes the requested basis on most of a policy but not on one benefit, typically because that benefit is being written above the age at which the basis is offered. The line is still a real offer and should still be priced; what cannot happen is the difference going unreported, because the affected cover's premium is then lower than the line's declared basis accounts for and the discrepancy looks like a product difference.
            THIS IS THE ONLY PER-COVER COMMISSION CHANNEL IN THE CONTRACT, and deliberately one-way: the insurer reports the exception, the consumer cannot request it. `CommissionRequest` sets out why — no engine examined applies remuneration per benefit, and the one that could be forced to went on reporting the policy basis regardless.
            JSON Schema cannot compare this against the parent line's value, so the requirement is normative here and tested by the conformance suite.
          $ref: '#/components/schemas/AppliedCommission'
        linked_to:
          description: Echoed from the request where this cover was written as an extension.
          $ref: '#/components/schemas/CoverId'
        premiums:
          description: |-
            This cover's contribution to the line's premium. The same arithmetic invariant applies per cover, and so does the frequency rule: a cover line carries the frequencies the insurer quotes, which are the SAME ones the enclosing line carries. Frequency availability is a property of how the insurer bills a policy, not of an individual benefit, so a cover line quoting a frequency its line does not — or omitting one its line has — is a defect.
            Summing `cover_lines[].premiums[f].total` will NOT reach the line total wherever a policy fee applies — read the line total, do not derive it.
          $ref: '#/components/schemas/PremiumSet'
    CoverRating:
      title: CoverRating
      description: 'One cell of an insurer''s occupation rating matrix: the class it would rate this occupation at for one benefit, and whether that benefit is available to the occupation at all.'
      type: object
      required:
        - supported
      additionalProperties: false
      if:
        properties:
          supported:
            const: true
        required:
          - supported
      then:
        required:
          - rating_class
        properties:
          rating_class: {}
      properties:
        supported:
          description: Whether this benefit can be offered to this occupation. `false` means the occupation is uninsurable for this benefit — distinct from a poor rating class.
          type: boolean
        rating_class:
          description: 'The insurer''s own class code. INSURER-SCOPED: class "1" at one insurer has no defined relationship to class "1" at another, and consumers MUST NOT compare, sort or average this value across insurers. Absent when `supported` is `false`.'
          type: string
          maxLength: 32
        rating_class_label:
          description: A human-readable rendering of the class, for display where the code is cryptic.
          type: string
          maxLength: 100
    OccupationRatings:
      title: OccupationRatings
      description: An insurer's rating of one occupation across every benefit it offers. Keys are `CoverType` values, except that TPD is split by definition because a single occupation is routinely ratable under one TPD test and uninsurable under another.
      type: object
      additionalProperties: false
      properties:
        life:
          $ref: '#/components/schemas/CoverRating'
        trauma:
          $ref: '#/components/schemas/CoverRating'
        tpd_own_occupation:
          $ref: '#/components/schemas/CoverRating'
        tpd_any_occupation:
          $ref: '#/components/schemas/CoverRating'
        tpd_adl:
          $ref: '#/components/schemas/CoverRating'
        tpd_home_duties:
          description: The domestic-duties TPD test. Present because it is the only TPD basis available to a non-working insured, so omitting it left exactly the clients `employment_basis` exists for with no way to learn whether they are insurable.
          $ref: '#/components/schemas/CoverRating'
        income_protection:
          $ref: '#/components/schemas/CoverRating'
        business_expenses:
          $ref: '#/components/schemas/CoverRating'
        needle_stick:
          description: 'Availability here is purely occupation-driven — the benefit is offered to healthcare occupations and nobody else — which makes it precisely the case this matrix exists to pre-answer. Without the key an insurer had nowhere to say `supported: false`, and a consumer had to spend a pricing call to find out.'
          $ref: '#/components/schemas/CoverRating'
        child_trauma:
          $ref: '#/components/schemas/CoverRating'
    ResolvedOccupation:
      title: ResolvedOccupation
      description: What the insurer actually rated on. REQUIRED on every priced line, because a quote whose occupation cannot be reproduced cannot be audited, and because a wrong occupation produces a wrong premium that looks entirely normal.
      type: object
      required:
        - description
        - ratings
      additionalProperties: false
      oneOf:
        - required:
            - insurer_occupation_id
        - required:
            - employment_basis
      properties:
        insurer_occupation_id:
          description: The row rated. Absent only where `employment_basis` was used, since a non-working basis is not a row in the insurer's occupation list.
          type: string
          minLength: 1
          maxLength: 128
        employment_basis:
          description: Echoed when the insured was rated on a non-working basis rather than an occupation. Exactly one of this or `insurer_occupation_id` is present.
          type: string
          enum:
            - home_duties
            - retired
            - unemployed
            - student
        description:
          description: The insurer's own wording for what it rated.
          type: string
          maxLength: 200
        ratings:
          $ref: '#/components/schemas/OccupationRatings'
        match_confidence:
          description: How confident the insurer is in the match, when it matched from a baseline code rather than being given `insurer_occupation_id`. `exact` means a maintained one-to-one mapping. Consumers SHOULD surface anything below `exact` to the adviser for confirmation rather than pricing silently.
          type: string
          enum:
            - exact
            - high
            - moderate
            - low
    ResolvedOption:
      title: ResolvedOption
      description: |-
        What became of one requested option. An entry is REQUIRED for every option the insurer did not apply exactly as asked, and for every deferred choice (`prefer`, `prefer_include`, `prefer_exclude`, `any`) whether or not the outcome matched the leaning.
        NORMATIVE: any option present in the request but NOT reflected in this array with an `applied` value equal to the requested value MUST be reported here — and an option the product cannot honour at all MUST be reported as `unsupported_ignored`. An insurer that silently ignores an option produces a line that looks like it included a benefit it did not, which is the most consequential defect this standard exists to prevent.
        `commission` IS THE ONE OPTION REPORTED EVEN WHEN IT WAS NEVER SENT. Every other option absent from the request is absent from this array too; a commission basis the request did not name is reported as `defaulted`, because the insurer chose a basis regardless and that choice moved the premium. See `CommissionRequest`.
      type: object
      required:
        - cover_id
        - option
        - resolution
      additionalProperties: false
      if:
        properties:
          resolution:
            const: substituted
        required:
          - resolution
      then:
        required:
          - applied
        properties:
          applied: {}
      properties:
        cover_id:
          description: The cover the option was given on, echoed from the request. Use the literal `policy` for an option given at policy level.
          type: string
          maxLength: 64
        option:
          description: The field name of the option, as it appears in the request schema. Use `commission` for the remuneration basis, at policy level or on a named cover.
          type: string
          maxLength: 120
          examples:
            - double_benefit
            - waiting_period
            - structure
            - commission
        requested:
          description: The value the consumer asked for. Absent where the consumer did not supply one.
        applied:
          description: The value the insurer actually priced. Absent where the option was ignored entirely.
        resolution:
          type: string
          enum:
            - as_requested
            - resolved_by_insurer
            - defaulted
            - unsupported_ignored
            - substituted
        detail:
          description: Why, in adviser-facing terms. RECOMMENDED whenever the resolution is `unsupported_ignored`, and for `substituted` it is what lets an adviser judge whether the substitution is acceptable.
          type: string
          maxLength: 300
    ResolvedFeature:
      title: ResolvedFeature
      description: |-
        What one required feature did to this line.
        A REQUIRED FEATURE IS A FILTER, so unlike `ResolvedOption` there is no "applied differently" outcome — either a product carrying the feature was used, or the benefit could not be written. The value of this array is that it says WHICH feature failed, on a line whose `errors` would otherwise say only that the need could not be met.
        THE TWO FAILURES ARE DIFFERENT ANSWERS AND MUST NOT BE COLLAPSED. `unrecognised` is a fault in the request — a code the insurer has never heard of, or one sent under a benefit it does not scope it to — and an adviser needs to correct it. `not_offered` is a fact about the insurer's range. Reporting a mistyped code as `not_offered` tells an adviser that no product in the market offers something, which is a claim about the market and is not one this insurer made.
        A consumer sending only standard codes and getting `unrecognised` back has found an implementation that has not published a mapping for it, not a typo — which is why `feature_resolution` requires every implementation to accept `standard`.
      type: object
      required:
        - feature
        - scope
        - resolution
      additionalProperties: false
      properties:
        feature:
          description: The code as the consumer sent it, echoed verbatim in whichever vocabulary it used.
          type: string
          maxLength: 64
        standard_feature:
          description: The portable code this resolves to, where the insurer can say. Populated when the consumer sent an insurer code that maps to one, so a consumer holding a mixed request can key its display off one vocabulary.
          type: string
          maxLength: 64
        scope:
          description: The key this feature was requested under — a cover type, or `policy`.
          type: string
          maxLength: 40
          examples:
            - policy
            - life
            - trauma
            - income_protection
        resolution:
          type: string
          enum:
            - available
            - not_offered
            - unrecognised
        detail:
          description: Why, in adviser-facing terms. RECOMMENDED on `not_offered` and `unrecognised`; on the latter it is the only thing that distinguishes "never heard of it" from "not on this cover", which is what an adviser needs to fix the request.
          type: string
          maxLength: 300
      examples:
        - feature: agreed_value
          scope: income_protection
          resolution: not_offered
          detail: No income protection product in this range is written on an agreed-value basis.
        - feature: TRM_TERM_ILL
          standard_feature: terminal_illness_benefit
          scope: life
          resolution: available
    InclusionGroup:
      title: InclusionGroup
      description: One grouping of as-priced settings — typically one per cover written.
      type: object
      required:
        - title
        - items
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 120
        items:
          type: array
          items:
            type: object
            required:
              - field
              - value
            additionalProperties: false
            properties:
              field:
                description: The name of the setting, as a standard field path where one applies (for example `waiting_period`), so a consumer can label it in its own vocabulary.
                type: string
                maxLength: 120
              value:
                description: The as-priced value. A standard enum value where one applies.
              display_label:
                description: The insurer's own wording, where it wants a specific rendering.
                type: string
                maxLength: 200
    ProjectionBasis:
      title: ProjectionBasis
      description: What the insurer actually projected, which is not always what was asked. An insurer that applied a different indexation rate, or could not index some covers, says so here rather than in `resolved_options`, because the answer is only interpretable alongside the numbers.
      type: object
      required:
        - years
        - indexed
      additionalProperties: false
      properties:
        years:
          description: How many years the projection covers, matching the length of `years`.
          type: integer
          minimum: 1
          maximum: 60
        indexed:
          description: Whether sums insured were grown across the projection.
          type: boolean
        indexation_rate:
          description: The annual rate actually applied. REQUIRED when `indexed` is `true` — including where the insurer applied its own default because the request named no rate, which is the case a consumer most needs told.
          $ref: '#/components/schemas/Percentage'
        excluded_covers:
          description: |-
            `cover_id`s that were NOT indexed because the product does not index them, while the rest of the projection was. Empty or absent means every cover was treated alike.
            Real products do this — a child trauma benefit is commonly flat inside an otherwise indexed policy — and without this field those covers' premiums are simply lower than a consumer's own recalculation would predict, with nothing to attribute the difference to.
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CoverId'
          default: []
    ProjectionYear:
      title: ProjectionYear
      description: One year of a projection.
      type: object
      required:
        - year
        - annual_total
        - cumulative_total
      additionalProperties: false
      properties:
        year:
          description: Offset from the current year. `0` is the year being quoted.
          type: integer
          minimum: 0
          maximum: 59
        age_next_birthday:
          description: The insured's age next birthday in that year, so a consumer can label the series by age rather than by offset. Omitted where the request carried no age the insurer can advance.
          type: integer
          minimum: 0
          maximum: 120
        annual_total:
          description: The all-in cost for that year — premium plus stamp duty plus policy fee, on the same basis as `PremiumBreakdown.total` at annual frequency.
          $ref: '#/components/schemas/NonNegativeMoney'
        cumulative_total:
          description: The running total up to and including this year. Stated rather than left to the consumer because rounding each year and summing gives a different answer from summing and rounding once, and two consumers doing it differently is a comparison table that disagrees with itself.
          $ref: '#/components/schemas/NonNegativeMoney'
        sum_insured_indexed:
          description: Whether this year's figure reflects an indexed sum insured. Distinguishes the first year of an indexed projection, which is normally unindexed, from the rest.
          type: boolean
          default: false
    Projection:
      title: Projection
      description: |-
        One line's cost projected forward, year by year, with the running total.
        The year-by-year series is returned rather than a single headline number because a consumer presents this several ways — average annual cost, cumulative cost, first year, final year — and every one of those is derivable from the series. Returning only a total would force a re-quote per presentation, which is what advisers do today.
        THE BASIS MUST BE ECHOED. A projection with indexation applied and one without are different questions with different answers, and a consumer comparing an indexed projection from one insurer against a flat one from another gets a difference that has nothing to do with price.
      type: object
      required:
        - basis
        - total
        - years
      additionalProperties: false
      properties:
        basis:
          $ref: '#/components/schemas/ProjectionBasis'
        total:
          description: The cumulative cost over the whole horizon — the final year's `cumulative_total`, repeated here so a consumer showing only the headline need not walk the series.
          $ref: '#/components/schemas/NonNegativeMoney'
        years:
          description: 'One entry per projected year, ordered from `year: 0` (the current year, whose `annual_total` MUST equal the annual figure in `premiums`) and contiguous thereafter.'
          type: array
          minItems: 1
          maxItems: 60
          items:
            $ref: '#/components/schemas/ProjectionYear'
    Score:
      title: Score
      description: A research score from 0 to 100 inclusive, as a decimal string with at most two places.
      type: string
      pattern: ^(100(\.0{1,2})?|\d{1,2}(\.\d{1,2})?)$
      examples:
        - '0'
        - '87.5'
        - '100'
    ResearchScores:
      title: ResearchScores
      description: |-
        Third-party research ratings for a line, as published by a research house.
        NOT THE INSURER'S OWN OPINION, and the standard is deliberate about that. An insurer that scored its own products here would be marking its own homework, so `provider` is REQUIRED and a consumer that cannot attribute a score should not display it. Scores are only comparable between lines rated by the same provider on the same dataset.
        Optional throughout. Most insurers will not carry these at all; an aggregator or a research licensee may.
      type: object
      required:
        - provider
      additionalProperties: false
      properties:
        provider:
          description: The research house whose ratings these are.
          type: string
          maxLength: 120
        dataset_version:
          description: The provider's identifier for the dataset the scores came from. Scores move when a provider republishes, so without this a stored score cannot be reproduced or defended — the same reasoning as `rate_table_version`.
          type: string
          maxLength: 64
        feature_score:
          description: The product's feature rating, 0 to 100, where higher is more comprehensive. A measure of what the product covers, independent of price.
          $ref: '#/components/schemas/Score'
        combined_score:
          description: 'The provider''s blended rating of features against price, 0 to 100. Deliberately separate from `feature_score`: they answer different questions and a consumer sorting on the wrong one recommends the wrong product.'
          $ref: '#/components/schemas/Score'
    LineDocument:
      title: LineDocument
      description: |-
        A document or link relating to one quote line.
        Modelled as a typed list rather than as named fields so a new document type is a new enum value rather than a schema change, and so an insurer offering none simply returns an empty array.
        URLS MAY BE SHORT-LIVED AND MAY CARRY AUTHORITY. A `continue_application` link in particular can resume a quote inside the insurer's own system, so it MUST be treated as a credential: consumers MUST NOT log it, embed it in a shared document, or hand it to anyone who is not the adviser who requested the quote. An insurer SHOULD set `expires_at` on any link that grants access rather than issuing one that lives forever.
      type: object
      required:
        - document_type
        - url
      additionalProperties: false
      properties:
        document_type:
          type: string
          enum:
            - pds
            - target_market_determination
            - quote_report
            - continue_application
            - application_form
        url:
          type: string
          format: uri
          maxLength: 2048
        media_type:
          description: The document's media type, e.g. `application/pdf`. Omit for a link to a web page, where the answer is `text/html` and saying so adds nothing.
          type: string
          maxLength: 100
        title:
          description: The insurer's own name for the document, for display.
          type: string
          maxLength: 200
        expires_at:
          description: When the URL stops working. RFC 3339 with an explicit offset. Absent means the insurer makes no commitment either way, which a consumer should read as "do not store this".
          type: string
          format: date-time
    QuoteLine:
      title: QuoteLine
      description: 'One row of a comparison table: one product or product combination, from one brand, at one campaign variant.'
      type: object
      required:
        - line_id
        - insurer_id
        - brand_id
        - product_name
        - all_needs_met
        - resolved_occupation
      additionalProperties: false
      if:
        properties:
          all_needs_met:
            const: false
      then:
        properties:
          premiums:
            not: {}
          cover_lines:
            maxItems: 0
          projection:
            not: {}
          errors:
            minItems: 1
        required:
          - errors
      else:
        required:
          - premiums
          - rate_table_version
          - commission
        properties:
          premiums: {}
          rate_table_version: {}
          commission: {}
          errors:
            maxItems: 0
      properties:
        line_id:
          $ref: '#/components/schemas/LineId'
        insurer_id:
          $ref: '#/components/schemas/InsurerId'
        brand_id:
          $ref: '#/components/schemas/BrandId'
        product_name:
          $ref: '#/components/schemas/ProductName'
        component_products:
          description: The insurer's own names for each product this line was assembled from, where a line combines more than one. Display only.
          type: array
          items:
            $ref: '#/components/schemas/ProductName'
          default: []
        rate_table_version:
          $ref: '#/components/schemas/RateTableVersion'
        all_needs_met:
          description: |-
            Whether the insurer assembled EVERY cover requested. `false` means it could not, and `errors` MUST then be non-empty and `premiums` MUST be absent.
            This is not an error response. The insurer was able to answer; the answer is that this combination cannot be written. Consumers MUST NOT present such a line as a price, MUST NOT include it in a cheapest-first sort, and MUST NOT allow it to be selected.
          type: boolean
        errors:
          description: Why the requested covers could not be assembled, in terms an adviser can act on ("the linked TPD amount cannot exceed the life cover"). Non-empty exactly when `all_needs_met` is `false`.
          type: array
          items:
            type: string
          default: []
        premiums:
          description: |-
            The price of this line at each payment frequency the insurer quotes. REQUIRED on a line where `all_needs_met` is `true`; MUST be absent otherwise.
            Which frequencies that is varies by insurer, and the ones it does not quote are named in `PremiumSet.not_quoted`. A consumer comparing lines across a panel therefore compares on `annual` or `monthly`, the two every line carries.
          $ref: '#/components/schemas/PremiumSet'
        cover_lines:
          description: The priced covers making up this line, one per cover the insurer wrote. Includes covers the insurer added of its own accord where a product requires them.
          type: array
          items:
            $ref: '#/components/schemas/CoverLine'
          default: []
        commission:
          description: |-
            The remuneration basis this line was PRICED on. REQUIRED on a line where `all_needs_met` is `true` — including where the request said nothing about commission and the insurer applied its own default, which is the case a consumer most needs told.
            Required rather than conditional on having been asked, because the field answers a question about the premium rather than about the request. A consumer receiving lines from several insurers cannot otherwise tell an upfront-commission premium from a level-commission one, and sorting the two together ranks the panel on remuneration.
            Where the covers in this line were not all written on the same basis, this reports the basis applied to the line as a whole and each cover that differs carries its own — see `CoverLine.commission`.
          $ref: '#/components/schemas/AppliedCommission'
        resolved_occupation:
          $ref: '#/components/schemas/ResolvedOccupation'
        resolved_options:
          description: What the insurer did with every option that it decided rather than simply obeyed. See `ResolvedOption` — this array is how a consumer learns that an option was dropped.
          type: array
          items:
            $ref: '#/components/schemas/ResolvedOption'
          default: []
        resolved_features:
          description: What happened to every code in `required_features`. REQUIRED whenever the request carried any, on priced and declined lines alike — a declined line is precisely the case a consumer needs the reason for. See `ResolvedFeature`.
          type: array
          items:
            $ref: '#/components/schemas/ResolvedFeature'
          default: []
        campaign:
          description: The campaign variant this line was priced under. Absent on a standard-rates line.
          type: object
          required:
            - code
            - name
          additionalProperties: false
          properties:
            code:
              type: string
              maxLength: 64
            name:
              description: The insurer's own wording for the campaign, for display.
              type: string
              maxLength: 200
        medical_requirements:
          description: |-
            Mandatory medical underwriting this insurer requires before it will issue THIS line, in the insurer's own wording. Requirements scale with the sum insured, so two lines from the same insurer can legitimately differ.
            An EMPTY array means "none required" and is a positive statement. It is distinct from `underwriting_reported: false`, which means the insurer has not told us either way — a consumer MUST NOT render the latter as "no medicals required".
          type: array
          items:
            type: string
            maxLength: 200
          default: []
        underwriting_reported:
          description: Whether `medical_requirements` is a complete answer for this line.
          type: boolean
          default: false
        inclusions:
          description: The line's as-priced configuration, as structured values rather than rendered text, so a consumer can display it in its own words. Read from what the insurer actually wrote, which differs from the request wherever a deferred choice was settled.
          type: array
          items:
            $ref: '#/components/schemas/InclusionGroup'
          default: []
        projection:
          description: This line's cost projected forward. Present only where the request asked for a projection and the insurer can produce one; a line where `all_needs_met` is `false` MUST NOT carry one, since there is no premium to project.
          $ref: '#/components/schemas/Projection'
        research_scores:
          description: Third-party research ratings for this line, where the insurer publishes them.
          $ref: '#/components/schemas/ResearchScores'
        documents:
          description: Documents and links relating to THIS line — the product disclosure statement, a branded quote report, a deep link into the insurer's own system to continue the application.
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/LineDocument'
          default: []
    QuoteResponse:
      title: QuoteResponse
      description: 'The result of a pricing request: every line the insurer can offer for the covers requested, plus the lines it had to decline. Lines are a FLAT array, never a map keyed by brand or product — one brand routinely produces several lines once campaigns are in play.'
      type: object
      required:
        - quote_id
        - quoted_at
        - lines
      additionalProperties: false
      properties:
        quote_id:
          $ref: '#/components/schemas/QuoteId'
        quoted_at:
          description: When the quote was priced. RFC 3339 with an explicit offset.
          type: string
          format: date-time
        valid_until:
          description: 'When these premiums cease to be reliable. Advisory but strongly RECOMMENDED: without it a consumer cannot tell a stale saved quote from a current one.'
          type: string
          format: date-time
        client_reference:
          description: Echoed verbatim from the request, so the response can be reconciled.
          $ref: '#/components/schemas/ClientReference'
        lines:
          description: Every line the insurer produced, priced and unpriced alike. MAY be empty, which means the insurer offers nothing at all for this insured — a legitimate answer, not an error.
          type: array
          items:
            $ref: '#/components/schemas/QuoteLine'
        warnings:
          description: 'Adviser-facing notes that apply to the whole quote rather than one line. For information only: a warning MUST NOT be the sole indication that something was not priced as asked — that belongs in `resolved_options` or `errors` on the affected line.'
          type: array
          items:
            type: string
          default: []
    Problem:
      title: Problem
      description: An RFC 9457 problem details document.
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          description: A URI identifying the problem kind. Use a registered value from `ProblemType` where one applies. Consumers branch on this field; `title` and `detail` are for humans.
          type: string
          format: uri
          default: about:blank
        title:
          description: A short, human-readable summary of the problem kind. Stable per `type`.
          type: string
        status:
          description: The HTTP status code, repeated here so a logged problem is self-contained.
          type: integer
          minimum: 400
          maximum: 599
        detail:
          description: A human-readable explanation specific to this occurrence. MUST NOT contain personal information about the insured — problem documents are logged widely on both sides.
          type: string
        instance:
          description: A URI reference identifying this specific occurrence.
          type: string
          format: uri-reference
        request_id:
          description: The value of the `X-Request-Id` header for the failed request, echoed so a consumer can quote one token when asking the insurer to investigate.
          type: string
        errors:
          description: Field-level detail, present on validation failures. Each entry MUST carry a JSON Pointer to the offending member of the request body, so a consumer can highlight the exact control that was wrong rather than showing a whole-form error.
          type: array
          items:
            type: object
            required:
              - pointer
              - detail
            additionalProperties: false
            properties:
              pointer:
                description: RFC 6901 JSON Pointer into the request body.
                type: string
                examples:
                  - /covers/1/waiting_period
              detail:
                type: string
              value_supplied:
                description: The rejected value, echoed for diagnosis. Omit where it is sensitive.
              values_supported:
                description: The values that would have been accepted. Populating this turns a failed integration attempt into a self-service fix.
                type: array
                items: {}
      examples:
        - type: https://openlife.org.au/problems/unsupported-value
          title: Unsupported value
          status: 422
          detail: This implementation does not support one of the values supplied.
          request_id: 01JQ8Z9YB4T7M2XR
          errors:
            - pointer: /example_field
              detail: Not supported by this implementation.
              value_supplied: unsupported_value
              values_supported:
                - supported_value_a
                - supported_value_b
    InsurerCommissionOption:
      title: InsurerCommissionOption
      description: |-
        One commission option on an insurer's own list, addressable by `insurer_commission_id`.
        The same shape of thing as an `InsurerOccupation` row: the insurer's identifier, the insurer's own label, and what this standard can say about it in portable terms. Where the portable terms do not reach — the arrangements described on `options` — the id is the only way to name it, and the `name` is what an adviser has to be shown instead of a percentage.
      type: object
      required:
        - insurer_commission_id
      additionalProperties: false
      properties:
        insurer_commission_id:
          description: The insurer's own identifier for this option, to send in `CommissionRequest`. Opaque, and scoped to this insurer — the same string may name a different option at another insurer, so a consumer MUST NOT carry one across a panel.
          type: string
          minLength: 1
          maxLength: 128
        name:
          description: 'The insurer''s own label, for display. NON-NORMATIVE: a consumer MUST NOT parse it. Real labels include `Upfront (66/22)`, `Hybrid: 75%` and `P90 Upfront`, which are three unrelated conventions — the first names the two rates, the second the share retained, the third a premium factor. Anything derived from that string is a guess.'
          type: string
          maxLength: 200
        dial_down_percent:
          description: |-
            What this option is in portable terms: the share of the insurer's standard commission for this basis that is GIVEN UP.
            ABSENT IS MEANINGFUL. It says this option is not a dial-down of the standard at all, and therefore cannot be requested as `basis` plus a percentage — only by id. An insurer MUST NOT approximate one here to fill the field in, because a consumer reading it would then send that approximation and be priced on something else.
          $ref: '#/components/schemas/SharePercentage'
      examples:
        - insurer_commission_id: UF-100
          name: Upfront (66/22)
          dial_down_percent: '0'
        - insurer_commission_id: UF-0-22
          name: Upfront (0/22)
    CommissionBasisCapability:
      title: CommissionBasisCapability
      description: |-
        One remuneration basis this insurer writes a cover on, with the bounds that apply to it.
        The age bounds are the point of the schema. An adviser sets a policy-wide basis and one benefit in the policy falls outside the ages the insurer offers it on, so that benefit alone has to be written on another basis — and until a consumer can read this, the only way to learn it is to send the quote and interpret a decline. The bounds are read against `insured.age_next_birthday`, the same age the cover-level `min_age_next_birthday` and `max_age_next_birthday` use.
        Absent bounds mean unbounded: a basis with no `max_age_next_birthday` is offered to the top of the cover's own age range.
      type: object
      required:
        - basis
      additionalProperties: false
      properties:
        basis:
          $ref: '#/components/schemas/CommissionBasis'
        min_age_next_birthday:
          type: integer
          minimum: 0
          maximum: 100
        max_age_next_birthday:
          description: The oldest age next birthday at which this cover is written on this basis. Where an insurer offers upfront commission only below a given age and level commission at every age, that is two entries, one of them bounded here.
          type: integer
          minimum: 0
          maximum: 100
        max_dial_down_percent:
          description: |-
            The largest dial-down accepted on this basis. Absent means the insurer accepts any dial-down up to nil commission.
            A summary for an insurer that does not enumerate `options`. Where it does, this is derivable from them and may be omitted.
          $ref: '#/components/schemas/SharePercentage'
        options:
          description: |-
            The individual commission options this insurer writes on this basis — its own ladder, published so a consumer can stop guessing at it.
            ## What this is for, in two quite different ways
            **Rounding.** A dial-down is only writable at the steps the insurer publishes, and a request between two of them rounds down (see `CommissionRequest.dial_down_percent`). Reading the steps from here lets a consumer send a figure that needs no rounding at all, which is the difference between a premium an adviser can explain and one they have to be told about afterwards.
            **Exactness.** An option whose `dial_down_percent` is ABSENT cannot be expressed as a basis plus a share at all — an upfront rate with no initial payment, an upfront paid in the first year only, a level rate above the insurer's standard. Those are real published options, and the only way to ask for one is `insurer_commission_id`.
            ABSENT MEANS UNENUMERATED, not "no options". An insurer that publishes nothing here is not saying it has a single option; it is saying a consumer must use the portable form and be ready for a `substituted` dial-down. The same hint-not-contract rule governs this as the rest of the document.
            A LADDER IS SMALL. Every insurer examined publishes between five and fifteen options in total, which is why they sit in this document rather than behind an endpoint of their own the way occupations do — there, per-insurer lists run to a thousand rows and a consumer must search them.
          type: array
          maxItems: 40
          items:
            $ref: '#/components/schemas/InsurerCommissionOption'
      examples:
        - basis: upfront
          max_age_next_birthday: 61
        - basis: level
    CoverCapability:
      title: CoverCapability
      description: What one cover type supports. `supported_options` carries VALUE SETS rather than a list of field names, so an insurer can narrow an enum — three waiting periods out of seven — without the standard needing a new version.
      type: object
      required:
        - cover_type
      additionalProperties: false
      properties:
        cover_type:
          $ref: '#/components/schemas/CoverType'
        ownerships:
          type: array
          items:
            $ref: '#/components/schemas/Ownership'
        structures:
          type: array
          items:
            $ref: '#/components/schemas/Structure'
        can_be_standalone:
          type: boolean
          default: true
        can_extend:
          description: The cover types this cover may be written as an extension of, named with `linked_to`. An empty array means it is only available standalone.
          type: array
          items:
            $ref: '#/components/schemas/CoverType'
          default: []
        min_sum_insured:
          $ref: '#/components/schemas/NonNegativeMoney'
        max_sum_insured:
          $ref: '#/components/schemas/NonNegativeMoney'
        min_age_next_birthday:
          type: integer
          minimum: 0
          maximum: 100
        max_age_next_birthday:
          type: integer
          minimum: 0
          maximum: 100
        commission_bases:
          description: |-
            Which remuneration bases this insurer writes THIS cover on, and the age bounds on each.
            Declared per cover, and separately from `supported_options`, because the restriction it describes is neither policy-wide nor a flat value list: the upfront and hybrid bases are commonly withdrawn on a benefit above a certain age while remaining available on the rest of the same policy. Flattened into a list of permitted values that restriction is undeclarable, and a consumer only meets it as a benefit that will not price.
            ABSENT MEANS UNDECLARED, not "no commission bases". An insurer that has not populated this says nothing either way, and a consumer MUST fall back to the runtime paths rather than reading silence as a restriction — the same hint-not-contract rule that governs the rest of this document.
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/CommissionBasisCapability'
          examples:
            - - basis: upfront
                max_age_next_birthday: 61
              - basis: hybrid
                max_age_next_birthday: 61
              - basis: level
        supported_options:
          description: Permitted values per option field, keyed by the field name as it appears in the cover schema. An option field ABSENT from this map is not supported at all for this cover and MUST be reported as `unsupported_ignored` if sent.
          type: object
          additionalProperties:
            type: array
            items: {}
          examples:
            - waiting_period:
                - 30d
                - 60d
                - 90d
              benefit_period:
                - 2y
                - age_65
              tpd_definition:
                - own_occupation
                - any_occupation
                - prefer
            - waiting_period:
                - 4w
                - 8w
                - 13w
                - 26w
              benefit_period:
                - 2y
                - 5y
                - age_65
              tpd_definition:
                - own_occupation
                - any_occupation
        features:
          description: |-
            Named product features that may be required for this cover via `required_features`.
            DISTINCT FROM `supported_options`, and the distinction is the whole point. An option is something the consumer asks the insurer to APPLY, and the insurer answers it in `resolved_options`. A feature is something the consumer FILTERS on, and the insurer answers it by using only products that have it — or by declining the benefit. So the same underlying product capability may legitimately appear in both, and they are not interchangeable.
            `code` is the insurer's own and is scoped to this cover. `standard_feature` is the portable equivalent from `taxonomy/features.yaml` where one exists, and publishing it is what lets a consumer send ONE request to a whole panel instead of translating per insurer. Publish it wherever the mapping is honest; omit it where the insurer's benefit genuinely is not the standard one, because a wrong mapping here is worse than none — it produces a filter that silently selects the wrong products.
            Features with no `code`, only a `standard_feature`, are permitted: an insurer with no identifiers of its own can declare purely in the standard's terms.
            POLICY-LEVEL FEATURES DO NOT BELONG HERE. `guaranteed_renewable` describes the policy, not one benefit inside it; declare those in `policy_features` on the document rather than repeating them under every cover.
          type: array
          maxItems: 200
          items:
            type: object
            anyOf:
              - required:
                  - code
                  - name
              - required:
                  - standard_feature
            additionalProperties: false
            properties:
              code:
                description: The insurer's own identifier for this feature, scoped to this cover.
                type: string
                maxLength: 64
              standard_feature:
                description: The portable code from `taxonomy/features.yaml` this feature corresponds to, where it corresponds to one. It MUST be a code that file lists for this cover.
                type: string
                maxLength: 64
              name:
                description: The insurer's own wording, for display in a feature picker.
                type: string
                maxLength: 200
              description:
                type: string
                maxLength: 1000
          examples:
            - - code: TRM_TERM_ILL
                standard_feature: terminal_illness_benefit
                name: Terminal illness benefit
              - code: NEO_FUNERAL_ADV
                name: Funeral advancement
    Frequency:
      title: Frequency
      description: |-
        How often the premium is paid. A premium at a sub-annual frequency is NOT the annual premium divided by the number of periods: insurers apply a frequency loading, so `monthly x 12 >= annual`. Consumers MUST therefore read the frequency they need rather than deriving it.
        Not every insurer sells every frequency. A priced line carries `monthly` and `annual` always and the other four only where the insurer quotes them — see `PremiumSet`, which also says how an insurer declares the ones it does not. A frequency this enum can name is not thereby a frequency any given product can be billed at.
      type: string
      enum:
        - weekly
        - fortnightly
        - monthly
        - quarterly
        - half_yearly
        - annual
    Capabilities:
      title: Capabilities
      description: What this implementation supports. Cacheable — servers SHOULD send an `ETag` and a `Cache-Control` max-age of at least an hour, and consumers SHOULD revalidate rather than fetching on every quote.
      type: object
      required:
        - spec_version
        - insurer_id
        - brands
        - covers
      additionalProperties: false
      properties:
        spec_version:
          description: The version of this standard the implementation is built against, as a semver string. A consumer compares this against its own to decide which optional features to use.
          type: string
          pattern: ^\d+\.\d+\.\d+$
          examples:
            - 0.1.0
        insurer_id:
          $ref: '#/components/schemas/InsurerId'
        brands:
          description: The brands this endpoint can price. More than one is normal and is why `brand_id` is required on every line even from a single-insurer endpoint.
          type: array
          minItems: 1
          items:
            type: object
            required:
              - brand_id
              - name
            additionalProperties: false
            properties:
              brand_id:
                $ref: '#/components/schemas/BrandId'
              name:
                type: string
                maxLength: 120
        covers:
          description: One entry per cover type offered. A cover type absent from this array is not offered at all, and a request for it MUST be answered with 422 `unsupported-cover`.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CoverCapability'
        frequencies:
          description: |-
            Which payment frequencies this insurer quotes and bills at. `monthly` and `annual` are always among them, because `PremiumSet` requires both on every priced line.
            THIS NOW MATCHES THE RESPONSE, where an earlier version of this standard said it did not. `PremiumSet` used to require all six frequencies whatever an insurer actually sold, so this field described billing while the response described something else — and an insurer with no weekly product had to return a weekly premium anyway. The response now carries the frequencies the insurer quotes and names the rest in `PremiumSet.not_quoted`, so the two agree and this field is the pre-quote form of the same fact.
            Read it the way the rest of this document is read: a hint that lets a consumer build the frequency control before the first pricing call, not an authority. `PremiumSet` on the line is what actually governs, and a consumer MUST NOT derive a frequency it finds here but not there.
          type: array
          items:
            $ref: '#/components/schemas/Frequency'
        split_frequency_supported:
          description: Whether the superannuation and non-superannuation portions of one policy can be billed at different frequencies.
          type: boolean
          default: false
        occupation_resolution:
          description: Which forms of `OccupationRef` this implementation accepts. `insurer_occupation_id` MUST always be supported; the others are optional, and an implementation that supports none of the baseline forms requires consumers to resolve an occupation via `/occupations` first.
          type: array
          items:
            type: string
            enum:
              - insurer_occupation_id
              - osca
              - anzsco
          default:
            - insurer_occupation_id
        commission_resolution:
          description: |-
            Which forms of `CommissionRequest` this implementation accepts. `basis` MUST always be supported — it is the portable form and the one a consumer can send without reading anything first. `insurer_commission_id` is optional, and an implementation that accepts it MUST publish the ids in `commission_bases[].options` on the covers it writes: an id space a consumer cannot enumerate is one it cannot use.
            Declared for the same reason `occupation_resolution` is: a consumer sending a form the insurer does not take gets a 422 rather than a quote, and finding that out from the capability document is cheaper than finding it out from the pricing call.
          type: array
          items:
            type: string
            enum:
              - basis
              - insurer_commission_id
          default:
            - basis
        feature_resolution:
          description: |-
            Which forms of feature code this implementation accepts in `required_features`. `standard` MUST always be supported — it is the portable form, and the only one a consumer can send to a panel without first reading each insurer's own declarations.
            `insurer_code` is optional, and an implementation that accepts it MUST publish those codes in `features` on the covers it writes, and in `policy_features`: an identifier space a consumer cannot enumerate is one it cannot use.
            Declared for the same reason `occupation_resolution` and `commission_resolution` are — finding out from the capability document costs nothing, and finding out from a declined line costs a pricing call and an adviser's confusion.
          type: array
          items:
            type: string
            enum:
              - standard
              - insurer_code
          default:
            - standard
        policy_features:
          description: |-
            Features that describe the POLICY rather than one benefit within it, requestable under the `policy` key of `required_features`.
            Separate from `covers[].features` because these are not cover-scoped: a policy either is guaranteed renewable or it is not, and declaring it under each of seven covers would make one fact seven filters that must all be ticked together. A policy-level fact is declared once.
          type: array
          maxItems: 100
          items:
            type: object
            anyOf:
              - required:
                  - code
                  - name
              - required:
                  - standard_feature
            additionalProperties: false
            properties:
              code:
                type: string
                maxLength: 64
              standard_feature:
                description: The portable code from `taxonomy/features.yaml`, which MUST be one listed under `policy` in that file.
                type: string
                maxLength: 64
              name:
                type: string
                maxLength: 200
              description:
                type: string
                maxLength: 1000
          examples:
            - - code: GTD_RENEW
                standard_feature: guaranteed_renewable
                name: Guaranteed renewable
        occupation_qualifiers_used:
          description: Which `OccupationQualifiers` fields actually affect this insurer's rating. Lets a consumer avoid collecting facts that will not change the answer.
          type: array
          items:
            type: string
        max_income_replacement_percent:
          description: |-
            The largest share of the insured's income this insurer will replace across all income-based covers combined, as a percentage. Commonly 70.
            Declared so a consumer can keep an adviser inside what is actually issuable while they are still typing, rather than discovering it as a declined line after a pricing call. It is a CEILING, not a promise: the amount finally offered also depends on occupation, product and underwriting, so a request within this figure may still be declined.
            Distinct from the absolute bound the standard places on everyone. A benefit above 100% of income is impossible at every insurer and is a 422; a benefit between this figure and 100% is a decline here and may be priced by another insurer.
            A CEILING IS TESTED AGAINST THE UNROUNDED FIGURE, on both sides. A consumer converting this percentage into a monthly dollar amount MUST round DOWN, and a server MUST compare on exact decimal arithmetic rather than rounding the request up first. `income x percent / 12` rarely divides evenly, so half-up rounding lands cents over the cap and the benefit is declined for a rounding artefact — the insurer simply goes missing from the panel. See rule 1 on `QuoteRequest`.
          $ref: '#/components/schemas/Percentage'
        features:
          description: Optional parts of the standard this implementation provides.
          type: object
          additionalProperties: false
          properties:
            loadings_percentage:
              type: boolean
              default: false
            loadings_rate_per_thousand:
              type: boolean
              default: false
            campaigns:
              type: boolean
              default: false
            medical_requirements:
              type: boolean
              default: false
            inclusions:
              type: boolean
              default: false
            idempotency:
              type: boolean
              default: false
            quote_retrieval:
              description: Whether `GET /quotes/{quote_id}` is implemented.
              type: boolean
              default: false
            line_diagnostics:
              description: Whether the per-line unmet-needs diagnostic endpoint is implemented.
              type: boolean
              default: false
            projections:
              description: Whether `projection` on the request is honoured. An implementation declaring `false` that is asked anyway MUST still price the quote — see `ProjectionRequest`.
              type: boolean
              default: false
            projection_indexation:
              description: Whether a projection can grow sums insured. Separate from `projections` because projecting today's cover forward is materially easier than indexing it, and an insurer that can do the first is not thereby claiming the second.
              type: boolean
              default: false
            required_features:
              description: Whether `required_features` is honoured. An implementation declaring `false` MUST reject a request carrying one with 422 rather than pricing it unfiltered — a filter silently not applied returns products the adviser expressly excluded.
              type: boolean
              default: false
            research_scores:
              description: Whether lines carry third-party research ratings.
              type: boolean
              default: false
            documents:
              description: Whether lines carry documents or application links.
              type: boolean
              default: false
        campaigns:
          description: Campaign variants that can be named in `campaign_codes`.
          type: array
          items:
            type: object
            required:
              - code
              - name
            additionalProperties: false
            properties:
              code:
                type: string
                maxLength: 64
              name:
                type: string
                maxLength: 200
              description:
                type: string
                maxLength: 1000
              requires_authorisation:
                description: Whether this campaign is only available to consumers specifically authorised for it. An unauthorised request for it is a 403, not a silently standard-rated line.
                type: boolean
                default: false
        limits:
          type: object
          additionalProperties: false
          properties:
            max_covers_per_request:
              type: integer
              minimum: 1
            max_concurrent_requests:
              type: integer
              minimum: 1
            target_p95_latency_ms:
              description: The latency the insurer expects to meet at `max_concurrent_requests`. Consumers of several insurers at once fan out in parallel and are bounded by the slowest, so this figure determines whether a consumer must apply a shorter timeout than its own overall budget.
              type: integer
              minimum: 1
    Cursor:
      title: Cursor
      description: Opaque continuation token. Consumers MUST treat it as opaque, MUST NOT construct one, and MUST NOT assume it remains valid indefinitely — a server MAY expire cursors and answer an expired one with 400 `invalid-request`.
      type: string
      minLength: 1
      maxLength: 512
    InsurerOccupation:
      title: InsurerOccupation
      description: One row of the insurer's occupation list, carrying the rating matrix so a consumer can show what a change of occupation would do before re-pricing.
      type: object
      required:
        - insurer_occupation_id
        - description
        - ratings
      additionalProperties: false
      properties:
        insurer_occupation_id:
          type: string
          minLength: 1
          maxLength: 128
        description:
          description: The insurer's own wording, shown to the adviser verbatim.
          type: string
          maxLength: 200
        ratings:
          $ref: '#/components/schemas/OccupationRatings'
        osca:
          description: The baseline code this row corresponds to, where the insurer maintains the correspondence. Publishing it is what allows a consumer to pre-resolve occupations in bulk rather than calling `:match` per quote.
          type: string
          pattern: ^\d{4}-?\d{2}$
        requires_employment_status:
          description: An employment status this occupation implies, where one is mandatory. A non-working occupation paired with a working status is the commonest cause of a nil premium, so an insurer that constrains this SHOULD say so here.
          $ref: '#/components/schemas/EmploymentStatus'
        effective_from:
          type: string
          format: date
        effective_to:
          description: Absent while the row is current. A past date means the row is closed to new business.
          type: string
          format: date
    PageInfo:
      title: PageInfo
      description: Continuation state for a paged collection. Absence of `next_cursor` is the ONLY reliable signal that a walk is complete — consumers MUST NOT infer completion from a short page, because a server may return fewer items than requested for its own reasons.
      type: object
      additionalProperties: false
      properties:
        next_cursor:
          $ref: '#/components/schemas/Cursor'
    OccupationListResponse:
      title: OccupationListResponse
      type: object
      required:
        - occupations
      additionalProperties: false
      properties:
        occupations:
          type: array
          items:
            $ref: '#/components/schemas/InsurerOccupation'
        page:
          $ref: '#/components/schemas/PageInfo'
    OccupationMatchRequest:
      title: OccupationMatchRequest
      description: Ask the insurer which of its own occupations corresponds to a baseline reference.
      type: object
      required:
        - occupation
      additionalProperties: false
      properties:
        occupation:
          $ref: '#/components/schemas/OccupationRef'
        annual_income:
          description: |-
            The insured's gross annual income, where the insurer bands occupations on earnings.
            Matters more here than on the list operation: `:match` returns RANKED CANDIDATES, and without an income an insurer banding on earnings cannot rank them — "Accountant earning under $120,000" and "Accountant earning over $120,000" are equally good matches for "Accountant", and whichever the insurer picks it may be the wrong one at a plausible premium.
            OPTIONAL. A server that does not band on income MUST ignore it rather than reject it.
          $ref: '#/components/schemas/NonNegativeMoney'
        max_candidates:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
    OccupationCandidate:
      title: OccupationCandidate
      description: |-
        One candidate match — an insurer occupation plus how confident the insurer is that it corresponds to the reference it was given.
        Declared standalone rather than as `allOf: [InsurerOccupation, {match_confidence}]`, which is what it was in 0.1.0 and which was UNSATISFIABLE: `InsurerOccupation` closes itself with `additionalProperties: false`, and that keyword only sees its own `properties` — so it forbade the very fields the second branch required. No object could satisfy both, and the only conformant response was an empty `candidates` array, which this contract defines as "no matching occupation, treat the insurer as unquotable". The endpoint that bridges the shared baseline to each insurer's manual was therefore impossible to implement, and `redocly lint` reported the document valid.
        The lesson generalises: `additionalProperties: false` composed under `allOf` is nearly always a bug. Where composition is genuinely wanted, use `unevaluatedProperties: false` on the composed schema — as `covers.yaml` does correctly.
      type: object
      required:
        - insurer_occupation_id
        - description
        - ratings
        - match_confidence
      additionalProperties: false
      properties:
        insurer_occupation_id:
          type: string
          minLength: 1
          maxLength: 128
        description:
          description: The insurer's own wording, shown to the adviser verbatim.
          type: string
          maxLength: 200
        ratings:
          $ref: '#/components/schemas/OccupationRatings'
        osca:
          description: The baseline code this row corresponds to, where the insurer maintains it.
          type: string
          pattern: ^\d{4}-?\d{2}$
        requires_employment_status:
          $ref: '#/components/schemas/EmploymentStatus'
        effective_from:
          type: string
          format: date
        effective_to:
          type: string
          format: date
        match_confidence:
          description: How confident the insurer is. `exact` means a maintained one-to-one correspondence to the baseline. A consumer SHOULD ask the adviser to confirm anything below `exact` rather than pricing straight through.
          type: string
          enum:
            - exact
            - high
            - moderate
            - low
        match_detail:
          description: 'Why this candidate was proposed, and which qualifiers drove it. Worth populating: it is what lets an adviser choose between two plausible rows.'
          type: string
          maxLength: 300
    OccupationMatchResponse:
      title: OccupationMatchResponse
      description: |-
        Candidate matches, most confident first.
        An EMPTY `candidates` array is a valid and important answer: it means the insurer has no occupation corresponding to the reference given. A consumer MUST treat that as unquotable for this insurer and MUST NOT fall back to a nearby occupation of its own choosing — a wrong occupation produces a wrong premium that looks entirely normal, which is worse than a visible gap.
      type: object
      required:
        - candidates
      additionalProperties: false
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/OccupationCandidate'
  headers:
    XRequestId:
      description: |-
        Correlation identifier, echoed from the request or generated by the server when the request did not carry one. REQUIRED on every response, including errors.
        This is not ceremony. A consumer of several insurers investigating "the premium was wrong last Tuesday" has to be able to hand one token to one insurer's support desk; without it, the only shared identifier is a timestamp.
      required: true
      schema:
        type: string
        maxLength: 128
      example: 01JQ8Z9YB4T7M2XR5K3P
    SpecVersion:
      description: The version of this standard the response was produced against. Lets a consumer detect an implementation that has moved without announcement.
      schema:
        type: string
        pattern: ^\d+\.\d+\.\d+$
      example: 0.1.0
  responses:
    BadRequest:
      description: The request could not be parsed, or a value was structurally invalid. Problem type `invalid-request`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    Unauthorized:
      description: No access token was presented, or it was malformed or expired. Problem type `unauthenticated`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        WWW-Authenticate:
          description: RFC 6750 challenge.
          schema:
            type: string
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    Forbidden:
      description: The token is valid but lacks the scope required for this operation, or names a campaign the consumer is not authorised for. Problem type `forbidden`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    Conflict:
      description: An `Idempotency-Key` was reused with a different request body. Problem type `idempotency-conflict`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    UnprocessableEntity:
      description: |-
        The request was well formed but cannot be priced as asked — an unsupported cover, an unsupported option value, or a combination the product does not permit. Problem types `unsupported-cover`, `unsupported-value`, `invalid-combination`, `incomplete-request`.
        NOTE the boundary: this status is for a request the insurer will not accept. An insurer that accepts the request but cannot assemble the covers returns 200 with the line flagged `all_needs_met: false`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    TooManyRequests:
      description: Rate limit exceeded. Problem type `rate-limited`. `Retry-After` is REQUIRED — without it a consumer fanning out across several insurers has no basis for a backoff and will retry into the limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          required: true
          schema:
            type: integer
            minimum: 0
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    InternalError:
      description: Unexpected failure. Problem type `internal-error`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    ServiceUnavailable:
      description: A dependency of the pricing engine is unavailable. Problem type `upstream-unavailable`. Distinguished from `internal-error` so a consumer can retry this and not that.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
