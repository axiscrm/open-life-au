# Open Life Data Standards (AU) — Policy — an in-force policy.
#
# The shape follows what an adviser needs to service a book: who is covered, what they hold, what it
# costs, who wrote it, and whether it is in trouble. It is structured rather than flat — a policy has
# many benefits, and flattening one row per benefit (as spreadsheet exports do) forces every consumer
# to regroup by policy number and guess which columns are policy-level and which are benefit-level.

$schema: https://json-schema.org/draft/2020-12/schema

Policy:
  title: Policy
  description: One policy as the insurer holds it, with all of its benefits.
  type: object
  required: [policy_id, insurer_id, status, policy_holder, covers]
  additionalProperties: false
  # One representation for arrears, not two. Without this an insurer could report a behind-on-premium
  # policy as `in_force` with a populated `arrears` block — defensible, since the policy is still on
  # risk — and a consumer building its worklist from `?status=in_arrears` would get zero rows while
  # policies sailed past `expected_lapse_on`. Silent: no error, no absence, just an empty worklist.
  dependentSchemas:
    arrears:
      properties:
        status:
          const: in_arrears
    # A reason for ending on a policy that has not ended is a contradiction, and the likelier cause is
    # an implementation that copied a cover's exit reason onto its parent policy.
    exit_reason:
      properties:
        status:
          not:
            enum: [in_force, in_arrears, pending]
  properties:
    policy_id:
      description: >-
        The key a consumer reconciles on, so an insurer that renumbers a policy MUST surface the
        prior number in `previous_policy_id`. Normalisation rules on the shared schema.
      $ref: '../../../../core/schemas/identifiers.yaml#/PolicyNumber'
    policy_version:
      $ref: '#/PolicyVersion'
    previous_policy_id:
      description: Prior number, where a policy has been renumbered or replaced.
      type: string
      maxLength: 64
    insurer_id:
      $ref: '../../../../core/schemas/identifiers.yaml#/InsurerId'
    brand_id:
      $ref: '../../../../core/schemas/identifiers.yaml#/BrandId'
    product_name:
      $ref: '../../../../core/schemas/identifiers.yaml#/ProductName'

    status:
      $ref: '#/PolicyStatusResponse'
    status_detail:
      description: The insurer's own wording for the status, where it carries more than the enum does.
      type: string
      maxLength: 200
    exit_reason:
      description: >-
        Why the policy ended, on a policy whose status is terminal. MUST NOT be sent on a policy that
        is still in force, in arrears or pending, and the schema rejects it there.

        Separate from `status` because the two answer different questions, and folding the reason
        into the status is what several insurer systems do today — an ended policy whose status
        reads as the claim that ended it. `status` stays the lifecycle state a consumer's absence
        rule and worklists depend on; this says why, so that a book can be filtered and reported on
        by it. `status_detail` keeps the insurer's own wording alongside.
      $ref: '#/ExitReason'

    policy_holder:
      $ref: 'policy-holder.yaml#/PolicyHolder'
    parties:
      description: >-
        Every person or entity the insurer records against the policy, one entry per role.
        Optional, and declared in `capabilities.fields.parties`.

        Needed because the people on a policy are routinely different people — a life insured, an
        owner, a payer, one or more beneficiaries — and name plus date of birth is how a consumer
        matches a policy to a client. A consumer that takes the life insured to be the owner matches
        the wrong person on every such policy, and nothing about the match looks wrong. Where this
        array is present, a consumer matching a client record MUST choose the party by role rather
        than assuming `policy_holder`.

        `policy_holder` is unchanged and remains the life insured, so a consumer that reads only it
        keeps working. Where both are present, a `life_insured` entry here MUST describe the same
        person as `policy_holder`. A policy covering more than one life carries one `life_insured`
        entry per life, and `policy_holder` is the principal one.
      type: array
      minItems: 1
      items:
        $ref: 'policy-holder.yaml#/PolicyParty'
    beneficiaries:
      description: >-
        The death-benefit nominations recorded on the policy. Optional, and declared in
        `capabilities.fields.beneficiaries`, because "no nomination" and "this insurer does not
        report nominations" otherwise look identical — and the first sends a claim to the estate
        while the second says nothing at all.

        Each nomination names its beneficiary by `party_id`, pointing at a `beneficiary` entry in
        `parties`. The shares of the nominations in force SHOULD sum to 100; JSON Schema cannot
        compare members of an array, so this is stated rather than enforced.
      type: array
      minItems: 1
      items:
        $ref: '#/BeneficiaryNomination'
    ownership:
      $ref: '#/PolicyOwnership'
    distribution:
      $ref: '../../../../core/schemas/distribution.yaml#/Distribution'
    dates:
      $ref: '#/PolicyDates'
    premium:
      $ref: '#/PolicyPremium'

    covers:
      description: >-
        The benefits held under this policy. At least one — a policy with no benefits is not a
        policy. Where a benefit maps onto the shared cover vocabulary the insurer SHOULD populate
        `cover_type`; `benefit_name` always carries its own product wording.
      type: array
      minItems: 1
      items:
        $ref: '#/PolicyCover'

    arrears:
      description: >-
        The outstanding premium failures on this policy, most recent first. Present only when the
        policy is behind; absence means paid up to `dates.paid_to`, and an empty array MUST NOT be sent
        in place of absence.

        An ARRAY, because a monthly policy can dishonour in January and again in February with both
        still outstanding. A single object forced insurers to choose which one to report, and they
        chose differently: reporting the oldest meant a consumer saw the same event across four
        snapshots and never re-alerted even as exposure doubled; reporting the latest meant a brand-new
        event every month and a task reopened that had already been worked. Neither was wrong under the
        contract, which is the problem.
      type: array
      minItems: 1
      items:
        $ref: '#/Arrears'

    options:
      description: >-
        Options elected at the POLICY level and in force — premium waiver on disability, a premium
        freeze, benefit indexation offered across the policy. Options that attach to one benefit are
        on that benefit's `options` instead; the split follows the `policy` and `covers` levels of
        `taxonomy/product-features.yaml`, so an option has one vocabulary from quote to in-force.

        Only what is in force. An option the product offers and the owner did not elect is absent,
        and absence is only meaningful where `capabilities.fields.options` is `true`.
      type: array
      minItems: 1
      items:
        $ref: '#/PolicyOption'
    premium_transactions:
      description: >-
        Recent premium activity on the policy, most recent first: what fell due, what was collected,
        what dishonoured and what was refunded. Optional, declared in
        `capabilities.fields.premium_transactions`.

        A HISTORY, NOT A LEDGER. How far back it reaches is the implementation's choice, so a consumer
        MUST NOT read the absence of an older transaction as evidence it never happened. And it does
        not replace `arrears`: what is outstanding is stated there, and a consumer MUST NOT derive
        arrears by netting these entries, which double-counts a fee the insurer has folded into an
        outstanding amount and misses a retry the ledger has not yet posted.
      type: array
      minItems: 1
      items:
        $ref: '#/PremiumTransaction'

    loadings:
      description: >-
        Underwriting loadings applied at issue, in the insurer's own wording. Where the insurer also
        reports loadings per benefit, those are on `covers[].loadings` and are the structured form;
        this stays the verbatim text.
      type: string
      maxLength: 2000
    exclusions:
      description: >-
        Policy exclusions, in the insurer's own wording. Per-benefit exclusions, where reported, are
        on `covers[].exclusions`.
      type: string
      maxLength: 2000

ExitReason:
  title: ExitReason
  description: >-
    Why a policy or a benefit ended. RESPONSE-facing and extensible: a consumer MUST pass an
    unrecognised value through rather than failing the page.

    Known values:
      - `non_payment`              premiums were not paid and the cover lapsed
      - `owner_request`            the owner asked for it to be cancelled
      - `replaced`                 replaced by another policy or benefit, with this insurer or another
      - `claim_death`              a death or terminal illness claim was paid
      - `claim_tpd`                a total and permanent disability claim was paid
      - `claim_trauma`             a trauma or critical illness claim was paid
      - `claim_income_protection`  an income-style benefit ended with a claim, such as the benefit
                                   period running out while on claim
      - `expiry`                   the benefit reached its expiry date or age
      - `other`                    read `status_detail`

    `claim_*` means the claim ENDED the cover. A partial payment that leaves the benefit in force is
    not an exit, and a benefit reduced by a claim on another cover it is linked to ends only when its
    sum insured reaches nil.
  type: string
  x-extensible-enum:
    - non_payment
    - owner_request
    - replaced
    - claim_death
    - claim_tpd
    - claim_trauma
    - claim_income_protection
    - expiry
    - other

PolicyVersion:
  title: PolicyVersion
  description: >-
    A per-policy version that increases on every change the insurer records. Optional on a snapshot but
    strongly RECOMMENDED, and REQUIRED on every webhook.

    It is what makes ordering decidable. `generated_at` is snapshot-wide, so it cannot say whether a
    particular row already reflects a change an event is reporting; and `occurred_at` is not guaranteed
    monotonic and offers no tiebreak for equal timestamps. With a version, a consumer applies an event
    only when it exceeds the version already held for that policy, and can tell whether the snapshot in
    hand is newer than an event that arrived after it.

    Monotonic per policy. It carries no meaning across policies and MUST NOT be compared between them.
  type: integer
  minimum: 1

PolicyStatusResponse:
  title: PolicyStatusResponse
  description: >-
    RESPONSE-facing policy status. Extensible: an insurer may report a state this version does not name
    — a premium holiday or waiver in effect is a real one — and a consumer MUST pass it through rather
    than failing the page, which would abort the walk and reconcile nothing that night.

    Known values: [in_force, in_arrears, pending, lapsed, cancelled, terminated].
  type: string
  x-extensible-enum: [in_force, in_arrears, pending, lapsed, cancelled, terminated]

PolicyStatus:
  title: PolicyStatus
  description: >-
    The policy's state. A snapshot contains in-force business by default; the terminal states appear
    only where an insurer chooses to report recent history, and a consumer MUST NOT treat their
    presence as a promise that all historical policies are included.
      - `in_force`   current and paid to date
      - `in_arrears` current but behind on premium — still on risk, see `arrears`
      - `pending`    accepted but not yet commenced
      - `lapsed`     ended for non-payment
      - `cancelled`  ended at the owner's request
      - `terminated` ended for any other reason, including claim or expiry
  type: string
  enum: [in_force, in_arrears, pending, lapsed, cancelled, terminated]

PolicyOwnership:
  title: PolicyOwnership
  type: object
  additionalProperties: false
  properties:
    ownership_type:
      $ref: '../../../../core/schemas/cover-vocabulary.yaml#/OwnershipResponse'
    owner_name:
      description: >-
        The legal owner where it is not the life insured — a superannuation trustee, an SMSF, a
        company, or another individual.

        Send it as the entity is legally named, and do not case-normalise it. These are mostly
        entity names rather than personal ones, so a consumer applying title case to them produces
        "Abc Super Fund Pty Ltd" and "Smith Smsf" — and a consumer receiving one MUST NOT re-case it
        either.
      type: string
      maxLength: 255
    owner_type:
      $ref: '#/OwnerType'

OwnerType:
  title: OwnerType
  description: >-
    What KIND of person or entity owns the policy. RESPONSE-facing and extensible: a consumer MUST
    pass an unrecognised value through rather than failing.

    Distinct from `ownership_type`, which is the TAX structure the cover is held under and says
    nothing about who the owner is. A policy held outside super can be owned by an individual or by a
    company, and the difference decides who may be nominated as a beneficiary, who signs an
    alteration, and who is paid on a claim. Folding it into `ownership_type` would have made a
    company-owned ordinary policy a new tax structure, which it is not.
      - `individual`     a natural person
      - `company`        a company, including a business owning cover on a key person
      - `trust`          the trustee of a trust other than a superannuation fund
      - `super_trustee`  the trustee of a retail or industry superannuation fund
      - `smsf_trustee`   the trustee of a self-managed superannuation fund
  type: string
  x-extensible-enum: [individual, company, trust, super_trustee, smsf_trustee]

PolicyDates:
  title: PolicyDates
  description: All RFC 3339 full-dates. Every field optional — insurer records vary in what they keep.
  type: object
  additionalProperties: false
  properties:
    commenced_on:
      description: Risk commencement date.
      type: string
      format: date
    renewal_on:
      description: Next policy anniversary.
      type: string
      format: date
    paid_to:
      description: >-
        The date premiums are paid up to. Together with `arrears`, this is how a consumer tells a
        healthy policy from one heading for lapse.
      type: string
      format: date
    next_billing_on:
      type: string
      format: date
    expires_on:
      description: Scheduled expiry, for benefits with a fixed term or expiry age.
      type: string
      format: date
    terminated_on:
      description: Date the policy actually ended. Present on the terminal statuses.
      type: string
      format: date
    duration_years:
      description: Completed years in force. Convenience only — derivable from `commenced_on`.
      type: integer
      minimum: 0

PolicyPremium:
  title: PolicyPremium
  description: >-
    What the policy costs as currently billed. Unlike a quote, this is a single frequency — the one
    the policy is actually paid at — because a policy has one billing arrangement, not six.
    `annualised` is supplied rather than derived, for the same reason quoting returns all six
    frequencies: frequency loadings mean the annual figure is not the billed amount times the number
    of periods.
  type: object
  required: [amount, frequency]
  additionalProperties: false
  properties:
    amount:
      description: The amount billed each period.
      $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
    frequency:
      $ref: '../../../../core/schemas/cover-vocabulary.yaml#/Frequency'
    annualised:
      description: The annual cost. Read, not derived.
      $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
    structure:
      $ref: '../../../../core/schemas/cover-vocabulary.yaml#/StructureResponse'
    stamp_duty:
      description: Stamp duty component, already included in `amount`.
      $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
    policy_fee:
      description: Policy or administration fee, already included in `amount`.
      $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
    payment_method:
      $ref: '#/PaymentMethod'
    payment_method_detail:
      description: >-
        The insurer's own wording for the payment arrangement, where it carries more than the enum
        does — a masked account or card tail, the name of the paying super fund, an employer scheme.
        MUST NOT carry a full account number, card number or any other unmasked credential.
      type: string
      maxLength: 100
    super_fund:
      $ref: '#/SuperFund'
    discounts:
      description: >-
        Discounts applied across the policy's premium. `amount` is already net of them. Discounts on
        one benefit only are on that benefit's `discounts`.
      type: array
      minItems: 1
      items:
        $ref: '#/PremiumDiscount'

SuperFund:
  title: SuperFund
  description: >-
    The superannuation fund a policy's premium is paid from, where it is paid by rollover or held in
    super. Carried because a rollover dishonour is resolved with the fund rather than the client —
    often by someone the adviser has never spoken to — and the follow-up starts by identifying which
    fund, under which member account.

    Declared in `capabilities.fields.super_fund`.
  type: object
  additionalProperties: false
  properties:
    fund_name:
      type: string
      maxLength: 200
    usi:
      description: >-
        The fund's Unique Superannuation Identifier, as published on the register of funds. The
        identifier a rollover is actually addressed to, so it is worth more than the name.
      type: string
      maxLength: 20
    abn:
      description: The fund's Australian Business Number, eleven digits with no spaces.
      type: string
      pattern: '^\d{11}$'
    member_number:
      description: >-
        The member's account number at the fund, MASKED: asterisks, then at most the last four
        characters in clear — `****4471`. The schema rejects anything else.

        Masked for the reason `payment_method_detail` is. Four characters is enough to confirm the
        right account with the fund, and a full member number is a credential for the member's
        retirement savings, travelling to every consumer of this contract.
      type: string
      pattern: '^\*+[A-Za-z0-9]{1,4}$'
      maxLength: 24

PaymentMethod:
  title: PaymentMethod
  description: >-
    How the premium is collected. RESPONSE-facing and extensible: a consumer MUST pass an
    unrecognised value through rather than failing.

    Carried because it changes what an adviser does when a payment fails, which is the whole point
    of the `arrears` block. An expired card is a two-minute call to the client; a rejected
    superannuation rollover is a conversation with the fund and often a different person entirely;
    a failed employer deduction may not be the client's doing at all. Without this the follow-up on
    every dishonour starts by finding out how the policy was being paid.

    Known values:
      - `direct_debit`             debited from a bank account
      - `credit_card`              charged to a credit or debit card
      - `bpay`                     client-initiated BPAY
      - `direct_credit`            client-initiated transfer or deposit
      - `cheque`
      - `superannuation_rollover`  paid by rollover from a retail fund or SMSF
      - `employer_deduction`       deducted from salary by an employer
  type: string
  x-extensible-enum:
    - direct_debit
    - credit_card
    - bpay
    - direct_credit
    - cheque
    - superannuation_rollover
    - employer_deduction

PolicyCover:
  title: PolicyCover
  description: One benefit held under the policy.
  type: object
  # `sum_insured` is NOT required, which will read as a mistake to anyone who has worked with this
  # data — it is the first thing an adviser looks at. It was required in 0.1.0, and that made an
  # entire live book unrepresentable: one insurer's in-force extract (~5,242 policies) carries no
  # sum-insured column at all, for any benefit, and no amount of implementation effort produces one.
  #
  # Required, the contract offered that insurer two choices: don't implement, or invent a number.
  # Optional plus `capabilities.fields.benefit_sum_insured`, it offers a third that is honest — report the
  # book, declare the gap, and let a consumer decide what to do about it. That is the same trade the
  # rest of this contract makes, and the alternative is a standard whose conformance bar is set just
  # above what part of the market can actually supply.
  required: [benefit_name]
  additionalProperties: false
  properties:
    cover_id:
      description: >-
        The insurer's own stable identifier for this benefit, unchanged for its life. Optional but
        strongly RECOMMENDED, and it is the key a consumer uses to track a benefit between snapshots.

        Without it the only handle is `(benefit_name, cover_type)`, which is not unique: an older book
        routinely holds two "Income Protection" benefits on one policy — an indemnity base plus an
        agreed-value top-up, or a legacy rider alongside the original. After indexation moves one of
        them, a consumer matching on name alone sees either "no change" or "one benefit deleted, one
        added", and fires a reduction-in-cover alert on a policy that grew. The flat one-row-per-benefit
        exports this contract replaces had per-benefit continuity; a structured shape has to restore it
        deliberately.

        WHERE THE INSURER HAS NO STABLE IDENTIFIER, an implementation MAY send a positional key
        instead: the benefit's name and its ordinal among the policy's benefits of that name, as
        `<benefit_name>#<ordinal>` counting from 1 — `Life Cover#1`, `Life Cover#2`. It MUST be derived
        deterministically from the insurer's data, so that an unchanged policy produces the same key
        every night, and MUST fit the length limit below. Where a benefit name is too long to fit,
        truncate the name, never the ordinal.

        A positional key is better than nothing and worse than an identifier: it survives indexation,
        but a benefit added or removed ahead of another renumbers it. So an implementation sending one
        MUST declare `capabilities.fields.cover_id_stable: false`, and a consumer reading that MUST
        NOT raise a reduction-in-cover alert on a cover_id change alone.

        MUST be unique within `covers`. `linked_to_cover_id` on another benefit refers to it.
      type: string
      maxLength: 64
    benefit_name:
      description: The insurer's own name for the benefit, verbatim.
      type: string
      minLength: 1
      maxLength: 200
    cover_type:
      description: >-
        The benefit mapped onto the shared cover vocabulary, where one applies. Populating this is
        what lets a consumer compare an in-force book against new quotes without maintaining a
        per-insurer benefit-name lookup. Omit rather than guess — an absent `cover_type` with a
        populated `benefit_name` is an honest answer.
      $ref: '../../../../core/schemas/cover-vocabulary.yaml#/CoverTypeResponse'
    sum_insured:
      description: >-
        Current sum insured, after any indexation. For monthly-benefit covers this is the monthly
        amount, not the annualised one.

        Optional only because one live book genuinely has no such column — see the note on
        `required` above. An implementation that holds the value MUST populate it, and an
        implementation that does not MUST say so in `capabilities.fields.benefit_sum_insured`, because an
        omitted amount and an unreported one look identical and mean completely different things.
      $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
    premium:
      description: This benefit's share of the policy premium, at the policy's billing frequency.
      $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
    status:
      $ref: '#/PolicyStatusResponse'
    ownership:
      description: Where a single policy holds benefits under different ownership.
      $ref: '../../../../core/schemas/cover-vocabulary.yaml#/OwnershipResponse'
    structure:
      $ref: '../../../../core/schemas/cover-vocabulary.yaml#/StructureResponse'
    waiting_period:
      description: >-
        For income-style benefits, in the insurer's own notation. Free text rather than the quoting
        contract's enum: this is a historical record of what was written, which may predate the
        product range currently sold.
      type: string
      maxLength: 50
    benefit_period:
      type: string
      maxLength: 50
    commenced_on:
      description: Where a benefit was added after the policy commenced.
      type: string
      format: date
    expires_on:
      type: string
      format: date

    exit_reason:
      description: >-
        Why this benefit ended, where it ended and the policy continues — a trauma benefit paid out
        on a policy whose life cover remains, for instance. Only on a benefit whose `status` is
        terminal, and the schema rejects it otherwise. Same vocabulary as `Policy.exit_reason`.
      $ref: '#/ExitReason'
    states:
      description: >-
        Conditions that hold ON TOP of `status`, while the benefit is in force: on claim, premiums
        waived, frozen or suspended. Several can hold at once — a benefit on claim commonly has its
        premium waived as well.

        Separate from `status` because none of these ends the benefit, and folding them in would
        take an on-claim benefit out of every `in_force` count. They matter because each changes what
        an adviser does: a consumer MUST NOT treat the premium of a benefit that is on claim or has its
        premium waived as a premium to chase, and one that did would ring a client mid-claim about a
        payment they do not owe.

        Absence means none of these applies, and only where `capabilities.fields.cover_states` is
        `true`. An empty array MUST NOT be sent in place of absence.
      type: array
      minItems: 1
      uniqueItems: true
      items:
        $ref: '#/CoverState'
    state_detail:
      description: >-
        The insurer's own wording for the states above, where it carries more than the enum does —
        the days of a suspension remaining, the claim a waiver relates to.
      type: string
      maxLength: 200

    life_party_id:
      description: >-
        Which life this benefit is on, as the `party_id` of a `life_insured` entry in the policy's
        `parties`. Absent means the benefit is on `policy_holder`.

        One policy can insure two people, with each benefit on one of them, and without this a
        consumer attributes every benefit to the principal life — the wrong person's cover on the
        wrong person's record, discovered at claim.
      type: string
      maxLength: 64

    linked_to_cover_id:
      description: >-
        The `cover_id` of the benefit this one is linked to. On the same policy unless
        `linked_to_policy_id` says otherwise. MUST NOT be self-referential, and the links on a
        policy MUST be acyclic.

        Without it a consumer double-counts. A TPD benefit held as an extension of a life benefit is
        not additional cover: paying one reduces the other, so a consumer summing the two sums insured
        overstates the client's cover by the whole TPD amount. A consumer totalling cover MUST NOT
        add an `extension` benefit's sum insured to its parent's.
      type: string
      maxLength: 64
    linked_to_policy_id:
      description: >-
        The policy the linked benefit is on, where it is not this policy — the two halves of a
        split superannuation structure are commonly separate policies. May be sent without
        `linked_to_cover_id` where the insurer records the related policy and not the benefit.
      type: string
      maxLength: 64
    link_type:
      $ref: '#/CoverLinkType'

    options:
      description: >-
        Options elected on THIS benefit and in force — a buy-back, an increasing claim benefit, a
        reinstatement option. Policy-wide options are on `Policy.options`. Only what is in force; an
        option offered and not elected is absent, and absence is only meaningful where
        `capabilities.fields.options` is `true`.
      type: array
      minItems: 1
      items:
        $ref: '#/CoverOption'
    indexation:
      $ref: '#/IndexationState'

    tpd_definition:
      description: >-
        For a TPD benefit, the disability test it was written on. Decides whether a claim succeeds at
        all, so it is not a detail: the same injury can qualify under an own-occupation test and fail
        an any-occupation one.
      $ref: '../../../../core/schemas/cover-vocabulary.yaml#/TpdDefinitionResponse'
    income_protection_basis:
      description: >-
        For an income-style benefit, whether it pays an agreed value or is assessed on income at
        claim. Decides what a claim pays, which can be materially less than the `sum_insured` shown
        on an indemnity benefit.
      $ref: '../../../../core/schemas/cover-vocabulary.yaml#/IncomeProtectionBasis'

    loadings:
      description: >-
        Underwriting loadings on this benefit, one entry per basis. Structured where the insurer
        holds them structured; `Policy.loadings` keeps the verbatim policy-level text.

        An implementation SHOULD NOT send an entry whose axes are all zero: the loadings reported in
        this market are sparse, and a zero on every benefit buries the few that matter. Absence means
        not loaded where `capabilities.fields.cover_loadings_and_exclusions` is `true`, and nothing
        otherwise.
      type: array
      minItems: 1
      items:
        $ref: '#/CoverLoading'
    exclusions:
      description: >-
        Exclusions on this benefit, in the insurer's own wording, one entry per exclusion.
        `Policy.exclusions` keeps the verbatim policy-level text.
      type: array
      minItems: 1
      items:
        $ref: '#/CoverExclusion'

    occupation_class:
      description: >-
        The occupation rating class THIS benefit was written at, in the insurer's own notation.
        Insurers rate benefits separately, and one policy can carry a life benefit and an income
        benefit written at different classes for the same person — which is what decides the income
        benefit's definitions and what it costs.

        SHOULD be sent wherever the insurer records a class per benefit, and MUST be sent where it
        differs from `policy_holder.occupation_class`. Absent means read the policy holder's.
      type: string
      maxLength: 32
    smoker:
      description: >-
        Smoker status THIS benefit was rated at, per the insurer's definition. MUST be sent where it
        differs from `policy_holder.smoker` — a benefit re-rated as non-smoking after issue, while an
        older one still carries the smoker rate. Absent means read the policy holder's.
      type: boolean

    discounts:
      description: >-
        Discounts applied to this benefit's premium. `premium` is already net of them. Policy-wide
        discounts are on `Policy.premium.discounts`, and the same discount MUST NOT be reported at
        both levels.
      type: array
      minItems: 1
      items:
        $ref: '#/PremiumDiscount'
  # `link_type` says how the benefit relates to something, so a target without it is uninterpretable
  # — the same pairing the quoting contract enforces on `linked_to`. `link_type` alone is allowed,
  # because `standalone` names no target.
  dependentRequired:
    linked_to_cover_id: [link_type]
    linked_to_policy_id: [link_type]
  dependentSchemas:
    exit_reason:
      required: [status]
      properties:
        status:
          not:
            enum: [in_force, in_arrears, pending]

CoverState:
  title: CoverState
  description: >-
    A condition that holds on a benefit on top of its status. RESPONSE-facing and extensible: a
    consumer MUST pass an unrecognised value through rather than failing.
      - `on_claim`               a claim on this benefit is being assessed or paid
      - `premium_waiver_active`  premiums on this benefit are currently waived, typically under a
                                 waiver-on-disability option
      - `premium_freeze`         the premium is held at its current amount and the sum insured
                                 reduces instead
      - `suspended`              premiums and cover are suspended for a period, after which the
                                 benefit resumes; `state_detail` carries how long
  type: string
  x-extensible-enum: [on_claim, premium_waiver_active, premium_freeze, suspended]

CoverLinkType:
  title: CoverLinkType
  description: >-
    How a benefit relates to the one named in `linked_to_cover_id` or `linked_to_policy_id`.
    RESPONSE-facing and extensible: a consumer MUST pass an unrecognised value through rather than
    failing.
      - `extension`   held as a rider on the linked benefit, so paying it reduces that benefit. The
                      same meaning as `extension` in the quoting contract's `LinkType`, so a quoted
                      extension is reported under the same word once in force. Insurers describe
                      this as linked, attached or an extension; all three are this value.
      - `superlink`   one half of a split superannuation structure, with the other half held
                      outside super, linked so that the two cannot both pay for one event
      - `standalone`  stated positively to be linked to nothing. Sent without a target, and a
                      benefit carrying it MUST NOT carry `linked_to_cover_id`
  type: string
  x-extensible-enum: [extension, superlink, standalone]

IndexationState:
  title: IndexationState
  description: >-
    Whether this benefit's sum insured is indexed at each anniversary. RESPONSE-facing and
    extensible: a consumer MUST pass an unrecognised value through rather than failing.

    Carried per benefit because that is where insurers hold it, and because it is the usual
    explanation for a sum insured that moved at anniversary with nobody asking — a consumer that
    cannot see it reads an indexation increase as an unexplained change in cover.
      - `on`             indexed at each anniversary
      - `off`            not indexed
      - `guaranteed_on`  indexed on terms the product describes as guaranteed. What is guaranteed —
                         the right to index, or a minimum rate — is the product's own term; an
                         implementation that cannot say SHOULD send `on`

    Distinct from the `benefit_indexation` feature in `taxonomy/product-features.yaml`, which says a
    product OFFERS indexation. This says whether a benefit in force IS indexed, and an implementation
    SHOULD report it here rather than as an entry in `options`.
  type: string
  x-extensible-enum: [on, off, guaranteed_on]

PolicyOption:
  title: PolicyOption
  description: >-
    An option in force across the policy.

    `feature` is the portable code and `insurer_code` the insurer's own, the same pairing as
    `standard_feature` beside `code` in the quoting contract's feature declarations. Both are
    optional, and `name` is required, because in-force options are often held only as a label:
    the portable code is what makes a book comparable across insurers, and the name is what an
    adviser can always be shown.
  type: object
  required: [name]
  additionalProperties: false
  properties:
    feature:
      description: >-
        The portable code from the `policy` level of `taxonomy/product-features.yaml` this option
        corresponds to, where it corresponds to one. It MUST be a code listed at that level. Omit it
        where the insurer's option is not the standard one — a wrong mapping is worse than none,
        because a consumer filtering its book on the code then finds policies without the option.
      type: string
      maxLength: 64
    insurer_code:
      description: The insurer's own code for the option, verbatim, where it has one.
      type: string
      maxLength: 64
    name:
      description: The insurer's own name for the option, verbatim.
      type: string
      minLength: 1
      maxLength: 200

CoverOption:
  title: CoverOption
  description: >-
    An option in force on one benefit. The same shape as `PolicyOption`, and a separate schema
    because `feature` comes from a different level of the taxonomy.
  type: object
  required: [name]
  additionalProperties: false
  properties:
    feature:
      description: >-
        The portable code from the `covers` level of `taxonomy/product-features.yaml` this option
        corresponds to, where it corresponds to one. It MUST be a code listed at that level and
        SHOULD be one whose `covers` include this benefit's `cover_type`. Omit it rather than map
        loosely, for the reason given on `PolicyOption.feature`.
      type: string
      maxLength: 64
    insurer_code:
      description: The insurer's own code for the option, verbatim, where it has one.
      type: string
      maxLength: 64
    name:
      description: The insurer's own name for the option, verbatim.
      type: string
      minLength: 1
      maxLength: 200

CoverLoading:
  title: CoverLoading
  description: >-
    One underwriting loading on a benefit, on the same two axes as the quoting contract's
    `CoverLoadings` and named the same way, so a loading quoted and a loading in force read alike.
    Either axis or both. At least one MUST be present, since an entry with neither states nothing.
  type: object
  required: [basis]
  additionalProperties: false
  anyOf:
    - required: [percentage]
    - required: [rate_per_thousand]
  properties:
    basis:
      $ref: '#/LoadingBasis'
    percentage:
      description: A percentage uplift on this benefit's risk premium. `'50'` means loaded by 50%.
      $ref: '../../../../core/schemas/money.yaml#/Percentage'
    rate_per_thousand:
      description: A flat dollar amount per $1,000 of sum insured, added to this benefit's risk premium.
      $ref: '../../../../core/schemas/money.yaml#/RatePerThousand'
    description:
      description: The insurer's own wording for the loading, where it carries more than the basis does.
      type: string
      maxLength: 500

LoadingBasis:
  title: LoadingBasis
  description: >-
    What a loading was applied for. RESPONSE-facing and extensible: a consumer MUST pass an
    unrecognised value through rather than failing.
      - `medical`       health, history or build
      - `occupational`  the insured's occupation or working conditions
      - `pastime`       a hazardous pastime or sport
      - `other`         read `description`
  type: string
  x-extensible-enum: [medical, occupational, pastime, other]

CoverExclusion:
  title: CoverExclusion
  description: One exclusion on a benefit, as the insurer words it.
  type: object
  required: [description]
  additionalProperties: false
  properties:
    description:
      description: >-
        The exclusion, verbatim. Free text on purpose: an exclusion's wording IS its scope, and no
        classification carries it without losing what a claim is assessed against.
      type: string
      minLength: 1
      maxLength: 2000

PremiumDiscount:
  title: PremiumDiscount
  description: >-
    A discount applied to a premium. The premium it sits beside is already net of it: this explains
    the premium, it is not to be subtracted from it again.

    Carried because discounts are the usual explanation for a premium that moves at renewal with no
    change in cover — a multi-benefit discount lost when a benefit is removed, a loyalty discount
    reaching its next step — and without them that movement looks like a rate change.
  type: object
  required: [discount_type]
  additionalProperties: false
  properties:
    discount_type:
      $ref: '#/DiscountType'
    name:
      description: The insurer's own name for the discount, verbatim.
      type: string
      maxLength: 200
    share_percent:
      description: The discount as a share of the undiscounted premium. Cannot exceed 100.
      $ref: '../../../../core/schemas/money.yaml#/SharePercentage'
    amount:
      description: The discount at the policy's billing frequency, as `PolicyPremium.amount` is billed.
      $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
    annualised:
      description: >-
        The discount over a year. Read, not derived — for the reason `PolicyPremium.annualised` is,
        and because some insurers report only this figure.
      $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'

DiscountType:
  title: DiscountType
  description: >-
    The kind of discount. RESPONSE-facing and extensible: a consumer MUST pass an unrecognised value
    through rather than failing.
      - `multi_cover`      for holding several benefits, or several lives, on one policy
      - `size`             for a sum insured or premium above a threshold
      - `loyalty`          for years in force
      - `wellness`         earned by meeting health or engagement criteria after issue — the
                           `healthy_lives_discount` policy feature, as applied to this premium
      - `preferred_lives`  a rating category for lives underwritten as lower risk than standard
      - `other`            read `name`
  type: string
  x-extensible-enum: [multi_cover, size, loyalty, wellness, preferred_lives, other]

Arrears:
  title: Arrears
  description: >-
    A policy behind on premium. This is the highest-value record in the whole contract: it is the one
    an adviser must act on within days, and today it is obtained by scraping a portal overnight.

    Identity is `(policy_id, dishonoured_on)`. The same pair reported across successive snapshots is
    the SAME event, not a new one — so an insurer MUST keep `dishonoured_on` stable for a given
    failure rather than restamping it each time it is re-reported. Two entries in the array MUST NOT
    share a `dishonoured_on`.

    `amount_outstanding` is the amount outstanding for THIS failure, not the policy total. A consumer
    wanting total exposure sums the array.
  type: object
  required: [dishonoured_on, amount_outstanding]
  additionalProperties: false
  properties:
    dishonoured_on:
      description: Date the payment failed.
      type: string
      format: date
    amount_outstanding:
      description: >-
        The amount outstanding for THIS failure — the instalment that dishonoured on
        `dishonoured_on`, plus any fee the insurer has added to it. NOT the policy's total arrears.
        A consumer wanting total exposure sums the array; one that reads this as the policy total
        and also sums will double-count a policy two months behind.

        MUST be greater than zero — this block means "behind on premium", and a nil outstanding
        amount is a contradiction rather than a cleared policy. Omit the whole block when the policy
        is paid up.
      allOf:
        - $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
        - properties:
            amount:
              pattern: '^(?!0+(\.0+)?$)\d{1,12}(\.\d{1,2})?$'
    amount_is_estimate:
      description: >-
        `true` where `amount_outstanding` was COMPUTED rather than read from the insurer's own
        ledger — typically the instalment premium multiplied by the number of periods since
        `paid_to`. Defaults to `false`, so an insurer reporting a real figure need not send it.

        This field exists because the alternative to it is silence. An insurer that knows a policy
        is behind but cannot state the exact amount has, without this, only two options: withhold
        the row entirely, or present a derived number as though it came off the ledger. Both have
        happened in production. In one extract the required-amount rule withheld more money than it
        delivered — $139,261 excluded against $136,616 reported — and in another a usable amount was
        available on 5 of 93 arrears policies.

        A consumer SHOULD still work an estimated row: the policy is genuinely in arrears and
        `expected_lapse_on` is unaffected. What it MUST NOT do is reconcile an estimated amount
        against a payment, or present it as the amount owing without qualification.
      type: boolean
      default: false
    reason:
      description: >-
        Why the payment failed, in the insurer's own wording — "insufficient funds", "account
        closed", "card expired". Materially changes what the adviser does next, so worth carrying
        verbatim rather than mapping to an enum nobody agrees on.
      type: string
      maxLength: 200
    expected_lapse_on:
      description: >-
        When the policy will lapse if the arrears are not cleared. The single most actionable field
        here — it is what turns a list of dishonours into a prioritised worklist rather than a list
        of equally urgent problems.

        Optional in the schema, but an implementation reporting arrears at all SHOULD populate it:
        every insurer known to publish arrears data today supplies a lapse date, so it is a
        realistic ask rather than an aspirational one. Declare it in
        `capabilities.fields.expected_lapse_date`.
      type: string
      format: date
    attempts:
      description: >-
        How many collection attempts have failed for THIS instalment. Distinct from the number of
        entries in the array, which counts separate unpaid instalments — conflating the two makes a
        policy one month behind after three retries look the same as one three months behind.
      type: integer
      minimum: 1
    collection_state:
      $ref: '#/CollectionState'

CollectionState:
  title: CollectionState
  description: >-
    What the insurer's collection process is doing about this failure. RESPONSE-facing and
    extensible: a consumer MUST pass an unrecognised value through rather than failing.

    `ceased` is the value this exists for. It means the insurer has stopped collecting from the
    payment method altogether — a cancelled authority, a closed account — so no retry will clear
    the arrears and the premium will not be collected at the next due date either. That is a
    different job from a missed payment: the client needs a new payment method, not a reminder, and
    a consumer that cannot see it waits for a retry that is never coming.
      - `active`           collection continues on the normal cycle
      - `retry_pending`    the insurer will retry, and has not yet set when
      - `retry_scheduled`  a retry is booked
      - `ceased`           the insurer has stopped collecting from this payment method
  type: string
  x-extensible-enum: [active, retry_pending, retry_scheduled, ceased]

BeneficiaryNomination:
  title: BeneficiaryNomination
  description: >-
    One death-benefit nomination. Names the beneficiary by `party_id` — their name and date of birth
    are on the matching `beneficiary` entry in `parties`, and are not repeated here — or by
    `relationship` alone where the nomination is to a class rather than a person, such as the legal
    personal representative. At least one of the two MUST be present.
  type: object
  additionalProperties: false
  anyOf:
    - required: [party_id]
    - required: [relationship]
  properties:
    party_id:
      description: The `party_id` of a `beneficiary` entry in the policy's `parties`.
      type: string
      maxLength: 64
    nomination_type:
      $ref: '#/NominationType'
    relationship:
      description: >-
        The beneficiary's relationship to the life insured, in the insurer's own wording — "spouse",
        "child", "legal personal representative". Free text, because who may be nominated depends
        on the ownership structure and the fund's own rules, and a closed list here would be
        asserting a rule this standard does not own.
      type: string
      maxLength: 100
    share_percent:
      description: >-
        This beneficiary's share of the benefit. Cannot exceed 100, and the shares on a policy SHOULD
        sum to 100.
      $ref: '../../../../core/schemas/money.yaml#/SharePercentage'
    effective_on:
      description: The date the nomination took effect.
      type: string
      format: date
    expires_on:
      description: >-
        The date the nomination lapses, where it does — a binding nomination in super commonly lapses
        after a fixed period unless renewed, and an expired one leaves the benefit to the trustee's
        discretion. The field an adviser needs in order to renew it in time.
      type: string
      format: date

NominationType:
  title: NominationType
  description: >-
    The legal force of a nomination. RESPONSE-facing and extensible: a consumer MUST pass an
    unrecognised value through rather than failing.
      - `binding`        the trustee must pay as nominated, while the nomination is valid
      - `non_binding`    the trustee considers the nomination but decides
      - `non_lapsing`    binding, and does not expire
      - `reversionary`   the benefit continues to a nominated person as an income stream
  type: string
  x-extensible-enum: [binding, non_binding, non_lapsing, reversionary]

PremiumTransaction:
  title: PremiumTransaction
  description: >-
    One premium event on the policy. Amounts are never negative: `transaction_type` carries the
    direction, so a refund is a positive amount of type `refund` rather than a negative payment,
    and a consumer does not have to know which sign convention an insurer chose.
  type: object
  required: [occurred_on, transaction_type, amount]
  additionalProperties: false
  properties:
    transaction_id:
      description: >-
        The insurer's own identifier for the transaction, where it has one. Stable across snapshots,
        so a consumer holding history can tell a re-reported transaction from a new one.
      type: string
      maxLength: 64
    occurred_on:
      description: >-
        The date the transaction fell due or was processed. A `dishonour` SHOULD carry the same date
        as the matching entry in `arrears`, so that the two can be joined.
      type: string
      format: date
    transaction_type:
      $ref: '#/TransactionType'
    amount:
      $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
    status:
      $ref: '#/TransactionStatus'

TransactionType:
  title: TransactionType
  description: >-
    RESPONSE-facing and extensible: a consumer MUST pass an unrecognised value through rather than
    failing.
      - `premium_due`  an instalment fell due
      - `payment`      money collected, or an attempt to collect it — read `status`
      - `dishonour`    a collection attempt failed
      - `rebate`       a rebate credited against the premium, such as a tax rebate on super-held cover
      - `refund`       money returned to the payer
  type: string
  x-extensible-enum: [premium_due, payment, dishonour, rebate, refund]

TransactionStatus:
  title: TransactionStatus
  description: >-
    RESPONSE-facing and extensible: a consumer MUST pass an unrecognised value through rather than
    failing.
      - `succeeded`    completed
      - `outstanding`  due or accrued and not yet collected, including an attempt still in flight
      - `failed`       attempted and failed
  type: string
  x-extensible-enum: [succeeded, outstanding, failed]
