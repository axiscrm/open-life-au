# Open Life Data Standards (AU) — Policy — the person the policy covers.
#
# READ THIS BEFORE HARMONISING IT WITH THE QUOTING CONTRACT. Someone will notice that quoting has an
# `Insured` and policy has a `PolicyHolder`, and will want to merge them into `core/`. Do not.
#
# `core/schemas/party.yaml#/Insured` is deliberately CLOSED AND ANONYMOUS: no name, no address, no
# contact detail, nowhere to put them. It has to be, because a quote request is broadcast to several
# insurers at once, and every field in it multiplies into several separate collections by several
# separate entities that have no existing relationship with the person.
#
# This schema is the opposite, and legitimately so. A policy record describes an EXISTING contract
# between this insurer and this person. The insurer already holds all of it — nothing here is a new
# disclosure to them. And the consumer cannot use the data at all without identity: the entire
# purpose is to reconcile the insurer's record against the client record already held in the
# adviser's system, which is a name-and-date-of-birth match.
#
# The two schemas encode opposite obligations. Merging them would either strip policy of the identity
# it needs, or — far worse, and the likelier direction — introduce names and contact details into a
# quote request that is broadcast to a panel. They live in separate files, in separate contracts, for
# that reason.

$schema: https://json-schema.org/draft/2020-12/schema

PolicyHolder:
  title: PolicyHolder
  description: >-
    The life insured, as the insurer holds them. Enough to reconcile against a client record in the
    consumer's system, and no more — this is not a general contact record and MUST NOT be extended
    into one.
  type: object
  required: [last_name]
  additionalProperties: false
  properties:
    first_name:
      type: string
      maxLength: 100
    middle_name:
      type: string
      maxLength: 100
    last_name:
      type: string
      minLength: 1
      maxLength: 100
    date_of_birth:
      description: >-
        RFC 3339 full-date. Present here, unlike in the quoting contract, because name plus date of
        birth is what makes a reliable match against an existing client record — a name alone is not
        unique enough to attach a policy to the right person, and attaching it to the wrong one is
        worse than failing to match.
      type: string
      format: date
    gender:
      $ref: '../../../../core/schemas/cover-vocabulary.yaml#/Gender'
    smoker:
      description: Smoker status as recorded at underwriting, per this insurer's definition.
      type: boolean
    occupation:
      description: >-
        The occupation as recorded on the policy, in the insurer's own wording. Free text: this is a
        historical record of what was underwritten, not a rating input, so it is deliberately not
        constrained to the occupation taxonomy the quoting contract uses.
      type: string
      maxLength: 200
    occupation_class:
      description: The occupation rating class the policy was written at, in the insurer's own notation.
      type: string
      maxLength: 32
    annual_income:
      description: Income as recorded at underwriting, where the insurer holds it.
      $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
    email:
      type: string
      format: email
      maxLength: 254
    phone:
      type: string
      maxLength: 50
    address:
      $ref: '#/PostalAddress'

PostalAddress:
  title: PostalAddress
  description: >-
    An Australian postal address as held on the policy. Every field optional: insurer exports vary in
    how much they carry, and a partial address is still useful for matching.
  type: object
  additionalProperties: false
  properties:
    line1:
      type: string
      maxLength: 200
    line2:
      type: string
      maxLength: 200
    suburb:
      type: string
      maxLength: 100
    state:
      $ref: '../../../../core/schemas/cover-vocabulary.yaml#/AustralianState'
    postcode:
      type: string
      pattern: '^\d{4}$'
