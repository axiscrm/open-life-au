# Open Life Data Standards (AU) — Policy — the snapshot envelope.
#
# THE SNAPSHOT IS THE POINT OF THIS CONTRACT, AND THIS FILE IS WHERE IT IS MADE SAFE.
#
# A consumer pulls the whole book on a schedule and reconciles it against what it already holds:
# rows that are new get added, rows that changed get updated, and rows that have DISAPPEARED are
# taken to be no longer in force. That last rule is what makes a snapshot useful — no tombstones
# required, no missed-event problem, and a bad run is self-correcting because the next one restates
# the truth.
#
# It is also the dangerous rule. A snapshot is delivered over many pages, and if a walk stops
# halfway — a timeout, a 500 on page nine, an expired cursor — everything on the pages never fetched
# looks *absent*. Reconcile off that and a consumer will mark most of a book as lapsed. Nothing about
# the partial response looks wrong; it is well-formed, valid, and catastrophic.
#
# So a snapshot has an identity and a declared size, every page carries both, and the contract states
# plainly that absence only means anything once the whole walk has completed under one `snapshot_id`.

$schema: https://json-schema.org/draft/2020-12/schema

# ---------------------------------------------------------------------------------------------
# The envelope fields themselves live in `core/schemas/snapshot.yaml`, not here.
#
# Three paged snapshots across this standard now depend on identical absence semantics — the book
# below, the arrears worklist in `arrears-snapshot.yaml`, and the outstanding-requirements snapshot
# in the requirements contract. Restating the rules per collection would guarantee that one copy
# eventually drifts, and the copy that drifts is the one somebody's reconciliation gate was built
# against. What stays here is what is genuinely policy-specific: the page shape and `SnapshotCoverage`.
# ---------------------------------------------------------------------------------------------

# NOTE: there is deliberately no `SnapshotPageInfo` wrapper here, and the `page` property on each
# snapshot refs `core/schemas/pagination.yaml#/PageInfo` directly with its description alongside.
#
# A named wrapper was tried and reverted. A schema whose body is only a `$ref` plus a title bundles
# into a second copy of the target — two schemas both titled `PageInfo` — and openapi-python-client
# deduplicates models by title, so it failed with "Attempted to generate duplicate models with name
# PageInfo", dropped the wrapper, and then dropped BOTH page schemas that referenced it. The
# generated client lost its 200 response on `/policies` and `/arrears` while the generator exited 0.
# Caught by the codegen matrix; do not reintroduce the wrapper.

PolicyPage:
  title: PolicyPage
  description: >-
    One page of a snapshot. Every page of a given walk carries the same `snapshot_id` and
    `generated_at`, so a consumer can prove the pages it assembled belong together.
  type: object
  # Every field the reconciliation gate depends on is REQUIRED. They were optional in 0.1.0, which
  # made the central safety rule unenforceable: `{policies: [], complete: true}` validated, passed all
  # three checks the contract tells a consumer to make, and would lapse an entire book. An
  # implementation that can produce a complete snapshot knows its own size, so requiring it costs
  # nothing and closes the hole.
  required: [mode, snapshot_id, generated_at, total_count, complete, coverage, policies]
  additionalProperties: false
  properties:
    mode:
      $ref: '../../../../core/schemas/snapshot.yaml#/SnapshotMode'
    snapshot_id:
      $ref: '../../../../core/schemas/snapshot.yaml#/SnapshotId'
    generated_at:
      $ref: '../../../../core/schemas/snapshot.yaml#/SnapshotGeneratedAt'
    total_count:
      $ref: '../../../../core/schemas/snapshot.yaml#/SnapshotTotalCount'
    policies:
      type: array
      items:
        $ref: 'policy.yaml#/Policy'
    page:
      description: >-
        Continuation state. The shared pagination schema deliberately carries no count of its own, so
        there is exactly one authoritative total for a snapshot — `total_count` above.
      $ref: '../../../../core/schemas/pagination.yaml#/PageInfo'
    complete:
      $ref: '../../../../core/schemas/snapshot.yaml#/SnapshotComplete'
    coverage:
      $ref: '#/SnapshotCoverage'

SnapshotCoverage:
  title: SnapshotCoverage
  description: >-
    What this snapshot claims to contain. Absence means "not in force", but only within the declared
    scope — a consumer that asked for one adviser code must not lapse policies belonging to another.
  type: object
  # Required members, because the absence rule is scoped to them. A snapshot that omitted its scope
  # left a consumer unable to evaluate "is this held policy inside coverage?" — and the reference
  # algorithm then falls through to "no longer in force", lapsing policies whose adviser code was
  # silently dropped from the credential overnight.
  required: [adviser_codes, statuses]
  additionalProperties: false
  properties:
    adviser_codes:
      description: >-
        The adviser codes this snapshot covers. When a request filtered on adviser codes, this echoes
        the effective set; otherwise it is every code the credential can see.

        THE ECHO IS THE POINT, and it is worth understanding why before treating this as
        housekeeping. A credential's scope is decided on the insurer's side and can be narrower than
        the consumer believes — a practice-level credential issued where a licensee-level one was
        intended, or a code quietly dropped from a group overnight. Nothing in the policy data shows
        it. Every row is valid, every field is populated, the walk completes, and the snapshot is
        simply smaller than it should be.

        This has happened: a credential scoped to a practice returned 823 policies across 9 advisers
        where the licensee book was 3,406 across 95. A feed pointed at it cut that insurer's book to
        roughly a quarter for a week before anyone noticed, and the absence rule then lapsed the
        difference. An echoed code set turns that from a silent loss into a first-night assertion
        failure — a consumer that knows which codes it expects can compare, and one that does not
        can at least alert on the set changing between runs.
      type: array
      items:
        type: string
        maxLength: 32
    statuses:
      description: >-
        The policy statuses included. Defaults to the in-force states — `in_force`, `in_arrears` and
        `pending` — so a consumer MUST NOT infer from a default snapshot that a policy absent from it
        was cancelled rather than simply never reported.
      type: array
      items:
        $ref: 'policy.yaml#/PolicyStatus'
    includes_terminated:
      description: Whether terminal states appear at all in this snapshot.
      type: boolean
      default: false
    changed_since:
      description: >-
        Echoed when `changed_since` was honoured, so a consumer can confirm what it actually received
        rather than what it believes it asked for. MUST be present when `mode` is `incremental`.
      type: string
      format: date-time
