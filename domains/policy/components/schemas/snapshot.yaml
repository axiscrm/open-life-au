# Open Life Data Standards (AU) — Policy — the snapshot envelope.
#
# THE SNAPSHOT IS THE POINT OF THIS CONTRACT, AND THIS FILE IS WHERE IT IS MADE SAFE.
#
# A consumer pulls the whole book on a schedule and reconciles it against what it already holds:
# rows that are new get added, rows that changed get updated, and rows that have DISAPPEARED are
# taken to be no longer in force. That last rule is what makes a snapshot useful — no tombstones
# required, no missed-event problem, and a bad run is self-correcting because the next one restates
# the truth.
#
# It is also the dangerous rule. A snapshot is delivered over many pages, and if a walk stops
# halfway — a timeout, a 500 on page nine, an expired cursor — everything on the pages never fetched
# looks *absent*. Reconcile off that and a consumer will mark most of a book as lapsed. Nothing about
# the partial response looks wrong; it is well-formed, valid, and catastrophic.
#
# So a snapshot has an identity and a declared size, every page carries both, and the contract states
# plainly that absence only means anything once the whole walk has completed under one `snapshot_id`.

$schema: https://json-schema.org/draft/2020-12/schema

PolicyPage:
  title: PolicyPage
  description: >-
    One page of a snapshot. Every page of a given walk carries the same `snapshot_id` and
    `generated_at`, so a consumer can prove the pages it assembled belong together.
  type: object
  # Every field the reconciliation gate depends on is REQUIRED. They were optional in 0.1.0, which
  # made the central safety rule unenforceable: `{policies: [], complete: true}` validated, passed all
  # three checks the contract tells a consumer to make, and would lapse an entire book. An
  # implementation that can produce a complete snapshot knows its own size, so requiring it costs
  # nothing and closes the hole.
  required: [mode, snapshot_id, generated_at, total_count, complete, coverage, policies]
  additionalProperties: false
  properties:
    mode:
      description: >-
        Whether this response is a FULL snapshot or an INCREMENTAL delta.

        Required, and load-bearing. Without it the two are byte-indistinguishable: an incremental
        response carries the same envelope, the same `complete: true`, and a `total_count` that
        matches the handful of changed policies — so it passes every reconciliation gate, and a
        consumer that applies it will lapse everything that did not happen to change. A stray
        `changed_since` from configuration or a retry wrapper is enough to trigger it.

        **Absence carries NO meaning when `mode` is `incremental`.** A consumer MUST refuse to run
        absence-based reconciliation on anything but `full`.
      type: string
      enum: [full, incremental]
    snapshot_id:
      description: >-
        Identifies this consistent view of the book.

        MUST be unique per generation and MUST NOT be reused. Deriving it from a business date is not
        sufficient: a re-run of the same night's extract under the same id lets a consumer stitch half
        of one view onto half of another while every page agrees on the identifier, which is the exact
        seam this field exists to prevent. Compare `generated_at` as well. Opaque and stable for the whole walk.

        A server MUST hold the snapshot stable while it is being paged: policies must not shift
        between pages because the underlying data changed mid-walk. Where an implementation cannot
        do that, it MUST issue a new `snapshot_id` and reject the stale cursor with `409` rather
        than quietly serving a mixture of two views — a consumer that reconciles across a shifted
        boundary will lose rows in exactly the way this whole file exists to prevent.
      type: string
      minLength: 1
      maxLength: 128
    generated_at:
      description: When the snapshot was taken. RFC 3339 with an explicit offset.
      type: string
      format: date-time
    total_count:
      description: >-
        Total policies in the snapshot, counted as DISTINCT `policy_id` values across all pages.

        MUST be identical on every page bearing the same `snapshot_id`. A consumer MUST fail the run
        if it varies mid-walk, because a changing total means the underlying view moved and the pages
        already fetched no longer describe one book.

        Counted distinct, and compared distinct, deliberately: a cursor that emits one policy twice
        and skips another leaves the assembled COUNT correct while a live policy is missing. Compare
        `new Set(policies.map(p => p.policy_id)).size` against this, never `policies.length`.

        Note this is NOT `page.total_count` from the shared pagination schema, which is explicitly
        advisory and may drift. Use this one.
      type: integer
      minimum: 0
    policies:
      type: array
      items:
        $ref: 'policy.yaml#/Policy'
    page:
      description: >-
        Continuation state. `total_count` is forbidden here: the shared pagination schema documents
        its own as advisory and permitted to drift, and a consumer that built its safety check on
        that field would have based reconciliation on an estimate. There is exactly one authoritative
        count, at the top level of this object.
      allOf:
        - $ref: '../../../../core/schemas/pagination.yaml#/PageInfo'
        - properties:
            total_count: false
    complete:
      description: >-
        `true` on the final page of the walk, and only there. This is the flag a consumer's
        reconciliation gates on.

        A server MUST NOT send `complete: true` together with `page.next_cursor` — the two contradict
        each other, and a consumer gating on `complete` would stop early and treat the unfetched
        remainder as absent. A consumer MUST fail the run if it sees both.

        Required on every page precisely so that "the insurer never sends it" cannot deadlock a
        consumer that correctly refuses to reconcile without it.
      type: boolean
    coverage:
      $ref: '#/SnapshotCoverage'

SnapshotCoverage:
  title: SnapshotCoverage
  description: >-
    What this snapshot claims to contain. Absence means "not in force", but only within the declared
    scope — a consumer that asked for one adviser code must not lapse policies belonging to another.
  type: object
  # Required members, because the absence rule is scoped to them. A snapshot that omitted its scope
  # left a consumer unable to evaluate "is this held policy inside coverage?" — and the reference
  # algorithm then falls through to "no longer in force", lapsing policies whose adviser code was
  # silently dropped from the credential overnight.
  required: [adviser_codes, statuses]
  additionalProperties: false
  properties:
    adviser_codes:
      description: >-
        The adviser codes this snapshot covers. When a request filtered on adviser codes, this echoes
        the effective set; otherwise it is every code the credential can see. Echoing it matters:
        it is how a consumer knows whether a code it expected was silently excluded, which would
        otherwise look identical to that adviser having no policies.
      type: array
      items:
        type: string
        maxLength: 32
    statuses:
      description: >-
        The policy statuses included. Defaults to the in-force states — `in_force`, `in_arrears` and
        `pending` — so a consumer MUST NOT infer from a default snapshot that a policy absent from it
        was cancelled rather than simply never reported.
      type: array
      items:
        $ref: 'policy.yaml#/PolicyStatus'
    includes_terminated:
      description: Whether terminal states appear at all in this snapshot.
      type: boolean
      default: false
    changed_since:
      description: >-
        Echoed when `changed_since` was honoured, so a consumer can confirm what it actually received
        rather than what it believes it asked for. MUST be present when `mode` is `incremental`.
      type: string
      format: date-time
