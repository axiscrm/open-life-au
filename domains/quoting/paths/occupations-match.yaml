# Open Life Data Standards (AU) — Quoting — POST /occupations:match

post:
  operationId: matchOccupation
  summary: Resolve a baseline occupation to this insurer's own
  description: >-
    Given an ABS OSCA code and the qualifiers that sit beneath it, return the insurer's own
    occupations that correspond, most confident first.

    The reference's `description` is display text and is never matched on. To find an occupation
    by name, search the insurer's list with `GET /occupations?q=`.

    ### Why this endpoint exists

    An adviser picks an occupation once, from one picker, and expects to compare every insurer on
    the panel. Each insurer rates its own list, so something has to bridge the two. Putting the
    bridge here — inside the insurer, which is the only party that knows its own manual — avoids
    making anyone else the custodian of a mapping they cannot maintain.

    ### Several rows for one code

    A baseline code commonly lands on several of the insurer's rows, split by specialty or by a
    few facts about the insured. Where the insurer publishes it, `occupation_groups` says how:
    which specialties there are, what each needs asked, and each candidate's `selected_when` says
    which answers pick it. A consumer can then narrow to one row without another call.

    Asking is optional. A consumer that asks nothing quotes on the baseline code, or on the row
    marked `insurer_default`, and the quote reports what was assumed in
    `resolved_occupation.specialty_defaulted` and `defaulted_qualifiers`.

    Send the code WITHOUT qualifiers to get every row of each group. Qualifiers in the request
    rank the candidates. They do not remove rows from a group.

    ### An empty result is a real answer

    `candidates: []` means this insurer has no occupation corresponding to the reference. The
    consumer MUST show the insurer as unquotable for this client and MUST NOT substitute a nearby
    occupation of its own choosing. A silently wrong occupation produces a wrong premium that
    looks entirely normal, and an adviser has no way to detect it.

    ### Confidence

    Where the insurer maintains a one-to-one correspondence to the baseline it returns `exact`. A
    match derived from qualifiers alone will usually be `moderate` or below, and a consumer SHOULD
    ask the adviser to confirm anything below `exact` rather than pricing straight through.

    Results depend only on the request body: the occupation reference and, where sent,
    `annual_income` and `employment_status`. They are safely cacheable by the consumer per insurer
    and request.
  tags: [Occupations]
  security:
    - oauth2: [occupations.read]
  parameters:
    - $ref: '../components/parameters.yaml#/RequestId'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/occupations.yaml#/OccupationMatchRequest'
  responses:
    '200':
      description: Candidate matches, possibly empty.
      headers:
        X-Request-Id:
          $ref: '../../../core/http/headers.yaml#/XRequestId'
      content:
        application/json:
          schema:
            $ref: '../components/schemas/occupations.yaml#/OccupationMatchResponse'
    '400':
      $ref: '../../../core/http/responses.yaml#/BadRequest'
    '401':
      $ref: '../../../core/http/responses.yaml#/Unauthorized'
    '403':
      $ref: '../../../core/http/responses.yaml#/Forbidden'
    '422':
      $ref: '../../../core/http/responses.yaml#/UnprocessableEntity'
    '429':
      $ref: '../../../core/http/responses.yaml#/TooManyRequests'
    '500':
      $ref: '../../../core/http/responses.yaml#/InternalError'
