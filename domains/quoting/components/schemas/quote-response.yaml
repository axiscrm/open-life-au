# Open Life Data Standards (AU) — Quoting — the response.
#
# Three rules here carry more weight than anything else in the standard, because each one guards
# against a failure that is SILENT — it produces a plausible number rather than an error:
#
#   1. All six frequencies are returned on every priced line. A monthly premium is not the annual
#      premium over twelve; insurers apply a frequency loading. Anyone who divides will understate
#      the cost, and nothing in the response will look wrong.
#   2. A line that could not be assembled is flagged, never priced. An insurer that can meet some
#      of the requested covers but not all of them must say so, because a partial policy shown at
#      its lower premium reads as a better offer than a complete one.
#   3. Every deferred choice is reported back. An option the insurer could not honour must appear
#      in `resolved_options` as `unsupported_ignored`, or a quote that quietly dropped a benefit
#      is indistinguishable from one that included it.

$schema: https://json-schema.org/draft/2020-12/schema

QuoteResponse:
  title: QuoteResponse
  description: >-
    The result of a pricing request: every line the insurer can offer for the covers requested,
    plus the lines it had to decline. Lines are a FLAT array, never a map keyed by brand or
    product — one brand routinely produces several lines once campaigns are in play.
  type: object
  required: [quote_id, quoted_at, lines]
  additionalProperties: false
  properties:
    quote_id:
      $ref: '../../../../core/schemas/identifiers.yaml#/QuoteId'
    quoted_at:
      description: When the quote was priced. RFC 3339 with an explicit offset.
      type: string
      format: date-time
    valid_until:
      description: >-
        When these premiums cease to be reliable. Advisory but strongly RECOMMENDED: without it a
        consumer cannot tell a stale saved quote from a current one.
      type: string
      format: date-time
    client_reference:
      description: Echoed verbatim from the request, so the response can be reconciled.
      $ref: '../../../../core/schemas/identifiers.yaml#/ClientReference'
    lines:
      description: >-
        Every line the insurer produced, priced and unpriced alike. MAY be empty, which means the
        insurer offers nothing at all for this insured — a legitimate answer, not an error.
      type: array
      items:
        $ref: '#/QuoteLine'
    warnings:
      description: >-
        Adviser-facing notes that apply to the whole quote rather than one line. For information
        only: a warning MUST NOT be the sole indication that something was not priced as asked —
        that belongs in `resolved_options` or `errors` on the affected line.
      type: array
      items:
        type: string
      default: []

QuoteLine:
  title: QuoteLine
  description: >-
    One row of a comparison table: one product or product combination, from one brand, at one
    campaign variant.
  type: object
  required: [line_id, insurer_id, brand_id, product_name, all_needs_met, resolved_occupation]
  additionalProperties: false
  # Rule 2, enforced rather than merely asserted.
  #
  # The file header calls this the rule that carries more weight than anything else, and the repo
  # claimed in three places that JSON Schema could not express it. It can, and until it did all of
  # these validated: a declined line carrying a full premium; a declined line with an empty `errors`;
  # a priced line with no premium at all. An insurer generating stubs from the published bundle could
  # return a declined line with a price on it and pass every layer of validation on both sides — and
  # a consumer would sort it cheapest-first, which is the exact outcome the rule exists to prevent.
  #
  # `if/then/else` is ignored by every generator documented in docs/generators/, so this costs nothing
  # downstream.
  if:
    properties:
      all_needs_met:
        const: false
  then:
    properties:
      # `not: {}` forbids the property. Written this way rather than the equivalent `premiums: false`
      # because openapi-python-client's schema parser rejects a boolean schema outright — "Input should
      # be a valid dictionary or instance of Schema" — and fails the whole document, taking the client
      # with it. Semantically identical, universally parseable.
      premiums:
        not: {}
      cover_lines:
        maxItems: 0
      # A projection of a price that does not exist. Forbidden on the same grounds as `premiums`:
      # a declined line carrying a ten-year total is a number a consumer will put in a comparison.
      projection:
        not: {}
      errors:
        minItems: 1
    required: [errors]
  else:
    # `premiums` and `rate_table_version` are declared here as well as in `properties` below. They are
    # unconstrained restatements: the `no-required-schema-properties-undefined` lint rule inspects each
    # `if`/`then`/`else` branch in isolation and does not see the sibling `properties`, so a bare
    # `required` here reads to it as naming undefined members.
    required: [premiums, rate_table_version]
    properties:
      premiums: {}
      rate_table_version: {}
      errors:
        maxItems: 0
  properties:
    line_id:
      $ref: '../../../../core/schemas/identifiers.yaml#/LineId'
    insurer_id:
      $ref: '../../../../core/schemas/identifiers.yaml#/InsurerId'
    brand_id:
      $ref: '../../../../core/schemas/identifiers.yaml#/BrandId'
    product_name:
      $ref: '../../../../core/schemas/identifiers.yaml#/ProductName'
    component_products:
      description: >-
        The insurer's own names for each product this line was assembled from, where a line
        combines more than one. Display only.
      type: array
      items:
        $ref: '../../../../core/schemas/identifiers.yaml#/ProductName'
      default: []
    rate_table_version:
      $ref: '../../../../core/schemas/identifiers.yaml#/RateTableVersion'

    all_needs_met:
      description: >-
        Whether the insurer assembled EVERY cover requested. `false` means it could not, and
        `errors` MUST then be non-empty and `premiums` MUST be absent.

        This is not an error response. The insurer was able to answer; the answer is that this
        combination cannot be written. Consumers MUST NOT present such a line as a price, MUST
        NOT include it in a cheapest-first sort, and MUST NOT allow it to be selected.
      type: boolean
    errors:
      description: >-
        Why the requested covers could not be assembled, in terms an adviser can act on ("the
        linked TPD amount cannot exceed the life cover"). Non-empty exactly when `all_needs_met`
        is `false`.
      type: array
      items:
        type: string
      default: []

    premiums:
      description: >-
        The price of this line at every payment frequency. REQUIRED on a line where
        `all_needs_met` is `true`; MUST be absent otherwise.
      $ref: '#/PremiumSet'
    cover_lines:
      description: >-
        The priced covers making up this line, one per cover the insurer wrote. Includes covers
        the insurer added of its own accord where a product requires them.
      type: array
      items:
        $ref: '#/CoverLine'
      default: []

    resolved_occupation:
      $ref: '../../../../core/schemas/occupation.yaml#/ResolvedOccupation'
    resolved_options:
      description: >-
        What the insurer did with every option that it decided rather than simply obeyed. See
        `ResolvedOption` — this array is how a consumer learns that an option was dropped.
      type: array
      items:
        $ref: '#/ResolvedOption'
      default: []

    campaign:
      description: >-
        The campaign variant this line was priced under. Absent on a standard-rates line.
      type: object
      required: [code, name]
      additionalProperties: false
      properties:
        code:
          type: string
          maxLength: 64
        name:
          description: The insurer's own wording for the campaign, for display.
          type: string
          maxLength: 200

    medical_requirements:
      description: >-
        Mandatory medical underwriting this insurer requires before it will issue THIS line, in
        the insurer's own wording. Requirements scale with the sum insured, so two lines from the
        same insurer can legitimately differ.

        An EMPTY array means "none required" and is a positive statement. It is distinct from
        `underwriting_reported: false`, which means the insurer has not told us either way — a
        consumer MUST NOT render the latter as "no medicals required".
      type: array
      items:
        type: string
        maxLength: 200
      default: []
    underwriting_reported:
      description: Whether `medical_requirements` is a complete answer for this line.
      type: boolean
      default: false

    inclusions:
      description: >-
        The line's as-priced configuration, as structured values rather than rendered text, so a
        consumer can display it in its own words. Read from what the insurer actually wrote,
        which differs from the request wherever a deferred choice was settled.
      type: array
      items:
        $ref: '#/InclusionGroup'
      default: []

    projection:
      description: >-
        This line's cost projected forward. Present only where the request asked for a projection
        and the insurer can produce one; a line where `all_needs_met` is `false` MUST NOT carry
        one, since there is no premium to project.
      $ref: '#/Projection'
    research_scores:
      description: >-
        Third-party research ratings for this line, where the insurer publishes them.
      $ref: '#/ResearchScores'
    documents:
      description: >-
        Documents and links relating to THIS line — the product disclosure statement, a branded
        quote report, a deep link into the insurer's own system to continue the application.
      type: array
      maxItems: 20
      items:
        $ref: '#/LineDocument'
      default: []

InclusionGroup:
  title: InclusionGroup
  description: One grouping of as-priced settings — typically one per cover written.
  type: object
  required: [title, items]
  additionalProperties: false
  properties:
    title:
      type: string
      maxLength: 120
    items:
      type: array
      items:
        type: object
        required: [field, value]
        additionalProperties: false
        properties:
          field:
            description: >-
              The name of the setting, as a standard field path where one applies (for example
              `waiting_period`), so a consumer can label it in its own vocabulary.
            type: string
            maxLength: 120
          value:
            description: The as-priced value. A standard enum value where one applies.
          display_label:
            description: The insurer's own wording, where it wants a specific rendering.
            type: string
            maxLength: 200

ResolvedOption:
  title: ResolvedOption
  description: >-
    What became of one requested option. An entry is REQUIRED for every option the insurer did
    not apply exactly as asked, and for every deferred choice (`prefer`, `prefer_include`,
    `prefer_exclude`, `any`) whether or not the outcome matched the leaning.

    NORMATIVE: any option present in the request but NOT reflected in this array with an
    `applied` value equal to the requested value MUST be reported here — and an option the
    product cannot honour at all MUST be reported as `unsupported_ignored`. An insurer that
    silently ignores an option produces a line that looks like it included a benefit it did not,
    which is the most consequential defect this standard exists to prevent.
  type: object
  required: [cover_id, option, resolution]
  additionalProperties: false
  # A substitution that does not say what was actually priced is worse than no report at all: the
  # consumer knows the request was not honoured but still has an unexplained premium.
  if:
    properties:
      resolution:
        const: substituted
    required: [resolution]
  then:
    required: [applied]
    properties:
      applied: {}
  properties:
    cover_id:
      description: >-
        The cover the option was given on, echoed from the request. Use the literal `policy` for
        an option given at policy level.
      type: string
      maxLength: 64
    option:
      description: The field name of the option, as it appears in the request schema.
      type: string
      maxLength: 120
      examples: [double_benefit, waiting_period, structure]
    requested:
      description: The value the consumer asked for. Absent where the consumer did not supply one.
    applied:
      description: >-
        The value the insurer actually priced. Absent where the option was ignored entirely.
    resolution:
      type: string
      enum:
        # The insurer applied exactly what was asked. Reported for deferred choices so the
        # consumer can distinguish a confirmed answer from an unanswered one.
        - as_requested
        # The consumer deferred and the insurer chose. Surface these: an adviser needs to know
        # which settings they chose and which were chosen for them.
        - resolved_by_insurer
        # The consumer supplied nothing and the insurer applied its product default.
        - defaulted
        # The product cannot honour this option and it was NOT applied. The premium therefore
        # does not include it. For an option that ADDS something — a benefit, a waiver — this is the
        # right answer: it is simply absent.
        - unsupported_ignored
        # The requested value could not be honoured and a DIFFERENT one was priced. `applied` MUST be
        # populated.
        #
        # This exists because most options are enum-valued, and for those "not applied" is impossible:
        # a premium is always on some structure, some waiting period, some ownership. An adviser asking
        # for `level_65` on a product that only writes stepped previously got `unsupported_ignored`
        # with `applied` absent — conformant, and it left a STEPPED premium sitting in the level-65
        # column of a comparison table with nothing saying so. The same gap covered a sum insured
        # capped below the amount requested.
        - substituted
    detail:
      description: >-
        Why, in adviser-facing terms. RECOMMENDED whenever the resolution is `unsupported_ignored`,
        and for `substituted` it is what lets an adviser judge whether the substitution is acceptable.
      type: string
      maxLength: 300

PremiumSet:
  title: PremiumSet
  description: >-
    The same line priced at all six payment frequencies. ALL SIX ARE REQUIRED.

    An insurer must not return only the frequency it was asked for, because there is no way to
    derive the others: sub-annual premiums carry a frequency loading, so
    `weekly x 52 >= fortnightly x 26 >= monthly x 12 >= quarterly x 4 >= half_yearly x 2 >= annual`.
    Returning all six also means a consumer can let an adviser switch frequency without
    re-pricing, which removes a whole class of billable round-trips.

    ROUNDING. The ordering holds on the UNROUNDED amounts. Once each frequency is rounded to the cent
    the products can cross by up to one cent per period — a $1,000 annual premium at zero loading gives
    monthly 83.33 (annualising to 999.96) and quarterly 250.00 (1,000.00), so monthly annualises BELOW
    quarterly. A consumer checking the ordering MUST therefore allow a tolerance of
    `periods x $0.01`; a conformance test without it fails every honest zero-loading insurer.

    An insurer that levies no frequency loading returns six sets whose annualised totals are equal
    within that tolerance; that is valid.
  type: object
  required: [weekly, fortnightly, monthly, quarterly, half_yearly, annual]
  additionalProperties: false
  properties:
    weekly: { $ref: '#/PremiumBreakdown' }
    fortnightly: { $ref: '#/PremiumBreakdown' }
    monthly: { $ref: '#/PremiumBreakdown' }
    quarterly: { $ref: '#/PremiumBreakdown' }
    half_yearly: { $ref: '#/PremiumBreakdown' }
    annual: { $ref: '#/PremiumBreakdown' }

PremiumBreakdown:
  title: PremiumBreakdown
  description: >-
    One frequency's premium, split by whether it is funded inside or outside superannuation and
    with stamp duty shown separately on each side.

    ARITHMETIC INVARIANT, NORMATIVE AND TESTED:

      total == premium_super + stamp_duty_super + premium_non_super + stamp_duty_non_super

    exactly, to the cent, with no tolerance. `policy_fee` is INCLUDED within `total` and within
    whichever premium component bears it — it is not a further addition. Keeping the fee outside
    the total is a recurring source of comparison tables that understate the real cost.

    The super/non-super split is a genuine split, not a bucketing: one cover can carry both sides
    at once where it is written under a linked ownership structure.
  type: object
  required:
    - total
    - premium_super
    - premium_non_super
    - stamp_duty_super
    - stamp_duty_non_super
  additionalProperties: false
  properties:
    total:
      description: The all-in amount payable at this frequency.
      $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
    premium_super:
      description: Premium funded from superannuation, excluding stamp duty.
      $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
    premium_non_super:
      description: Premium funded outside superannuation, excluding stamp duty.
      $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
    stamp_duty_super:
      description: Stamp duty attributable to the superannuation-funded premium.
      $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
    stamp_duty_non_super:
      description: Stamp duty attributable to the non-superannuation premium.
      $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
    policy_fee:
      description: >-
        The policy or administration fee at this frequency, GROSS of stamp duty — that is, the fee plus
        the duty levied on it, so it is the amount by which `total` exceeds the sum of the cover lines.

        Gross is stated explicitly because the two conventions differ by the duty rate and are
        indistinguishable in the payload. One insurer reporting the fee net and another gross makes a
        "premium excluding fees" figure, or any fee-to-fee comparison, silently wrong — and the
        difference is small enough to look like a product variation rather than a units error.

        Where the split matters, `policy_fee_premium` and `policy_fee_stamp_duty` give it exactly.

        Reported separately from the cover lines because the fee is not attributable to any one cover,
        so it cannot be recovered by summing them.
      $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
    policy_fee_premium:
      description: The fee itself, excluding duty. Optional; where present, plus `policy_fee_stamp_duty` it MUST equal `policy_fee`.
      $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
    policy_fee_stamp_duty:
      description: Stamp duty levied on the policy fee.
      $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'

CoverLine:
  title: CoverLine
  description: >-
    One priced cover within a line. `cover_id` is echoed from the request so a consumer can match
    a priced cover to the one it asked for without guessing from type and amount.

    THE AMOUNT FIELD DEPENDS ON THE COVER. Income protection and business expenses are written as a
    MONTHLY BENEFIT and carry `monthly_benefit`; every other cover carries `sum_insured`. Before this
    distinction existed, `sum_insured` was the only option and an insurer had to choose how to report a
    $6,500-a-month benefit — as `6500.00` or annualised to `78000.00`, both conformant. A consumer
    comparing benefits across a panel was comparing incompatible units with nothing to disambiguate
    them, and a 12x discrepancy reads as a product difference rather than an error.
  type: object
  required: [cover_type, premiums]
  additionalProperties: false
  # Two mechanisms, because each half needs a different one.
  #
  # `dependentSchemas` handles EXCLUSION: it keys on a property being present and constrains the rest
  # of the object, so a lump-sum amount on a monthly-benefit cover fails without either amount field
  # being named in a bare `required` — which is what the
  # `no-required-schema-properties-undefined` lint rule cannot see through.
  #
  # `if/then/else` handles the REQUIREMENT, with each branch restating its amount as a `$ref` so both
  # that rule and the money-must-be-a-ref rule are satisfied.
  dependentSchemas:
    monthly_benefit:
      properties:
        cover_type:
          enum: [income_protection, business_expenses]
    sum_insured:
      properties:
        cover_type:
          # Stated as an exclusion rather than a whitelist, so an unrecognised cover type — which the
          # response side must tolerate, since `cover_type` is extensible here — is treated as
          # lump-sum rather than rejected outright. Listing the permitted types instead made the
          # extensible enum unusable: a cover type added in a later minor failed this constraint and
          # the whole line was rejected.
          not:
            enum: [income_protection, business_expenses]
  if:
    properties:
      cover_type:
        enum: [income_protection, business_expenses]
    required: [cover_type]
  then:
    required: [monthly_benefit]
    properties:
      monthly_benefit:
        $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
  else:
    required: [sum_insured]
    properties:
      sum_insured:
        $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
  properties:
    cover_id:
      description: >-
        Echoed from the request. Absent only where the insurer added this cover of its own
        accord because the product requires it.
      $ref: '../../../../core/schemas/identifiers.yaml#/CoverId'
    cover_type:
      description: >-
        Extensible on the response side — see `CoverTypeResponse`. Pass an unrecognised value through
        rather than failing.
      $ref: '../../../../core/schemas/cover-vocabulary.yaml#/CoverTypeResponse'
    description:
      description: The insurer's own name for this cover as written.
      type: string
      maxLength: 200
    sum_insured:
      description: >-
        The lump sum actually written, which may differ from the amount requested where the insurer
        applied a cap or a product minimum. Any such difference MUST also appear in
        `resolved_options` as `substituted`. Present on every cover EXCEPT income protection and
        business expenses.
      $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
    monthly_benefit:
      description: >-
        The MONTHLY benefit actually written — not annualised. Present on income protection and
        business expenses, and on nothing else. Where the insurer capped it below the amount
        requested, that MUST also appear in `resolved_options` as `substituted`.
      $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
    waiting_period:
      description: >-
        The waiting period as WRITTEN, for the monthly-benefit covers. Reported here as well as in
        `inclusions` because the as-written terms are what a consumer compares, and `inclusions` is
        optional, free-text-keyed, and therefore not something to depend on.
      $ref: 'covers.yaml#/WaitingPeriod'
    benefit_period:
      description: The benefit period as written, for the monthly-benefit covers.
      $ref: 'covers.yaml#/BenefitPeriod'
    tpd_definition:
      description: >-
        The TPD test as written. An own-occupation and an any-occupation TPD at the same sum insured
        are materially different cover, so a consumer comparing two lines needs this structurally
        rather than having to parse it out of display text.
      $ref: '../../../../core/schemas/cover-vocabulary.yaml#/TpdDefinition'
    ownership:
      $ref: '../../../../core/schemas/cover-vocabulary.yaml#/OwnershipResponse'
    structure:
      $ref: '../../../../core/schemas/cover-vocabulary.yaml#/StructureResponse'
    linked_to:
      description: Echoed from the request where this cover was written as an extension.
      $ref: '../../../../core/schemas/identifiers.yaml#/CoverId'
    premiums:
      description: >-
        This cover's contribution to the line's premium, at all six frequencies. The same
        arithmetic invariant applies per cover. Summing `cover_lines[].premiums[f].total` will
        NOT reach the line total wherever a policy fee applies — read the line total, do not
        derive it.
      $ref: '#/PremiumSet'

Projection:
  title: Projection
  description: >-
    One line's cost projected forward, year by year, with the running total.

    The year-by-year series is returned rather than a single headline number because a consumer
    presents this several ways — average annual cost, cumulative cost, first year, final year —
    and every one of those is derivable from the series. Returning only a total would force a
    re-quote per presentation, which is what advisers do today.

    THE BASIS MUST BE ECHOED. A projection with indexation applied and one without are different
    questions with different answers, and a consumer comparing an indexed projection from one
    insurer against a flat one from another gets a difference that has nothing to do with price.
  type: object
  required: [basis, total, years]
  additionalProperties: false
  properties:
    basis:
      $ref: '#/ProjectionBasis'
    total:
      description: >-
        The cumulative cost over the whole horizon — the final year's `cumulative_total`, repeated
        here so a consumer showing only the headline need not walk the series.
      $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
    years:
      description: >-
        One entry per projected year, ordered from `year: 0` (the current year, whose
        `annual_total` MUST equal the annual figure in `premiums`) and contiguous thereafter.
      type: array
      minItems: 1
      maxItems: 60
      items:
        $ref: '#/ProjectionYear'

ProjectionBasis:
  title: ProjectionBasis
  description: >-
    What the insurer actually projected, which is not always what was asked. An insurer that
    applied a different indexation rate, or could not index some covers, says so here rather than
    in `resolved_options`, because the answer is only interpretable alongside the numbers.
  type: object
  required: [years, indexed]
  additionalProperties: false
  properties:
    years:
      description: How many years the projection covers, matching the length of `years`.
      type: integer
      minimum: 1
      maximum: 60
    indexed:
      description: Whether sums insured were grown across the projection.
      type: boolean
    indexation_rate:
      description: >-
        The annual rate actually applied. REQUIRED when `indexed` is `true` — including where the
        insurer applied its own default because the request named no rate, which is the case a
        consumer most needs told.
      $ref: '../../../../core/schemas/money.yaml#/Percentage'
    excluded_covers:
      description: >-
        `cover_id`s that were NOT indexed because the product does not index them, while the rest
        of the projection was. Empty or absent means every cover was treated alike.

        Real products do this — a child trauma benefit is commonly flat inside an otherwise
        indexed policy — and without this field those covers' premiums are simply lower than a
        consumer's own recalculation would predict, with nothing to attribute the difference to.
      type: array
      maxItems: 20
      items:
        $ref: '../../../../core/schemas/identifiers.yaml#/CoverId'
      default: []

ProjectionYear:
  title: ProjectionYear
  description: One year of a projection.
  type: object
  required: [year, annual_total, cumulative_total]
  additionalProperties: false
  properties:
    year:
      description: Offset from the current year. `0` is the year being quoted.
      type: integer
      minimum: 0
      maximum: 59
    age_next_birthday:
      description: >-
        The insured's age next birthday in that year, so a consumer can label the series by age
        rather than by offset. Omitted where the request carried no age the insurer can advance.
      type: integer
      minimum: 0
      maximum: 120
    annual_total:
      description: >-
        The all-in cost for that year — premium plus stamp duty plus policy fee, on the same basis
        as `PremiumBreakdown.total` at annual frequency.
      $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
    cumulative_total:
      description: >-
        The running total up to and including this year. Stated rather than left to the consumer
        because rounding each year and summing gives a different answer from summing and rounding
        once, and two consumers doing it differently is a comparison table that disagrees with
        itself.
      $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
    sum_insured_indexed:
      description: >-
        Whether this year's figure reflects an indexed sum insured. Distinguishes the first year of
        an indexed projection, which is normally unindexed, from the rest.
      type: boolean
      default: false

ResearchScores:
  title: ResearchScores
  description: >-
    Third-party research ratings for a line, as published by a research house.

    NOT THE INSURER'S OWN OPINION, and the standard is deliberate about that. An insurer that
    scored its own products here would be marking its own homework, so `provider` is REQUIRED and
    a consumer that cannot attribute a score should not display it. Scores are only comparable
    between lines rated by the same provider on the same dataset.

    Optional throughout. Most insurers will not carry these at all; an aggregator or a research
    licensee may.
  type: object
  required: [provider]
  additionalProperties: false
  properties:
    provider:
      description: The research house whose ratings these are.
      type: string
      maxLength: 120
    dataset_version:
      description: >-
        The provider's identifier for the dataset the scores came from. Scores move when a
        provider republishes, so without this a stored score cannot be reproduced or defended —
        the same reasoning as `rate_table_version`.
      type: string
      maxLength: 64
    feature_score:
      description: >-
        The product's feature rating, 0 to 100, where higher is more comprehensive. A measure of
        what the product covers, independent of price.
      $ref: '#/Score'
    combined_score:
      description: >-
        The provider's blended rating of features against price, 0 to 100. Deliberately separate
        from `feature_score`: they answer different questions and a consumer sorting on the wrong
        one recommends the wrong product.
      $ref: '#/Score'

Score:
  title: Score
  description: A research score from 0 to 100 inclusive, as a decimal string with at most two places.
  type: string
  pattern: '^(100(\.0{1,2})?|\d{1,2}(\.\d{1,2})?)$'
  examples: ['0', '87.5', '100']

LineDocument:
  title: LineDocument
  description: >-
    A document or link relating to one quote line.

    Modelled as a typed list rather than as named fields so a new document type is a new enum
    value rather than a schema change, and so an insurer offering none simply returns an empty
    array.

    URLS MAY BE SHORT-LIVED AND MAY CARRY AUTHORITY. A `continue_application` link in particular
    can resume a quote inside the insurer's own system, so it MUST be treated as a credential:
    consumers MUST NOT log it, embed it in a shared document, or hand it to anyone who is not the
    adviser who requested the quote. An insurer SHOULD set `expires_at` on any link that grants
    access rather than issuing one that lives forever.
  type: object
  required: [document_type, url]
  additionalProperties: false
  properties:
    document_type:
      type: string
      enum:
        # The product disclosure statement for the product written on this line.
        - pds
        # The target market determination, which an adviser needs alongside the PDS.
        - target_market_determination
        # A branded, printable rendering of this quote, produced by the insurer.
        - quote_report
        # A deep link into the insurer's own system that resumes this quote for application.
        - continue_application
        # The application form for this product.
        - application_form
    url:
      type: string
      format: uri
      maxLength: 2048
    media_type:
      description: >-
        The document's media type, e.g. `application/pdf`. Omit for a link to a web page, where
        the answer is `text/html` and saying so adds nothing.
      type: string
      maxLength: 100
    title:
      description: The insurer's own name for the document, for display.
      type: string
      maxLength: 200
    expires_at:
      description: >-
        When the URL stops working. RFC 3339 with an explicit offset. Absent means the insurer
        makes no commitment either way, which a consumer should read as "do not store this".
      type: string
      format: date-time
