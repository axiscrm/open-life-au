# Open Life Data Standards (AU) — Quoting — capability declaration.
#
# This document is what lets a PARTIAL implementation be a CONFORMANT implementation. An insurer
# that writes four of the seven covers, or offers three waiting periods rather than seven, is not
# failing the standard — it is describing its product range, and this is where it does so.
#
# Two consequences worth stating plainly:
#
#   For a consumer, this is what drives the UI. Controls for unsupported covers and unsupported
#   option values can be disabled before the adviser fills them in, rather than producing a 422
#   after the fact.
#
#   For a consumer, this is ALSO only a hint. Capability documents are maintained by hand and
#   they drift: an insurer will declare a combination it cannot actually price. The runtime paths
#   — 422 `unsupported-value` and `resolved_options` with `unsupported_ignored` — remain
#   mandatory, and a consumer MUST NOT rely on this document being complete or correct.

$schema: https://json-schema.org/draft/2020-12/schema

Capabilities:
  title: Capabilities
  description: >-
    What this implementation supports. Cacheable — servers SHOULD send an `ETag` and a
    `Cache-Control` max-age of at least an hour, and consumers SHOULD revalidate rather than
    fetching on every quote.
  type: object
  required: [spec_version, insurer_id, brands, covers]
  additionalProperties: false
  properties:
    spec_version:
      description: >-
        The version of this standard the implementation is built against, as a semver string.
        A consumer compares this against its own to decide which optional features to use.
      type: string
      pattern: '^\d+\.\d+\.\d+$'
      examples: ['0.1.0']
    insurer_id:
      $ref: '../../../../core/schemas/identifiers.yaml#/InsurerId'
    brands:
      description: >-
        The brands this endpoint can price. More than one is normal and is why `brand_id` is
        required on every line even from a single-insurer endpoint.
      type: array
      minItems: 1
      items:
        type: object
        required: [brand_id, name]
        additionalProperties: false
        properties:
          brand_id:
            $ref: '../../../../core/schemas/identifiers.yaml#/BrandId'
          name:
            type: string
            maxLength: 120

    covers:
      description: >-
        One entry per cover type offered. A cover type absent from this array is not offered at
        all, and a request for it MUST be answered with 422 `unsupported-cover`.
      type: array
      minItems: 1
      items:
        $ref: '#/CoverCapability'

    frequencies:
      description: >-
        Which payment frequencies the insurer's own billing supports. Note this does NOT narrow
        the response: `PremiumSet` requires all six regardless, because a consumer compares and
        annualises across insurers. This field says which ones a policy can actually be BILLED
        at.
      type: array
      items:
        $ref: '../../../../core/schemas/cover-vocabulary.yaml#/Frequency'
    split_frequency_supported:
      description: >-
        Whether the superannuation and non-superannuation portions of one policy can be billed at
        different frequencies.
      type: boolean
      default: false

    occupation_resolution:
      description: >-
        Which forms of `OccupationRef` this implementation accepts. `insurer_occupation_id` MUST
        always be supported; the others are optional, and an implementation that supports none of
        the baseline forms requires consumers to resolve an occupation via `/occupations` first.
      type: array
      items:
        type: string
        enum: [insurer_occupation_id, osca, anzsco]
      default: [insurer_occupation_id]
    occupation_qualifiers_used:
      description: >-
        Which `OccupationQualifiers` fields actually affect this insurer's rating. Lets a consumer
        avoid collecting facts that will not change the answer.
      type: array
      items:
        type: string

    max_income_replacement_percent:
      description: >-
        The largest share of the insured's income this insurer will replace across all
        income-based covers combined, as a percentage. Commonly 70.

        Declared so a consumer can keep an adviser inside what is actually issuable while they are
        still typing, rather than discovering it as a declined line after a pricing call. It is a
        CEILING, not a promise: the amount finally offered also depends on occupation, product and
        underwriting, so a request within this figure may still be declined.

        Distinct from the absolute bound the standard places on everyone. A benefit above 100% of
        income is impossible at every insurer and is a 422; a benefit between this figure and 100%
        is a decline here and may be priced by another insurer.

        A CEILING IS TESTED AGAINST THE UNROUNDED FIGURE, on both sides. A consumer converting this
        percentage into a monthly dollar amount MUST round DOWN, and a server MUST compare on exact
        decimal arithmetic rather than rounding the request up first. `income x percent / 12` rarely
        divides evenly, so half-up rounding lands cents over the cap and the benefit is declined for
        a rounding artefact — the insurer simply goes missing from the panel. See rule 1 on
        `QuoteRequest`.
      $ref: '../../../../core/schemas/money.yaml#/Percentage'

    features:
      description: Optional parts of the standard this implementation provides.
      type: object
      additionalProperties: false
      properties:
        loadings_percentage:
          type: boolean
          default: false
        loadings_rate_per_thousand:
          type: boolean
          default: false
        campaigns:
          type: boolean
          default: false
        medical_requirements:
          type: boolean
          default: false
        inclusions:
          type: boolean
          default: false
        idempotency:
          type: boolean
          default: false
        quote_retrieval:
          description: Whether `GET /quotes/{quote_id}` is implemented.
          type: boolean
          default: false
        line_diagnostics:
          description: Whether the per-line unmet-needs diagnostic endpoint is implemented.
          type: boolean
          default: false
        projections:
          description: >-
            Whether `projection` on the request is honoured. An implementation declaring `false`
            that is asked anyway MUST still price the quote — see `ProjectionRequest`.
          type: boolean
          default: false
        projection_indexation:
          description: >-
            Whether a projection can grow sums insured. Separate from `projections` because
            projecting today's cover forward is materially easier than indexing it, and an insurer
            that can do the first is not thereby claiming the second.
          type: boolean
          default: false
        required_features:
          description: >-
            Whether `required_features` is honoured. An implementation declaring `false` MUST
            reject a request carrying one with 422 rather than pricing it unfiltered — a filter
            silently not applied returns products the adviser expressly excluded.
          type: boolean
          default: false
        research_scores:
          description: Whether lines carry third-party research ratings.
          type: boolean
          default: false
        documents:
          description: Whether lines carry documents or application links.
          type: boolean
          default: false

    campaigns:
      description: Campaign variants that can be named in `campaign_codes`.
      type: array
      items:
        type: object
        required: [code, name]
        additionalProperties: false
        properties:
          code:
            type: string
            maxLength: 64
          name:
            type: string
            maxLength: 200
          description:
            type: string
            maxLength: 1000
          requires_authorisation:
            description: >-
              Whether this campaign is only available to consumers specifically authorised for
              it. An unauthorised request for it is a 403, not a silently standard-rated line.
            type: boolean
            default: false

    limits:
      type: object
      additionalProperties: false
      properties:
        max_covers_per_request:
          type: integer
          minimum: 1
        max_concurrent_requests:
          type: integer
          minimum: 1
        target_p95_latency_ms:
          description: >-
            The latency the insurer expects to meet at `max_concurrent_requests`. Consumers of
            several insurers at once fan out in parallel and are bounded by the slowest, so this
            figure determines whether a consumer must apply a shorter timeout than its own
            overall budget.
          type: integer
          minimum: 1

CoverCapability:
  title: CoverCapability
  description: >-
    What one cover type supports. `supported_options` carries VALUE SETS rather than a list of
    field names, so an insurer can narrow an enum — three waiting periods out of seven — without
    the standard needing a new version.
  type: object
  required: [cover_type]
  additionalProperties: false
  properties:
    cover_type:
      $ref: '../../../../core/schemas/cover-vocabulary.yaml#/CoverType'
    ownerships:
      type: array
      items:
        $ref: '../../../../core/schemas/cover-vocabulary.yaml#/Ownership'
    structures:
      type: array
      items:
        $ref: '../../../../core/schemas/cover-vocabulary.yaml#/Structure'
    can_be_standalone:
      type: boolean
      default: true
    can_extend:
      description: >-
        The cover types this cover may be written as an extension of, named with `linked_to`. An
        empty array means it is only available standalone.
      type: array
      items:
        $ref: '../../../../core/schemas/cover-vocabulary.yaml#/CoverType'
      default: []
    min_sum_insured:
      $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
    max_sum_insured:
      $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
    min_age_next_birthday:
      type: integer
      minimum: 0
      maximum: 100
    max_age_next_birthday:
      type: integer
      minimum: 0
      maximum: 100
    commission_bases:
      description: >-
        Which remuneration bases this insurer writes THIS cover on, and the age bounds on each.

        Declared per cover, and separately from `supported_options`, because the restriction it
        describes is neither policy-wide nor a flat value list: the upfront and hybrid bases are
        commonly withdrawn on a benefit above a certain age while remaining available on the rest of
        the same policy. Flattened into a list of permitted values that restriction is
        undeclarable, and a consumer only meets it as a benefit that will not price.

        ABSENT MEANS UNDECLARED, not "no commission bases". An insurer that has not populated this
        says nothing either way, and a consumer MUST fall back to the runtime paths rather than
        reading silence as a restriction — the same hint-not-contract rule that governs the rest of
        this document.
      type: array
      maxItems: 10
      items:
        $ref: '#/CommissionBasisCapability'
      examples:
        - - basis: upfront
            max_age_next_birthday: 61
          - basis: hybrid
            max_age_next_birthday: 61
          - basis: level
    supported_options:
      description: >-
        Permitted values per option field, keyed by the field name as it appears in the cover
        schema. An option field ABSENT from this map is not supported at all for this cover and
        MUST be reported as `unsupported_ignored` if sent.
      type: object
      additionalProperties:
        type: array
        items: {}
      examples:
        - waiting_period: ['30d', '60d', '90d']
          benefit_period: ['2y', 'age_65']
          tpd_definition: [own_occupation, any_occupation, prefer]
    features:
      description: >-
        Named product features that may be required for this cover via `required_features`.

        DISTINCT FROM `supported_options`, and the distinction is the whole point. An option is
        something the consumer asks the insurer to APPLY, and the insurer answers it in
        `resolved_options`. A feature is something the consumer FILTERS on, and the insurer answers
        it by using only products that have it — or by declining the benefit. So the same underlying
        product capability may legitimately appear in both, and they are not interchangeable.

        Codes are the insurer's own and scoped to this cover: the same code under a different cover
        is a different feature, and a code used under the wrong cover MUST be rejected.
      type: array
      maxItems: 200
      items:
        type: object
        required: [code, name]
        additionalProperties: false
        properties:
          code:
            type: string
            maxLength: 64
          name:
            description: The insurer's own wording, for display in a feature picker.
            type: string
            maxLength: 200
          description:
            type: string
            maxLength: 1000
      examples:
        - - code: TRM_TERM_ILL
            name: Terminal illness benefit

CommissionBasisCapability:
  title: CommissionBasisCapability
  description: >-
    One remuneration basis this insurer writes a cover on, with the bounds that apply to it.

    The age bounds are the point of the schema. An adviser sets a policy-wide basis and one benefit
    in the policy falls outside the ages the insurer offers it on, so that benefit alone has to be
    written on another basis — and until a consumer can read this, the only way to learn it is to
    send the quote and interpret a decline. The bounds are read against
    `insured.age_next_birthday`, the same age the cover-level `min_age_next_birthday` and
    `max_age_next_birthday` use.

    Absent bounds mean unbounded: a basis with no `max_age_next_birthday` is offered to the top of
    the cover's own age range.
  type: object
  required: [basis]
  additionalProperties: false
  properties:
    basis:
      $ref: '../../../../core/schemas/commission-vocabulary.yaml#/CommissionBasis'
    min_age_next_birthday:
      type: integer
      minimum: 0
      maximum: 100
    max_age_next_birthday:
      description: >-
        The oldest age next birthday at which this cover is written on this basis. Where an insurer
        offers upfront commission only below a given age and level commission at every age, that is
        two entries, one of them bounded here.
      type: integer
      minimum: 0
      maximum: 100
    max_dial_down_percent:
      description: >-
        The largest dial-down accepted on this basis. Absent means the insurer accepts any
        dial-down up to nil commission.
      $ref: '../../../../core/schemas/money.yaml#/SharePercentage'
  examples:
    - basis: upfront
      max_age_next_birthday: 61
    - basis: level
