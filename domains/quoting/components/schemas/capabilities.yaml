# Open Life Data Standards (AU) — Quoting — capability declaration.
#
# This document is what lets a PARTIAL implementation be a CONFORMANT implementation. An insurer
# that writes four of the seven covers, or offers three waiting periods rather than seven, is not
# failing the standard — it is describing its product range, and this is where it does so.
#
# Two consequences worth stating plainly:
#
#   For a consumer, this is what drives the UI. Controls for unsupported covers and unsupported
#   option values can be disabled before the adviser fills them in, rather than producing a 422
#   after the fact.
#
#   For a consumer, this is ALSO only a hint. Capability documents are maintained by hand and
#   they drift: an insurer will declare a combination it cannot actually price. The runtime paths
#   — 422 `unsupported-value` and `resolved_options` with `unsupported_ignored` — remain
#   mandatory, and a consumer MUST NOT rely on this document being complete or correct.

$schema: https://json-schema.org/draft/2020-12/schema

Capabilities:
  title: Capabilities
  description: >-
    What this implementation supports. Cacheable — servers SHOULD send an `ETag` and a
    `Cache-Control` max-age of at least an hour, and consumers SHOULD revalidate rather than
    fetching on every quote.
  type: object
  required: [spec_version, insurer_id, brands, covers]
  additionalProperties: false
  properties:
    spec_version:
      description: >-
        The version of this standard the implementation is built against, as a semver string.
        A consumer compares this against its own to decide which optional features to use.
      type: string
      pattern: '^\d+\.\d+\.\d+$'
      examples: ['0.1.0']
    insurer_id:
      $ref: '../../../../core/schemas/identifiers.yaml#/InsurerId'
    brands:
      description: >-
        The brands this endpoint can price. More than one is normal and is why `brand_id` is
        required on every line even from a single-insurer endpoint.
      type: array
      minItems: 1
      items:
        type: object
        required: [brand_id, name]
        additionalProperties: false
        properties:
          brand_id:
            $ref: '../../../../core/schemas/identifiers.yaml#/BrandId'
          name:
            type: string
            maxLength: 120

    covers:
      description: >-
        One entry per cover type offered. A cover type absent from this array is not offered at
        all, and a request for it MUST be answered with 422 `unsupported-cover`.
      type: array
      minItems: 1
      items:
        $ref: '#/CoverCapability'

    frequencies:
      description: >-
        Which payment frequencies this insurer quotes and bills at. `monthly` and `annual` are
        always among them, because `PremiumSet` requires both on every priced line.

        THIS NOW MATCHES THE RESPONSE, where an earlier version of this standard said it did not.
        `PremiumSet` used to require all six frequencies whatever an insurer actually sold, so this
        field described billing while the response described something else — and an insurer with no
        weekly product had to return a weekly premium anyway. The response now carries the
        frequencies the insurer quotes and names the rest in `PremiumSet.not_quoted`, so the two
        agree and this field is the pre-quote form of the same fact.

        Read it the way the rest of this document is read: a hint that lets a consumer build the
        frequency control before the first pricing call, not an authority. `PremiumSet` on the line
        is what actually governs, and a consumer MUST NOT derive a frequency it finds here but not
        there.
      type: array
      items:
        $ref: '../../../../core/schemas/cover-vocabulary.yaml#/Frequency'
    split_frequency_supported:
      description: >-
        Whether the superannuation and non-superannuation portions of one policy can be billed at
        different frequencies.
      type: boolean
      default: false

    occupation_resolution:
      description: >-
        Which forms of `OccupationRef` this implementation accepts. `insurer_occupation_id` MUST
        always be supported; the others are optional, and an implementation that supports none of
        the baseline forms requires consumers to resolve an occupation via `/occupations` first.
      type: array
      items:
        type: string
        enum: [insurer_occupation_id, osca, anzsco]
      default: [insurer_occupation_id]
    commission_resolution:
      description: >-
        Which forms of `CommissionRequest` this implementation accepts. `basis` MUST always be
        supported — it is the portable form and the one a consumer can send without reading anything
        first. `insurer_commission_id` is optional, and an implementation that accepts it MUST publish
        the ids in `commission_bases[].options` on the covers it writes: an id space a consumer cannot
        enumerate is one it cannot use.

        Declared for the same reason `occupation_resolution` is: a consumer sending a form the insurer
        does not take gets a 422 rather than a quote, and finding that out from the capability document
        is cheaper than finding it out from the pricing call.
      type: array
      items:
        type: string
        enum: [basis, insurer_commission_id]
      default: [basis]
    feature_resolution:
      description: >-
        Which forms of feature code this implementation accepts in `required_features`. `standard`
        MUST always be supported — it is the portable form, and the only one a consumer can send to
        a panel without first reading each insurer's own declarations.

        `insurer_code` is optional, and an implementation that accepts it MUST publish those codes
        in `features` on the covers it writes, and in `policy_features`: an identifier space a
        consumer cannot enumerate is one it cannot use.

        Declared for the same reason `occupation_resolution` and `commission_resolution` are —
        finding out from the capability document costs nothing, and finding out from a declined
        line costs a pricing call and an adviser's confusion.
      type: array
      items:
        type: string
        enum: [standard, insurer_code]
      default: [standard]

    policy_features:
      description: >-
        Features that describe the POLICY rather than one benefit within it, requestable under the
        `policy` key of `required_features`.

        Separate from `covers[].features` because these are not cover-scoped: a policy either is
        guaranteed renewable or it is not, and declaring it under each of seven covers would make
        one fact seven filters that must all be ticked together. A policy-level fact is declared
        once.
      type: array
      maxItems: 100
      items:
        type: object
        required: [code, name]
        additionalProperties: false
        properties:
          code:
            type: string
            maxLength: 64
          standard_feature:
            description: >-
              The portable code from `taxonomy/product-features.yaml`, which MUST be one listed under
              `policy` in that file.
            type: string
            maxLength: 64
          name:
            type: string
            maxLength: 200
          description:
            type: string
            maxLength: 1000
      examples:
        - - code: GTD_RENEW
            standard_feature: guaranteed_renewable
            name: Guaranteed renewable

    occupation_qualifiers_used:
      description: >-
        Which `OccupationQualifiers` fields actually affect this insurer's rating. Lets a consumer
        avoid collecting facts that will not change the answer.
      type: array
      items:
        type: string

    max_income_replacement_percent:
      description: >-
        The largest share of the insured's income this insurer will replace across all
        income-based covers combined, as a percentage. Commonly 70.

        Declared so a consumer can keep an adviser inside what is actually issuable while they are
        still typing, rather than discovering it as a declined line after a pricing call. It is a
        CEILING, not a promise: the amount finally offered also depends on occupation, product and
        underwriting, so a request within this figure may still be declined.

        Distinct from the absolute bound the standard places on everyone. A benefit above 100% of
        income is impossible at every insurer and is a 422; a benefit between this figure and 100%
        is a decline here and may be priced by another insurer.

        A CEILING IS TESTED AGAINST THE UNROUNDED FIGURE, on both sides. A consumer converting this
        percentage into a monthly dollar amount MUST round DOWN, and a server MUST compare on exact
        decimal arithmetic rather than rounding the request up first. `income x percent / 12` rarely
        divides evenly, so half-up rounding lands cents over the cap and the benefit is declined for
        a rounding artefact — the insurer simply goes missing from the panel. See rule 1 on
        `QuoteRequest`.
      $ref: '../../../../core/schemas/money.yaml#/Percentage'

    features:
      description: Optional parts of the standard this implementation provides.
      type: object
      additionalProperties: false
      properties:
        loadings_percentage:
          type: boolean
          default: false
        loadings_rate_per_thousand:
          type: boolean
          default: false
        campaigns:
          type: boolean
          default: false
        medical_requirements:
          type: boolean
          default: false
        inclusions:
          type: boolean
          default: false
        idempotency:
          type: boolean
          default: false
        quote_retrieval:
          description: Whether `GET /quotes/{quote_id}` is implemented.
          type: boolean
          default: false
        line_diagnostics:
          description: Whether the per-line unmet-needs diagnostic endpoint is implemented.
          type: boolean
          default: false
        projections:
          description: >-
            Whether `projection` on the request is honoured. An implementation declaring `false`
            that is asked anyway MUST still price the quote — see `ProjectionRequest`.
          type: boolean
          default: false
        projection_indexation:
          description: >-
            Whether a projection can grow sums insured. Separate from `projections` because
            projecting today's cover forward is materially easier than indexing it, and an insurer
            that can do the first is not thereby claiming the second.
          type: boolean
          default: false
        required_features:
          description: >-
            Whether `required_features` is honoured. An implementation declaring `false` MUST
            reject a request carrying one with 422 rather than pricing it unfiltered — a filter
            silently not applied returns products the adviser expressly excluded.
          type: boolean
          default: false
        research_scores:
          description: Whether lines carry third-party research ratings.
          type: boolean
          default: false
        documents:
          description: Whether lines carry documents or application links.
          type: boolean
          default: false

    campaigns:
      description: Campaign variants that can be named in `campaign_codes`.
      type: array
      items:
        type: object
        required: [code, name]
        additionalProperties: false
        properties:
          code:
            type: string
            maxLength: 64
          name:
            type: string
            maxLength: 200
          description:
            type: string
            maxLength: 1000
          requires_authorisation:
            description: >-
              Whether this campaign is only available to consumers specifically authorised for
              it. An unauthorised request for it is a 403, not a silently standard-rated line.
            type: boolean
            default: false

    limits:
      type: object
      additionalProperties: false
      properties:
        max_covers_per_request:
          type: integer
          minimum: 1
        max_concurrent_requests:
          type: integer
          minimum: 1
        target_p95_latency_ms:
          description: >-
            The latency the insurer expects to meet at `max_concurrent_requests`. Consumers of
            several insurers at once fan out in parallel and are bounded by the slowest, so this
            figure determines whether a consumer must apply a shorter timeout than its own
            overall budget.
          type: integer
          minimum: 1

CoverCapability:
  title: CoverCapability
  description: >-
    What one cover type supports. `supported_options` carries VALUE SETS rather than a list of
    field names, so an insurer can narrow an enum — three waiting periods out of seven — without
    the standard needing a new version.
  type: object
  required: [cover_type]
  additionalProperties: false
  properties:
    cover_type:
      $ref: '../../../../core/schemas/cover-vocabulary.yaml#/CoverType'
    ownerships:
      type: array
      items:
        $ref: '../../../../core/schemas/cover-vocabulary.yaml#/Ownership'
    structures:
      type: array
      items:
        $ref: '../../../../core/schemas/cover-vocabulary.yaml#/Structure'
    can_be_standalone:
      type: boolean
      default: true
    can_extend:
      description: >-
        The cover types this cover may be written as an extension of, named with `linked_to`. An
        empty array means it is only available standalone.
      type: array
      items:
        $ref: '../../../../core/schemas/cover-vocabulary.yaml#/CoverType'
      default: []
    min_sum_insured:
      $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
    max_sum_insured:
      $ref: '../../../../core/schemas/money.yaml#/NonNegativeMoney'
    min_age_next_birthday:
      type: integer
      minimum: 0
      maximum: 100
    max_age_next_birthday:
      type: integer
      minimum: 0
      maximum: 100
    commission_bases:
      description: >-
        Which remuneration bases this insurer writes THIS cover on, and the age bounds on each.

        Declared per cover, and separately from `supported_options`, because the restriction it
        describes is neither policy-wide nor a flat value list: the upfront and hybrid bases are
        commonly withdrawn on a benefit above a certain age while remaining available on the rest of
        the same policy. Flattened into a list of permitted values that restriction is
        undeclarable, and a consumer only meets it as a benefit that will not price.

        ABSENT MEANS UNDECLARED, not "no commission bases". An insurer that has not populated this
        says nothing either way, and a consumer MUST fall back to the runtime paths rather than
        reading silence as a restriction — the same hint-not-contract rule that governs the rest of
        this document.
      type: array
      maxItems: 10
      items:
        $ref: '#/CommissionBasisCapability'
      examples:
        - - basis: upfront
            max_age_next_birthday: 61
          - basis: hybrid
            max_age_next_birthday: 61
          - basis: level
    supported_options:
      description: >-
        Permitted values per option field, keyed by the field name as it appears in the cover
        schema. An option field ABSENT from this map is not supported at all for this cover and
        MUST be reported as `unsupported_ignored` if sent.
      type: object
      additionalProperties:
        type: array
        items: {}
      examples:
        # An insurer whose product is published in days.
        - waiting_period: ['30d', '60d', '90d']
          benefit_period: ['2y', 'age_65']
          tpd_definition: [own_occupation, any_occupation, prefer]
        # And one whose product is published in weeks. The two are declaring different terms of
        # contract, not the same ones in different units — see `WaitingPeriod`.
        - waiting_period: ['4w', '8w', '13w', '26w']
          benefit_period: ['2y', '5y', 'age_65']
          tpd_definition: [own_occupation, any_occupation]
    features:
      description: >-
        Named product features that may be required for this cover via `required_features`.

        DISTINCT FROM `supported_options`, and the distinction is the whole point. An option is
        something the consumer asks the insurer to APPLY, and the insurer answers it in
        `resolved_options`. A feature is something the consumer FILTERS on, and the insurer answers
        it by using only products that have it — or by declining the benefit. So the same underlying
        product capability may legitimately appear in both, and they are not interchangeable.

        `code` is the insurer's own and is scoped to this cover. `standard_feature` is the portable
        equivalent from `taxonomy/product-features.yaml` where one exists, and publishing it is what lets a
        consumer send ONE request to a whole panel instead of translating per insurer. Publish it
        wherever the mapping is honest; omit it where the insurer's benefit genuinely is not the
        standard one, because a wrong mapping here is worse than none — it produces a filter that
        silently selects the wrong products.

        Both `code` and `name` stay REQUIRED. An implementation with no identifiers of its own
        can use the standard code as its `code` — one duplicated string, against making a field
        every consumer already reads optional.

        POLICY-LEVEL FEATURES DO NOT BELONG HERE. `guaranteed_renewable` describes the policy, not
        one benefit inside it; declare those in `policy_features` on the document rather than
        repeating them under every cover.
      type: array
      maxItems: 200
      items:
        type: object
        required: [code, name]
        additionalProperties: false
        properties:
          code:
            description: The insurer's own identifier for this feature, scoped to this cover.
            type: string
            maxLength: 64
          standard_feature:
            description: >-
              The portable code from `taxonomy/product-features.yaml` this feature corresponds to, where it
              corresponds to one. It MUST be a code that file lists for this cover.
            type: string
            maxLength: 64
          name:
            description: The insurer's own wording, for display in a feature picker.
            type: string
            maxLength: 200
          description:
            type: string
            maxLength: 1000
      examples:
        - - code: TRM_TERM_ILL
            standard_feature: terminal_illness_benefit
            name: Terminal illness benefit
          # No standard equivalent — the insurer's own code is the only way to name it.
          - code: NEO_FUNERAL_ADV
            name: Funeral advancement

InsurerCommissionOption:
  title: InsurerCommissionOption
  description: >-
    One commission option on an insurer's own list, addressable by `insurer_commission_id`.

    The same shape of thing as an `InsurerOccupation` row: the insurer's identifier, the insurer's own
    label, and what this standard can say about it in portable terms. Where the portable terms do not
    reach — the arrangements described on `options` — the id is the only way to name it, and the
    `name` is what an adviser has to be shown instead of a percentage.
  type: object
  required: [insurer_commission_id]
  additionalProperties: false
  properties:
    insurer_commission_id:
      description: >-
        The insurer's own identifier for this option, to send in `CommissionRequest`. Opaque, and
        scoped to this insurer — the same string may name a different option at another insurer, so a
        consumer MUST NOT carry one across a panel.
      type: string
      minLength: 1
      maxLength: 128
    name:
      description: >-
        The insurer's own label, for display. NON-NORMATIVE: a consumer MUST NOT parse it. Real labels
        include `Upfront (66/22)`, `Hybrid: 75%` and `P90 Upfront`, which are three unrelated
        conventions — the first names the two rates, the second the share retained, the third a
        premium factor. Anything derived from that string is a guess.
      type: string
      maxLength: 200
    dial_down_percent:
      description: >-
        What this option is in portable terms: the share of the insurer's standard commission for this
        basis that is GIVEN UP.

        ABSENT IS MEANINGFUL. It says this option is not a dial-down of the standard at all, and
        therefore cannot be requested as `basis` plus a percentage — only by id. An insurer MUST NOT
        approximate one here to fill the field in, because a consumer reading it would then send that
        approximation and be priced on something else.
      $ref: '../../../../core/schemas/money.yaml#/SharePercentage'
  examples:
    - insurer_commission_id: UF-100
      name: Upfront (66/22)
      dial_down_percent: '0'
    - insurer_commission_id: UF-0-22
      name: Upfront (0/22)

CommissionBasisCapability:
  title: CommissionBasisCapability
  description: >-
    One remuneration basis this insurer writes a cover on, with the bounds that apply to it.

    The age bounds are the point of the schema. An adviser sets a policy-wide basis and one benefit
    in the policy falls outside the ages the insurer offers it on, so that benefit alone has to be
    written on another basis — and until a consumer can read this, the only way to learn it is to
    send the quote and interpret a decline. The bounds are read against
    `insured.age_next_birthday`, the same age the cover-level `min_age_next_birthday` and
    `max_age_next_birthday` use.

    Absent bounds mean unbounded: a basis with no `max_age_next_birthday` is offered to the top of
    the cover's own age range.
  type: object
  required: [basis]
  additionalProperties: false
  properties:
    basis:
      $ref: '../../../../core/schemas/commission-vocabulary.yaml#/CommissionBasis'
    min_age_next_birthday:
      type: integer
      minimum: 0
      maximum: 100
    max_age_next_birthday:
      description: >-
        The oldest age next birthday at which this cover is written on this basis. Where an insurer
        offers upfront commission only below a given age and level commission at every age, that is
        two entries, one of them bounded here.
      type: integer
      minimum: 0
      maximum: 100
    max_dial_down_percent:
      description: >-
        The largest dial-down accepted on this basis. Absent means the insurer accepts any
        dial-down up to nil commission.

        A summary for an insurer that does not enumerate `options`. Where it does, this is derivable
        from them and may be omitted.
      $ref: '../../../../core/schemas/money.yaml#/SharePercentage'
    options:
      description: >-
        The individual commission options this insurer writes on this basis — its own ladder,
        published so a consumer can stop guessing at it.

        ## What this is for, in two quite different ways

        **Rounding.** A dial-down is only writable at the steps the insurer publishes, and a request
        between two of them rounds down (see `CommissionRequest.dial_down_percent`). Reading the steps
        from here lets a consumer send a figure that needs no rounding at all, which is the difference
        between a premium an adviser can explain and one they have to be told about afterwards.

        **Exactness.** An option whose `dial_down_percent` is ABSENT cannot be expressed as a basis
        plus a share at all — an upfront rate with no initial payment, an upfront paid in the first
        year only, a level rate above the insurer's standard. Those are real published options, and
        the only way to ask for one is `insurer_commission_id`.

        ABSENT MEANS UNENUMERATED, not "no options". An insurer that publishes nothing here is not
        saying it has a single option; it is saying a consumer must use the portable form and be
        ready for a `substituted` dial-down. The same hint-not-contract rule governs this as the rest
        of the document.

        A LADDER IS SMALL. Every insurer examined publishes between five and fifteen options in
        total, which is why they sit in this document rather than behind an endpoint of their own the
        way occupations do — there, per-insurer lists run to a thousand rows and a consumer must
        search them.
      type: array
      maxItems: 40
      items:
        $ref: '#/InsurerCommissionOption'
  examples:
    - basis: upfront
      max_age_next_birthday: 61
    - basis: level
