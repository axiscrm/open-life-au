# Open Life Data Standards (AU) — Quoting — the request.
#
# The shape follows a quote screen top to bottom: who is being insured, the answers that apply to
# the whole policy, then one section per benefit. An adviser does not restate the premium
# structure for every cover, so neither does this schema — policy-level answers are given once
# and inherited, and a cover overrides only where it differs.

$schema: https://json-schema.org/draft/2020-12/schema

QuoteRequest:
  title: QuoteRequest
  description: >-
    A request to price one or more covers for one insured. A response to this is a set of priced
    lines, not a single price: an insurer may return several lines for one request where it has
    more than one brand, product combination or campaign variant that satisfies the covers asked
    for.
  type: object
  required: [insured, covers]
  additionalProperties: false
  properties:
    client_reference:
      $ref: '../../../../core/schemas/identifiers.yaml#/ClientReference'
    insured:
      $ref: '../../../../core/schemas/party.yaml#/Insured'
    policy:
      $ref: '#/PolicyDefaults'
    covers:
      description: >-
        The covers to price. Only covers the adviser has switched on appear here — an absent
        cover type is not requested, and there is no "included: false" form.

        `cover_id` MUST be unique across the array. Where a cover names a parent with
        `linked_to`, the parent MUST also be present; order within the array is NOT significant
        and a server MUST NOT require parents to appear first.
      type: array
      minItems: 1
      maxItems: 20
      items:
        $ref: 'covers.yaml#/CoverRequest'
    campaign_codes:
      description: >-
        Campaign or discount variants to price in ADDITION to the insurer's standard rates. Each
        requested campaign the insured qualifies for yields its own line, so the adviser can
        compare the standard offer against the discounted one rather than being silently given
        whichever is cheaper. An empty array or an absent field means standard rates only.

        Codes are the insurer's own, discoverable from its capability document. An unknown code
        is a 422 rather than being ignored, so a mistyped campaign cannot look like an
        ineligible one.
      type: array
      maxItems: 20
      items:
        type: string
        maxLength: 64
      default: []
    required_features:
      $ref: '#/RequiredFeatures'
    projection:
      $ref: '#/ProjectionRequest'
  examples:
    - client_reference: 'c:8f14e45fceea167a'
      insured:
        age_next_birthday: 41
        gender: male
        smoker: false
        state: NSW
        employment_status: employee
        annual_income: { amount: '145000.00', currency: AUD }
        occupation:
          osca: '3323-11'
          description: Painter
          qualifiers: { trade_qualified: true, working_height_m: 10, manual_duties_percent: 80 }
      policy:
        structure: stepped
        ownership: super
        premium_waiver: exclude
      covers:
        - cover_id: life-1
          cover_type: life
          sum_insured: { amount: '1000000.00', currency: AUD }
        - cover_id: tpd-ext-1
          cover_type: tpd
          linked_to: life-1
          link_type: extension
          sum_insured: { amount: '750000.00', currency: AUD }
          ownership: ordinary
          tpd_definition: any_occupation
          life_buyback: after_1_year

PolicyDefaults:
  title: PolicyDefaults
  description: >-
    The answers that apply to the policy as a whole. Every field is optional and every field has
    a defined default, so a minimal request is valid; a cover may override any of them for
    itself.

    On a quote screen these controls are usually drawn inside the first benefit's panel, because
    that is where an adviser looks for them. They are hoisted here deliberately: an insurer
    should not have to know that the policy-wide premium structure is to be read off the life
    cover.
  type: object
  additionalProperties: false
  properties:
    structure:
      description: Default premium structure for every cover. Defaults to `stepped`.
      $ref: '../../../../core/schemas/cover-vocabulary.yaml#/Structure'
      default: stepped
    ownership:
      description: Default ownership for every cover. Defaults to `ordinary`.
      $ref: '../../../../core/schemas/cover-vocabulary.yaml#/Ownership'
      default: ordinary
    premium_waiver:
      description: Default waiver-of-premium answer for every cover. Defaults to `exclude`.
      $ref: '../../../../core/schemas/cover-vocabulary.yaml#/PremiumWaiver'
      default: exclude
    loadings:
      $ref: '#/Loadings'

CoverLoadings:
  title: CoverLoadings
  description: >-
    Loadings for a single cover, on the same two independent axes as the policy-level map. Both may
    apply at once.
  type: object
  additionalProperties: false
  properties:
    percentage:
      description: A percentage uplift on this cover's risk premium.
      $ref: '../../../../core/schemas/money.yaml#/Percentage'
    rate_per_thousand:
      description: A flat dollar amount per $1,000 of sum insured, added to this cover's risk premium.
      $ref: '../../../../core/schemas/money.yaml#/RatePerThousand'

Loadings:
  title: Loadings
  description: >-
    Underwriting loadings the adviser expects the insurer to apply, expressed per benefit on two
    independent axes. Both axes may apply to the same benefit, in which case the insurer applies
    both.

    SPARSE-MAP SEMANTICS, NORMATIVE. These maps are sparse and every present key is meaningful:

      - a benefit ABSENT from a map carries no loading on that axis;
      - a benefit present with a value of `'0'` carries an EXPLICIT nil loading.

    The two are NOT interchangeable. An implementation MUST NOT normalise a `'0'` into an omission
    or an omission into a `'0'`, and MUST NOT reject `'0'` as pointless — a consumer sends it to
    state positively that this benefit is not loaded, which is a different instruction from
    declining to say. JSON Schema cannot express this constraint, which is precisely why it is
    stated here and tested by the conformance suite.

    Keys are `CoverType` values, restricted to the five benefits a loading can attach to.
    Needle stick and child trauma have no loading axis and MUST be rejected as keys.

    A key names a cover TYPE, so it applies to EVERY cover of that type in the request. Where a request
    holds two covers of one type and they need different loadings, set `loadings` on the individual
    covers instead — a cover-level entry replaces the policy-level one for that cover.

    A key naming a cover type not present in `covers` MUST be rejected with 422 `invalid-combination`
    rather than silently ignored: it is far more likely to be a mistake than an intention.
  type: object
  additionalProperties: false
  properties:
    percentage:
      description: >-
        A percentage uplift on the risk premium for that benefit. `'25'` means the premium is
        loaded by 25%.
      type: object
      additionalProperties: false
      propertyNames:
        enum: [life, tpd, trauma, income_protection, business_expenses]
      patternProperties:
        '^(life|tpd|trauma|income_protection|business_expenses)$':
          $ref: '../../../../core/schemas/money.yaml#/Percentage'
    rate_per_thousand:
      description: >-
        A flat dollar amount per $1,000 of sum insured, added to the risk premium for that
        benefit. Not applicable to the monthly-benefit covers on every product; insurers report
        an inapplicable axis via `resolved_options`.
      type: object
      additionalProperties: false
      propertyNames:
        enum: [life, tpd, trauma, income_protection, business_expenses]
      patternProperties:
        '^(life|tpd|trauma|income_protection|business_expenses)$':
          $ref: '../../../../core/schemas/money.yaml#/RatePerThousand'
  examples:
    - percentage: { life: '50', trauma: '0' }
      rate_per_thousand: { life: '1.50' }

RequiredFeatures:
  title: RequiredFeatures
  description: >-
    Product features the insured requires, as a filter on which products may be used. A product
    that does not offer every feature named for a benefit MUST NOT be used to write that benefit.

    THIS IS A FILTER, NOT AN OPTION. The difference matters: an option asks the insurer to add
    something and is answered in `resolved_options`; a filter narrows the product set BEFORE
    pricing, so the honest answer to "no product has this" is a line with `all_needs_met: false`
    and a populated `errors`, not a cheaper line quietly written without the feature. An insurer
    MUST NOT satisfy a required feature by ignoring it.

    Keys are `CoverType` values, and the codes under each are the insurer's own, discoverable from
    `features` on that cover in the capability document. A code that is unknown to the insurer, or
    that is not scoped to the benefit it appears under, MUST be rejected with 422
    `unsupported-value` rather than ignored — an adviser filtering on "must include terminal
    illness" and silently getting products without it is the failure this exists to prevent.

    Absent or empty means no filter, which is the overwhelmingly common case.
  type: object
  additionalProperties: false
  propertyNames:
    enum: [life, tpd, trauma, income_protection, business_expenses, needle_stick, child_trauma]
  patternProperties:
    '^(life|tpd|trauma|income_protection|business_expenses|needle_stick|child_trauma)$':
      type: array
      minItems: 1
      maxItems: 20
      items:
        type: string
        maxLength: 64
  examples:
    - trauma: ['TRM_TERM_ILL']
      income_protection: ['INC_DAY1_ACCIDENT']

ProjectionRequest:
  title: ProjectionRequest
  description: >-
    Ask for the cost of each line projected forward, as well as its price today.

    Needed because a stepped premium rises every year, so the first-year price is a poor basis for
    a recommendation and a level premium that looks dear today is often cheaper over the term an
    adviser is actually advising on. Comparing two structures on their first-year premiums alone
    is the mis-comparison this exists to remove.

    Optional to implement. An insurer that cannot project declares `projections: false` in its
    capability document; if it is asked anyway it MUST price the quote normally, omit `projection`
    from every line, and report it once in `resolved_options` with `option: projection` and
    `unsupported_ignored`, rather than failing the quote.
  type: object
  additionalProperties: false
  oneOf:
    - required: [years]
    - required: [to_age]
  properties:
    years:
      description: Project this many years forward, inclusive of the current year.
      type: integer
      minimum: 1
      maximum: 50
    to_age:
      description: >-
        Project to the insured's stated age. Where this is at or below the insured's current age
        the request is a 422 `invalid-combination` — an empty projection is not a useful answer.
      type: integer
      minimum: 1
      maximum: 100
    indexation:
      description: >-
        Whether to grow each cover's sum insured over the projection, and by how much.

        Absent means no indexation: the projection prices today's sums insured at each future age,
        which is what "what will this policy cost me at 55" asks. Present, it prices a policy whose
        cover keeps pace, which is a different and equally legitimate question — but the two are
        not comparable, so an insurer MUST report which it applied.
      $ref: '#/ProjectionIndexation'
  examples:
    - years: 10
    - to_age: 65
      indexation: { rate: '5' }

ProjectionIndexation:
  title: ProjectionIndexation
  description: >-
    How sums insured grow across a projection. A single rate applies to every cover that can be
    indexed.

    Not every benefit can be. Where a product does not index a cover the insurer MUST say so in
    `excluded_covers` on the projection it returns, rather than silently projecting a flat sum
    insured inside an indexed projection — the totals would otherwise be unattributable.
  type: object
  required: [rate]
  additionalProperties: false
  properties:
    rate:
      description: >-
        Annual indexation rate as a percentage. `'5'` grows each indexed sum insured by 5% a year,
        compounding.
      $ref: '../../../../core/schemas/money.yaml#/Percentage'
