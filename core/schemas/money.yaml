# Open Life Data Standards (AU) — money primitives.
#
# Pure JSON Schema 2020-12, no OpenAPI-only keywords, so this file is consumable by the
# OpenAPI contracts, the AsyncAPI event contracts, and standalone validators alike.
#
# Amounts are DECIMAL STRINGS, never JSON numbers. Premiums are summed, compared and stored
# to the cent; a JSON number is an IEEE-754 double in JavaScript and in most generated
# clients, and float drift in a premium comparison table is a compliance defect rather than
# a rounding nit. Strings round-trip exactly through Python `Decimal` and Java `BigDecimal`.

$schema: https://json-schema.org/draft/2020-12/schema

Decimal:
  title: Decimal
  description: >-
    A fixed-point decimal amount serialised as a string, with at most two fractional digits.
    Scientific notation, thousands separators, currency symbols and leading `+` are not
    permitted. Implementations MUST NOT normalise `"0.00"` to `"0"` or vice versa when
    echoing a value back — but consumers MUST treat the two as numerically equal.
  type: string
  pattern: '^-?\d{1,12}(\.\d{1,2})?$'
  examples:
    - '1234.56'
    - '0'
    - '-19.95'

Money:
  title: Money
  description: >-
    An amount of money. Currency is carried explicitly even though this standard is
    Australia-only, so a future market does not become a breaking change.
  type: object
  required: [amount, currency]
  additionalProperties: false
  properties:
    amount:
      $ref: '#/Decimal'
    currency:
      title: CurrencyCode
      description: ISO 4217 alphabetic code. Only AUD is defined by this version of the standard.
      type: string
      const: AUD
  examples:
    - amount: '1000000.00'
      currency: AUD

NonNegativeMoney:
  title: NonNegativeMoney
  description: >-
    Money that cannot be negative — sums insured, premiums, stamp duty, policy fees. A
    negative value here is always a defect, so it is rejected at the schema boundary rather
    than surfacing as a nonsensical premium.
  allOf:
    - $ref: '#/Money'
    - properties:
        amount:
          type: string
          pattern: '^\d{1,12}(\.\d{1,2})?$'

Percentage:
  title: Percentage
  description: >-
    A percentage serialised as a decimal string (not a 0-1 ratio): `'25'` means 25%. At most
    three fractional digits, and at most 1000.

    A string for the same reason as `Decimal` and `RatePerThousand`. This was a JSON number
    until 0.2.0, justified on the grounds that percentages are inputs to arithmetic rather
    than amounts stored to the cent, and that three decimal places are exactly representable.
    The second half of that is not true: `0.001` has no exact IEEE-754 representation, so a
    loading of `25.001` arrives as `25.000999...` in every generated client. More to the
    point, the reasoning proved too clever — a loading percentage IS an input to pricing, and
    it was the one remaining path by which a contract value reached a rating engine through a
    double while every amount beside it travelled as a string. The inconsistency was visible
    in this very file: `RatePerThousand` is the OTHER axis of the same loadings map and was
    always a string.

    `'0'` is a MEANINGFUL value — see the loadings schema, where an explicit zero cancels an
    inherited loading and is not the same as omitting the field. Implementations MUST NOT
    normalise `'0'` to `'0.000'` or vice versa when echoing a value back, and consumers MUST
    treat the two as numerically equal.
  type: string
  pattern: '^(1000(\.0{1,3})?|\d{1,3}(\.\d{1,3})?)$'
  examples: ['0', '25', '62.5', '12.375']

SharePercentage:
  title: SharePercentage
  description: >-
    A percentage that is a SHARE OF A WHOLE, and therefore cannot exceed 100 — a commission
    dial-down, a split between advisers. Serialised exactly as `Percentage`, with a narrower range.

    Separate from `Percentage` because that schema deliberately allows up to 1000: an underwriting
    loading of 400% is a real thing an adviser is told, and the bound there exists to catch a units
    mistake rather than to describe a share. Reuse it for a share and `'900'` validates, and there
    is no reading of that value which is not a defect. The policy contract already shipped this
    mistake once — a commission split inheriting the generic schema, so a 900% split passed — which
    is why the narrower type exists rather than the bound being restated at each call site.
  type: string
  pattern: '^(100(\.0{1,3})?|\d{1,2}(\.\d{1,3})?)$'
  examples: ['0', '30', '12.5', '100']

RatePerThousand:
  title: RatePerThousand
  description: >-
    A dollar rate applied per $1,000 of sum insured, the second axis on which underwriting
    loadings are expressed. Serialised as a decimal string for the same reason as `Decimal`.
  type: string
  pattern: '^\d{1,6}(\.\d{1,2})?$'
  examples: ['0', '1.50', '12.00']
