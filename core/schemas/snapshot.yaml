# Open Life Data Standards (AU) — the snapshot envelope.
#
# THIS FILE IS WHERE ABSENCE IS MADE SAFE, FOR EVERY CONTRACT THAT PAGES A COMPLETE SET.
#
# Several contracts here hand a consumer the whole of something — the in-force book, the arrears
# worklist, the outstanding underwriting requirements — and invite it to reconcile against what it
# already holds: rows that are new get added, rows that changed get updated, and rows that have
# DISAPPEARED are taken to be gone. That last rule is what makes a snapshot worth more than a change
# feed. No tombstones, no missed-event problem, and a bad run is self-correcting because the next one
# restates the truth.
#
# It is also the dangerous rule, and it fails the same way in every domain. A snapshot arrives over
# many pages, and a walk that stops halfway — a timeout, a 500 on page nine, an expired cursor —
# makes everything on the unfetched pages look ABSENT. Reconcile off that and a consumer lapses most
# of a book, or closes every outstanding requirement, from a response that is well-formed, valid and
# catastrophic.
#
# So the rules live here, once, rather than being restated per contract. They were written for the
# policy snapshot and generalised when the arrears worklist needed them verbatim; a third copy would
# have guaranteed that one drifted, and the copy that drifts is the one somebody's reconciliation
# gate was built against.
#
# A collection using these MUST require all five on every page. They were optional in an early draft
# of the policy contract, which made the central safety rule unenforceable: `{items: [], complete:
# true}` validated, passed every check the contract told a consumer to make, and would have emptied
# a book. An implementation that can produce a complete snapshot knows its own size, so requiring
# them costs nothing and closes the hole.
#
# DO NOT wrap these in a `$ref`-only named schema to add a description. A schema whose body is just
# a `$ref` plus a title bundles into a second copy of the target, and openapi-python-client
# deduplicates models by title — it drops the wrapper and then drops every page schema referencing
# it, while exiting 0. Put the description on the referencing property instead.

$schema: https://json-schema.org/draft/2020-12/schema

SnapshotMode:
  title: SnapshotMode
  description: >-
    Whether this response is a FULL snapshot or an INCREMENTAL delta.

    Required, and load-bearing. Without it the two are byte-indistinguishable: an incremental
    response carries the same envelope, the same `complete: true`, and a `total_count` that matches
    the handful of changed records — so it passes every reconciliation gate, and a consumer that
    applies it will remove everything that did not happen to change. A stray `changed_since` from
    configuration or a retry wrapper is enough to trigger it.

    **Absence carries NO meaning when `mode` is `incremental`.** A consumer MUST refuse to run
    absence-based reconciliation on anything but `full`.
  type: string
  enum: [full, incremental]

SnapshotId:
  title: SnapshotId
  description: >-
    Identifies this consistent view.

    MUST be unique per generation and MUST NOT be reused. Deriving it from a business date is not
    sufficient: a re-run of the same night's extract under the same id lets a consumer stitch half of
    one view onto half of another while every page agrees on the identifier, which is the exact seam
    this field exists to prevent. Compare `generated_at` as well. Opaque, and stable for the whole
    walk.

    A server MUST hold the snapshot stable while it is being paged: records must not shift between
    pages because the underlying data changed mid-walk. Where an implementation cannot do that, it
    MUST issue a new `snapshot_id` and reject the stale cursor with `409` rather than quietly serving
    a mixture of two views — a consumer that reconciles across a shifted boundary loses rows in
    exactly the way this file exists to prevent.
  type: string
  minLength: 1
  maxLength: 128

SnapshotGeneratedAt:
  title: SnapshotGeneratedAt
  description: When the snapshot was taken. RFC 3339 with an explicit offset.
  type: string
  format: date-time

SnapshotTotalCount:
  title: SnapshotTotalCount
  description: >-
    Total records in the snapshot, counted as DISTINCT identities across all pages.

    MUST be identical on every page bearing the same `snapshot_id`. A consumer MUST fail the run if
    it varies mid-walk, because a changing total means the underlying view moved and the pages
    already fetched no longer describe one set.

    Counted distinct, and compared distinct, deliberately: a cursor that emits one record twice and
    skips another leaves the assembled COUNT correct while a live record is missing. Compare the size
    of the distinct set of identities assembled — not the number of items received.
  type: integer
  minimum: 0

SnapshotComplete:
  title: SnapshotComplete
  description: >-
    `true` on the final page of the walk, and only there. This is the flag a consumer's
    reconciliation gates on.

    A server MUST NOT send `complete: true` together with `page.next_cursor` — the two contradict
    each other, and a consumer gating on `complete` would stop early and treat the unfetched
    remainder as absent. A consumer MUST fail the run if it sees both.

    Required on every page precisely so that "the insurer never sends it" cannot deadlock a consumer
    that correctly refuses to reconcile without it.
  type: boolean
