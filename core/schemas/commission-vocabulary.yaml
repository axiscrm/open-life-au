# Open Life Data Standards (AU) — commission vocabulary.
#
# TWO INDEPENDENT VOCABULARIES, held together because they share a word and nothing else. Read the
# distinction before adding to either:
#
#   `CommissionType`  what a commission line already PAID was for. Response-only, and only the
#                     commissions contract sends it.
#   `CommissionBasis` which remuneration basis a premium was PRICED on. Travels in both directions,
#                     and it belongs to quoting rather than to statements — the basis is an INPUT to
#                     the price, not a description of a payment.
#
# ---------------------------------------------------------------------------------------------
#
# WHAT A COMMISSION LINE IS FOR, expressed as a shared enum instead of a status string each consumer
# pattern-matches.
#
# This exists because the alternative has a specific, silent failure. Across ten live insurer
# statements the same concept — commission on new business — arrives as at least six different
# strings: "Upfront", "NB", "New Business", "I", "NEW POLICY COMMISSION", "Indemnity Initial
# Commission". Each is recognised by one insurer's parser, and anything unrecognised falls through to
# a default. So when an insurer re-cases or renames its own value, that insurer's new-business
# commission silently reclassifies: the row count does not change, the total does not change, only
# the type does — and nothing in a reconciliation that balances on money would ever surface it.
#
# An enumerated type sent explicitly by the insurer removes the pattern-matching entirely.

$schema: https://json-schema.org/draft/2020-12/schema

CommissionType:
  title: CommissionType
  description: >-
    What a commission line is FOR. RESPONSE-facing and extensible: a consumer MUST pass an
    unrecognised value through rather than failing the statement, and MUST NOT silently map it onto
    a default — an unknown type reported as `renewal` is the exact defect this vocabulary removes.

    ## The sign carries direction; the type carries purpose

    Read this before adding a `clawback` value, because there deliberately is not one.

    A reversal is the SAME type with a NEGATIVE `amount`. A clawback of new-business commission is
    `new_business` with a negative amount, not a separate kind of thing. The alternative — a
    `clawback` type — means every consumer summing new-business commission has to know to subtract a
    second bucket, and the ones that forget report a book as more profitable than it is while every
    individual figure looks right.

    So: sum by type and the sign takes care of itself.

    ## The two that are not commission at all

    `advance` and `advance_repayment` are named separately for the opposite reason — they are NOT
    commission and must not be summed as though they were. An advance is money lent against
    commission not yet earned, and its repayment is servicing that loan rather than a reversal of
    earnings. A consumer reporting "commission earned this period" excludes both; one that treats an
    advance as upfront commission reports revenue that has not happened yet.

    ## Values

      - `new_business`       initial or upfront commission on newly written business
      - `renewal`            ongoing, trail or servicing commission on in-force business
      - `bonus`              volume, campaign or quality bonus paid on top of the above
      - `adviser_fee`        a fee the client agreed to, collected by the insurer and passed on.
                             Not commission the insurer decided to pay, and treated differently for
                             both disclosure and tax
      - `advance`            commission paid before it is earned. NOT earnings — see above
      - `advance_repayment`  recovery of an advance. NOT a clawback — see above
      - `adjustment`         a correction that cannot be attributed to one of the above, such as a
                             rate restatement across a book. Carries the insurer's own `description`
      - `other`              read `description` and `insurer_code`
  type: string
  x-extensible-enum:
    - new_business
    - renewal
    - bonus
    - adviser_fee
    - advance
    - advance_repayment
    - adjustment
    - other

CommissionBasis:
  title: CommissionBasis
  description: >-
    The remuneration basis a premium is priced on. REQUEST-facing and therefore CLOSED: an
    unrecognised value MUST be rejected with 422 `unsupported-value`, never priced as a default.

    ## This is a pricing input, not a bookkeeping detail

    The same cover, for the same insured, on the same product, costs a different amount on each of
    these. That is the whole reason it appears in a quoting contract: a consumer that omits it, or
    an insurer that ignores it, produces a premium that is correct arithmetic on the wrong question.
    Two lines priced on different bases are not comparable at all, and nothing about the numbers
    themselves says so — which is why every priced line has to declare the basis it used.

    ## The three bases

      - `upfront`  a large initial payment in the first year, a lower rate thereafter. The dearest
                   premium of the three
      - `hybrid`   a smaller initial payment and a higher ongoing rate
      - `level`    the same rate every year, initial and ongoing alike. The cheapest premium of the
                   three, and commonly the ONLY basis available on a benefit written at an older
                   age, where insurers withdraw the upfront and hybrid options entirely

    That last clause is the case worth designing for rather than discovering. An adviser sets one
    basis for the policy and one benefit in it falls outside what the insurer writes on that basis.
    That case is handled by the INSURER rather than by the request: the basis is requested once for
    the policy, declarable per cover in `GET /capabilities`, and REPORTED per cover on the way back
    via `CoverLine.commission`. A consumer does not pick the exception; it learns which benefit fell
    outside and on what basis the insurer wrote it instead.
  type: string
  enum:
    - upfront
    - hybrid
    - level

CommissionBasisResponse:
  title: CommissionBasisResponse
  description: >-
    `CommissionBasis` on the way back, extensible. A consumer MUST pass an unrecognised value
    through — displaying it, and treating the line as priced on a basis it does not know rather than
    as one of the three it does. Mapping an unknown basis onto `upfront` because it is the common
    default is the failure this split exists to prevent: it would put a line into a comparison as
    though its price were the upfront price.

    Same values as `CommissionBasis`. The two are separate schemas for the reason set out in
    `docs/VERSIONING.md` — request enums are closed so a typo fails, response enums are extensible
    so the standard can grow without every consumer breaking.
  type: string
  x-extensible-enum:
    - upfront
    - hybrid
    - level
