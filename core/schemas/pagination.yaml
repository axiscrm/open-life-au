# Open Life Data Standards (AU) — pagination.
#
# Cursor-based, not offset-based. Occupation lists run to several thousand rows and are
# maintained continuously, so an offset walk over a changing list silently skips and repeats
# rows. A cursor also lets an implementation choose its own storage without changing the
# contract.

$schema: https://json-schema.org/draft/2020-12/schema

Cursor:
  title: Cursor
  description: >-
    Opaque continuation token. Consumers MUST treat it as opaque, MUST NOT construct one, and
    MUST NOT assume it remains valid indefinitely — a server MAY expire cursors and answer an
    expired one with 400 `invalid-request`.
  type: string
  minLength: 1
  maxLength: 512

PageInfo:
  title: PageInfo
  description: >-
    Continuation state for a paged collection. Absence of `next_cursor` is the ONLY reliable
    signal that a walk is complete — consumers MUST NOT infer completion from a short page,
    because a server may return fewer items than requested for its own reasons.
  type: object
  additionalProperties: false
  properties:
    next_cursor:
      $ref: '#/Cursor'

# Deliberately NO total_count here.
#
# An earlier version carried one, documented as advisory and free to drift between pages. That put two
# count fields with opposite guarantees inside one response object: the policy snapshot's own
# `total_count`, which a consumer's reconciliation gate depends on being exact, and this one, which was
# explicitly not to be trusted. An insurer whose generic pagination layer populated only the advisory
# field would leave a consumer's safety check reading `undefined` and silently skipping — or, worse, a
# consumer would build the check on the field permitted to drift.
#
# A collection that needs an authoritative total declares it itself, at the top level, with its own
# guarantees stated. See `PolicyPage.total_count`.
