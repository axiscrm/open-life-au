# Open Life Data Standards (AU) — Quoting — headers.

XRequestId:
  description: >-
    Correlation identifier, echoed from the request or generated by the server when the request
    did not carry one. REQUIRED on every response, including errors.

    This is not ceremony. A consumer of several insurers investigating "the premium was wrong last
    Tuesday" has to be able to hand one token to one insurer's support desk; without it, the only
    shared identifier is a timestamp.
  required: true
  schema:
    type: string
    maxLength: 128
  example: '01JQ8Z9YB4T7M2XR5K3P'

SpecVersion:
  description: >-
    The version of this standard the response was produced against. Lets a consumer detect an
    implementation that has moved without announcement.
  schema:
    type: string
    pattern: '^\d+\.\d+\.\d+$'
  example: '0.1.0'

RateLimitPolicy:
  description: >-
    The quota in force, per RFC 9331 style. Advisory, but strongly RECOMMENDED: it lets a consumer
    pace a fan-out instead of discovering the limit by hitting it.
  schema:
    type: string
  example: '100;w=60'

RateLimitRemaining:
  description: Requests remaining in the current window.
  schema:
    type: integer
    minimum: 0
